<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muso Wireframes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f0f12;
      color: #f5f5f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container { width: 100%; max-width: 720px; }
    h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; }
    p.subtitle { color: #9a9aa2; margin-bottom: 2.5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
    a.card {
      display: block;
      padding: 1.5rem;
      background: #1a1a20;
      border: 1px solid #2a2a32;
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s, transform 0.2s, background 0.2s;
    }
    a.card:hover { border-color: #5b5bff; transform: translateY(-2px); background: #1f1f28; }
    a.card h2 { font-size: 1.15rem; margin-bottom: 0.35rem; }
    a.card span { color: #9a9aa2; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Muso Wireframes</h1>
    <p class="subtitle">Select a wireframe to view</p>
    <div class="grid">
      <a class="card" href="/muso-homepage.html">
        <h2>Homepage</h2>
        <span>Main homepage wireframe</span>
      </a>
      <a class="card" href="/muso-homepage-maxima.html">
        <h2>Homepage — Maxima</h2>
        <span>Alternate homepage variant</span>
      </a>
      <a class="card" href="/muso-booking-flow.html">
        <h2>Booking Flow</h2>
        <span>Booking flow wireframes</span>
      </a>
      <a class="card" href="/muso-admin-portal.html">
        <h2>Admin Portal</h2>
        <span>Admin portal wireframe</span>
      </a>
    </div>
  </div>
</body>
</html>
