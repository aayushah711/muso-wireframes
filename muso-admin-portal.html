<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuSo — Masters · Products, slots &amp; pricing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F3EF;--card:#FFFFFF;--ink:#15181C;--ink2:#666D72;--ink3:#959CA1;
  --rule:#E3E6E1;--rule2:#CDD2CB;--blue:#1F3FC4;--blue-wash:#EAEEFC;--blue-line:#C4CEF4;
  --ok:#0E7C6B;--warn:#B4690E;--stop:#B32E3E;--rail:#16191B;--rail-txt:#A6AEB3;
  --amber:#B4690E;--amber-wash:#FBF5EA;--amber-line:#E5D0AE;
  --teal:#0E7C6B;--teal-wash:#EDF7F5;--teal-line:#B6D9D2;
  --sans:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.app{display:grid;grid-template-columns:250px minmax(0,1fr);height:100vh;overflow:hidden}
.rail{background:var(--rail);color:var(--rail-txt);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:17px 18px 13px;border-bottom:1px solid #262B2E}
.brand-mark{font-weight:700;font-size:16px;letter-spacing:-.02em;color:#fff}
.brand-sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:#6E767B;display:block;margin-top:3px;line-height:1.6}
.rail-scroll{overflow-y:auto;flex:1;padding:10px 0 20px}
.rail-scroll::-webkit-scrollbar{width:8px}
.rail-scroll::-webkit-scrollbar-thumb{background:#2C3134;border-radius:8px}
.grp{margin:13px 0 3px;padding:0 16px;display:flex;align-items:center;gap:8px}
.grp-spine{width:3px;height:11px;border-radius:2px;flex:none}
.grp-name{font-size:9.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:#7B8388}
.mitem{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:6px 16px 6px 17px;font-size:12.5px;color:var(--rail-txt);position:relative;transition:background .12s,color .12s}
.mitem-step{font-family:var(--mono);font-size:9.5px;color:#585F63;width:14px;flex:none;text-align:right;letter-spacing:-.02em}
.mitem[aria-current="true"] .mitem-step{color:#fff}
.mitem:hover{background:#20252880;color:#DFE4E7}
.mitem[aria-current="true"]{background:#22282B;color:#fff;font-weight:500}
.mitem[aria-current="true"]::before{content:"";position:absolute;left:6px;top:7px;bottom:7px;width:2px;background:var(--fn);border-radius:2px}
.mitem-q{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--amber);border:1px solid #4A3A1E;background:#2A2416;border-radius:3px;padding:0 4px;min-width:15px;text-align:center}
.mitem-ok{margin-left:auto;font-size:9px;color:#4C5559}
.mitem[aria-current="true"] .mitem-ok{color:#6E7B72}
.rail-foot{padding:11px 18px;border-top:1px solid #262B2E;font-family:var(--mono);font-size:9.5px;color:#5E6669;line-height:1.7}

.stage{overflow-y:auto}
.stage-head{background:var(--card);border-bottom:1px solid var(--rule);padding:19px 28px 0;position:sticky;top:0;z-index:6}
.crumb{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.crumb b{color:var(--ink2);font-weight:500}
.head-row{display:flex;align-items:flex-start;gap:24px;margin-top:6px}
.h-title{font-size:21px;font-weight:600;letter-spacing:-.025em;margin:0}
.h-desc{margin:5px 0 0;color:var(--ink2);max-width:66ch;font-size:12.5px}
.head-actions{margin-left:auto;display:flex;gap:8px;flex:none;padding-top:3px;align-items:center}
.head-actions .form-err{margin:0 2px 0 0;white-space:nowrap}
.btn{border:1px solid var(--rule2);background:#fff;padding:6px 12px;border-radius:5px;font-size:12px;font-weight:500;transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--ink3);background:#FAFBF9}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{background:#1935AC;border-color:#1935AC}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px;padding-bottom:13px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:#FAFBF9;border-radius:20px;padding:3px 10px;font-size:11px;color:var(--ink2)}
.chip b{color:var(--ink);font-weight:500}
.chip-k{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.chip-src{background:var(--blue-wash);border-color:var(--blue-line);color:#1B2C6B}
.chip-src b{color:#1B2C6B}
.chip-inf{background:var(--amber-wash);border-color:var(--amber-line);color:#6E4408}
.chip-inf b{color:#6E4408}
.chip-step{background:var(--ink);border-color:var(--ink)}
.chip-step .chip-k{color:#8B9298}
.chip-step b{color:#fff}
.chip-free b{color:var(--ink3);font-weight:400}
.chip-clear{background:var(--teal-wash);border-color:var(--teal-line)}
.chip-clear .chip-k{color:#5E8A80}
.chip-clear b{color:var(--teal)}
.req-miss{display:inline-flex;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--stop);border:1px solid #E8C4C9;background:#FBEFF1;border-radius:3px;padding:1px 6px}
.pane{padding:22px 28px 60px;animation:rise .2s ease both}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:7px;border:1px solid var(--rule2);background:#fff;border-radius:5px;padding:6px 10px;min-width:220px}
.search span{color:var(--ink3);font-size:12px}
.search input{border:none;outline:none;font:inherit;font-size:12.5px;width:100%;background:none}
.filt{border:1px solid var(--rule2);background:#fff;border-radius:5px;padding:6px 10px;font-size:12px;color:var(--ink2)}
.filt::after{content:" ▾";color:var(--ink3)}
.tool-note{margin-left:auto;font-size:11.5px;color:var(--ink3)}

.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin-bottom:16px}
.card:last-child{margin-bottom:0}
.card-head{padding:12px 16px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-title{font-size:12px;font-weight:600}
.card-note{font-size:11.5px;color:var(--ink3);margin-left:auto}
.card-body{padding:14px 16px}

table{width:100%;border-collapse:collapse}
th{font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:9px 14px;border-bottom:1px solid var(--rule);white-space:nowrap;background:#FBFCFA}
td{padding:10px 14px;border-bottom:1px solid var(--rule);font-size:12.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr[data-row]{cursor:pointer;transition:background .1s}
tbody tr[data-row]:hover{background:#FAFBF9}
tbody tr[aria-selected="true"]{background:var(--blue-wash)}
tbody tr[aria-selected="true"] td:first-child{box-shadow:inset 2px 0 0 var(--blue)}
.code{font-family:var(--mono);font-size:11.5px;color:var(--ink2)}
.num{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.muted{color:var(--ink3)}
.sub{font-size:11px;color:var(--ink3);margin-top:1px}
.cond{border:1px solid var(--rule2);border-radius:8px;padding:12px 14px;margin-bottom:9px;background:#FBFCFA}
.cond-h{display:flex;align-items:flex-end;gap:11px;margin-bottom:11px;flex-wrap:wrap}
.cond-title{font-size:13.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.cond-sub{font-size:11.5px;color:var(--ink3);margin-top:2px}
.cond-n{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:10px;flex:none;margin-bottom:2px}
.cond-x{margin-left:auto;color:var(--ink3);font-size:16px;line-height:1;padding:0 4px;margin-bottom:6px}
.cond-x:hover{color:var(--stop)}
.cond-l{font-size:10px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px}
.cond-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px 12px}
.cond-note{font-size:12px;color:var(--ink3);font-style:italic}
@media (max-width:700px){.cond-grid{grid-template-columns:1fr}.cond-grid>div{grid-column:1!important}}
.faq{display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px;padding:15px 16px;border-bottom:1px solid var(--rule);align-items:start}
.faq:last-child{border-bottom:none}
.faq-f{font-size:12.5px;font-weight:600;color:var(--ink);word-break:break-word;padding-top:1px}
.faq-t{display:block;font-family:var(--mono);font-size:9.5px;color:#B2B8B3;font-weight:400;margin-top:2px}
.faq-b{min-width:0}
.faq-w{font-size:12.5px;color:var(--ink);line-height:1.6}
.faq-e,.faq-x{font-size:12px;line-height:1.6;margin-top:8px;padding:8px 11px;border-radius:6px}
.faq-e{background:#FBFCFA;border:1px solid var(--rule);color:var(--ink2)}
.faq-x{background:var(--amber-wash);border:1px solid var(--amber-line);color:#6E4408}
.faq-k{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;color:var(--ink3)}
.faq-x .faq-k{color:var(--amber)}
@media (max-width:720px){.faq{grid-template-columns:1fr;gap:7px}}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid;white-space:nowrap}
.pill-ok{color:var(--ok);border-color:var(--teal-line);background:var(--teal-wash)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.tag{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:4px;white-space:nowrap;border:1px solid}
.tag-t{background:var(--blue-wash);border-color:var(--blue-line);color:var(--blue)}
.tag-a{background:var(--teal-wash);border-color:var(--teal-line);color:var(--teal)}
.q{display:inline-flex;align-items:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);border:1px solid var(--amber-line);background:var(--amber-wash);border-radius:3px;padding:1px 6px}

.two{display:grid;grid-template-columns:minmax(0,1fr) 312px;gap:18px;align-items:start}
@media (max-width:1180px){.two{grid-template-columns:minmax(0,1fr)}}
/* ---- dashboard ---- */
.rail-div{height:1px;background:#2C3134;margin:9px 16px 4px}
.mitem-top{font-weight:600;color:#EDEFEA}
.mitem-ico{font-size:13px;width:14px;flex:none;text-align:center;color:var(--rail-txt)}
.mitem-top[aria-current="true"] .mitem-ico{color:#fff}
.dash-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start;margin-bottom:16px}
@media (max-width:1180px){.dash-row{grid-template-columns:minmax(0,1fr)}}
.set-v.pos{color:var(--ink)}
.kpi-sub{font-size:11px;color:var(--ink3);margin-top:7px;font-family:var(--mono);letter-spacing:.03em}
.kpi-sample{display:inline-block;font-size:9px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);border:1px solid var(--rule2);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle}
.bars{display:flex;align-items:flex-end;gap:9px;height:104px;padding:6px 2px 0}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;min-width:0}
.bar-track{width:100%;display:flex;align-items:flex-end;justify-content:center;height:78px}
.bar-fill{width:70%;background:var(--blue-wash);border:1px solid var(--blue-line);border-bottom:0;border-radius:5px 5px 0 0;min-height:3px}
.bar.today .bar-fill{background:var(--blue);border-color:var(--blue)}
.bar-x{font-size:10px;color:var(--ink3);font-family:var(--mono)}
.bar.today .bar-x{color:var(--blue);font-weight:600}
.bar-v{font-size:9.5px;color:var(--ink2);font-family:var(--mono)}
.meterrow{display:grid;grid-template-columns:120px 1fr 92px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--rule)}
.meterrow:first-child{border-top:0}
.meterrow .mname{font-size:12.5px;font-weight:500}
.meter{height:9px;background:var(--rule);border-radius:6px;overflow:hidden}
.meter-fill{height:100%;border-radius:6px}
.meter-fill.ok{background:var(--teal)}.meter-fill.low{background:var(--amber)}.meter-fill.sold{background:var(--stop)}
.meterrow .mnum{font-family:var(--mono);font-size:11.5px;color:var(--ink2);text-align:right}
.attn{display:flex;flex-direction:column}
.attn-row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 14px;border-top:1px solid var(--rule);background:none;cursor:pointer;transition:background .12s}
.attn-row:first-child{border-top:0}
.attn-row:hover{background:var(--paper)}
.attn-row .attn-n{font-size:9px;font-family:var(--mono);font-weight:600;min-width:22px;text-align:center;border-radius:5px;padding:2px 0}
.attn-row .attn-t{flex:1;font-size:12.5px;color:var(--ink)}
.attn-row .attn-go{font-size:15px;color:var(--ink3);flex:none}
.attn-warn .attn-n{color:var(--amber);background:var(--amber-wash)}
.attn-stop .attn-n{color:var(--stop);background:#FBEFF1}
.attn-info .attn-n{color:var(--blue);background:var(--blue-wash)}
.splitbar{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:4px 0 12px;background:var(--rule)}
.splitbar span{display:block;height:100%}
.legend{display:flex;gap:20px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:7px;vertical-align:middle}
.legend b{color:var(--ink);font-family:var(--mono)}
.cmp{display:flex;flex-direction:column;gap:11px}
.cmp-row{display:grid;grid-template-columns:82px 1fr auto;gap:11px;align-items:center}
.cmp-k{font-size:12px;color:var(--ink2)}
.cmp-bar{height:13px;border-radius:7px;background:var(--rule);overflow:hidden}
.cmp-fill{height:100%;border-radius:7px}
.cmp-v{font-family:var(--mono);font-size:12px;color:var(--ink);text-align:right}
.tier-silver{color:#5B6169;background:#EEF0F2;border-color:#D3D7DC}
.tier-gold{color:#8A5A00;background:var(--amber-wash);border-color:var(--amber-line)}
.tier-platinum{color:#4B3FA6;background:#ECEAFB;border-color:#CFC9F0}
.tier-x{color:var(--ink2);background:var(--paper);border-color:var(--rule2)}
.kpi-top{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.kpi-ico{width:34px;height:34px;flex:none;border-radius:9px;display:inline-flex;align-items:center;justify-content:center}
.kpi-ico svg{width:18px;height:18px;display:block}
.kpi-blue{background:var(--blue-wash);color:var(--blue)}
.kpi-teal{background:var(--teal-wash);color:var(--teal)}
.kpi-amber{background:var(--amber-wash);color:var(--amber)}
.kpi-top .set-k{margin:0}
.insp{background:var(--card);border:1px solid var(--rule);border-radius:8px}
.insp-head{padding:13px 16px;border-bottom:1px solid var(--rule);display:flex;align-items:flex-start;gap:10px}
.insp-code{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.insp-name{font-size:15px;font-weight:600;letter-spacing:-.015em;margin-top:2px}
.insp-body{padding:3px 16px 12px}
.f{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid #F0F2EE;align-items:baseline}
.f:last-child{border-bottom:none}
.f-k{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);line-height:1.6}
.f-v{font-size:12.5px}
.f-v q{quotes:none;font-style:italic;color:var(--warn)}
.insp-foot{padding:11px 16px;border-top:1px solid var(--rule);background:#FBFCFA;font-size:11.5px;color:var(--ink2)}

.note{border-radius:7px;padding:11px 14px;font-size:12.5px;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start}
.note-mark{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;flex:none;padding-top:3px}
.note-scope{border:1px solid var(--blue-line);background:var(--blue-wash);color:#1B2C6B}
.note-scope .note-mark{color:var(--blue)}
.note-open{border:1px solid var(--amber-line);background:var(--amber-wash);color:#6E4408}
.note-open .note-mark{color:var(--amber)}
.note b{font-weight:600}
.note ul{margin:6px 0 0;padding-left:17px}
.note li{margin:3px 0}

/* pools */
.pool{border:1px solid var(--rule);border-radius:8px;background:var(--card);padding:15px 16px;margin-bottom:12px}
.pool-shared{border-color:var(--blue-line);background:linear-gradient(#F8FAFF,#fff)}
.pool-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pool-name{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.pool-code{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.pool-cap{margin-left:auto;font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.02em}
.pool-cap small{font-size:10.5px;font-weight:400;color:var(--ink3);letter-spacing:0;margin-left:4px}
.pool-d{font-size:12px;color:var(--ink2);margin-top:6px;max-width:74ch}
.pool-draw{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;padding-top:11px;border-top:1px solid #F0F2EE}
.draw{font-family:var(--mono);font-size:10.5px;border:1px solid var(--rule2);background:#FAFBF9;border-radius:4px;padding:2px 8px;color:var(--ink2)}
.draw-in{border-color:var(--blue-line);background:var(--blue-wash);color:var(--blue)}
.draw-out{border-style:dashed;color:var(--ink3)}
.stack{display:flex;flex-direction:column;gap:0;margin:0 0 16px}
.stack-lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);margin:0 0 8px}
.arrow{text-align:center;color:var(--ink3);font-size:15px;line-height:1;margin:-4px 0 8px}

/* categories */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.cat{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:15px 16px}
.cat-top{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.cat-name{font-size:14px;font-weight:600}
.cat-code{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-left:auto}
.bound{display:flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin-bottom:11px}
.bound-cell{flex:1;padding:8px 10px}
.bound-cell+.bound-cell{border-left:1px solid var(--rule)}
.bound-k{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.bound-v{font-family:var(--mono);font-size:14px;font-weight:600;margin-top:1px}
.incl{font-size:10px;font-family:var(--mono);color:var(--blue)}
.incl.open{color:var(--amber)}
.sentence{font-size:12px;color:var(--ink2);background:#FAFBF9;border-left:2px solid var(--rule2);padding:8px 11px;border-radius:0 4px 4px 0}
.sentence em{font-style:normal;color:var(--ink);font-weight:500}

/* discounts */
.promo{display:flex;align-items:flex-start;gap:13px;background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:12px 15px;margin-bottom:8px}
.prec{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink3);width:24px;flex:none;padding-top:2px}
.promo-main{flex:1;min-width:0}
.promo-name{font-size:13.5px;font-weight:600}
.promo-line{font-size:11.5px;color:var(--ink2);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 12px}
.promo-line b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.promo-eg{font-size:11.5px;color:var(--ink3);margin-top:4px;font-style:italic}
.promo-right{flex:none}

/* settings */
.set{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:12px;margin-bottom:16px}
.setcard{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:14px 15px}
.set-k{font-size:12px;font-weight:600}
.set-d{font-size:11.5px;color:var(--ink2);margin-top:3px;min-height:46px}
.set-v{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:6px;display:flex;align-items:baseline;gap:6px}
.set-u{font-size:11px;font-weight:400;color:var(--ink3)}
.set-foot{margin-top:9px;padding-top:9px;border-top:1px solid #F0F2EE;font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.lock{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-family:var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--stop);border:1px solid #E8C4C9;background:#FBEFF1;border-radius:4px;padding:2px 7px}

.matrix-wrap{overflow-x:auto}
.matrix th.sticky,.matrix td.sticky{position:sticky;left:0;background:#fff;z-index:2;border-right:1px solid var(--rule)}
.matrix th.sticky{background:#FBFCFA;z-index:3}
.matrix tbody tr:hover td.sticky{background:#FAFBF9}
.matrix th.ctr,.matrix td.ctr{text-align:center}
.matrix th.split,.matrix td.split{border-left:1px solid var(--rule)}

/* form */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:18px}
.tab{padding:8px 14px;font-size:12.5px;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--blue)}
.form-body{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}
.product-form .fld.wide{grid-column:auto}
.form-sec{grid-column:1/-1;border:1px solid var(--rule2);border-radius:7px;overflow:hidden;background:#fff}
.form-sec-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--blue-line);background:var(--blue-wash)}
.form-sec-title{font-size:12.5px;font-weight:600;color:var(--blue)}
.form-sec-head .tip{margin-left:auto}
.section-card{border-color:var(--rule2);border-radius:7px}
.card-head-tint{padding:10px 14px;background:var(--blue-wash);border-bottom-color:var(--blue-line)}
.card-head-tint .card-title{font-size:12.5px;font-weight:600;color:var(--blue)}
.form-sec-body{padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;padding:4px 14px 10px}
.summary-grid .f{min-width:0}
.summary-grid .f-v{word-break:break-word}
.booking-split{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;align-items:start}
.booking-split .form-sec{grid-column:auto}
/* POS booking — broad buttons + steppers for reception/touch */
.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.pos-btn{border:1.5px solid var(--rule2);background:#fff;border-radius:10px;padding:13px 14px;text-align:left;transition:border-color .12s,box-shadow .12s;position:relative}
.pos-btn:hover:not(:disabled){border-color:var(--ink3)}
.pos-btn[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-wash)}
.pos-btn:disabled{opacity:.4;cursor:not-allowed}
.pos-btn-n{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.pos-btn-d{font-size:11px;color:var(--ink3);margin-top:3px}
.pos-btn-p{font-family:var(--mono);font-size:12.5px;margin-top:7px;color:var(--ink2)}
.pos-btn-q{margin-left:auto;font-family:var(--mono);font-size:11px;color:#fff;background:var(--blue);border-radius:20px;padding:1px 7px}
.pos-lbl{font-size:12px;font-weight:600;margin:2px 0 9px;display:flex;align-items:center;gap:8px}
.pos-lbl small{font-weight:400;color:var(--ink3);font-size:11.5px}
.pos-step{display:inline-flex;align-items:center;border:1px solid var(--rule2);border-radius:8px;overflow:hidden;flex:none}
.pos-step button{width:34px;height:34px;font-size:18px;color:var(--ink2);line-height:1}
.pos-step button:hover:not(:disabled){background:#F2F4F0}
.pos-step button:disabled{color:#CDD2CB;cursor:not-allowed}
.pos-step span{width:38px;text-align:center;font-family:var(--mono);font-size:14px;font-weight:600}
.pos-qty-row{display:flex;align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--rule);border-radius:7px;margin-bottom:7px}
.pos-qty-row .n{flex:1;font-size:13px;font-weight:500}
.pos-qty-row .p{font-family:var(--mono);font-size:12px;color:var(--ink3)}
/* "Pay for tickets" box — full price, full width; shown below the membership visit box for a member */
.pay-block{border:1px solid var(--rule2);border-radius:9px;padding:12px 13px;background:#FBFCFA}
.pay-block .pos-lbl{margin:0 0 11px}
.redeem-sub{font-size:11px;color:var(--ink2);margin-top:3px;line-height:1.4}
/* membership visit — full-width box with two checkboxes; one visit = 1 Adult + 1 Child, one per day */
.membership-box{border:1px solid var(--teal-line);background:var(--teal-wash);border-radius:10px;padding:12px 14px;margin:14px 0}
.membership-box-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.membership-box-title{font-size:12px;font-weight:600;color:var(--ok)}
.membership-box-stat{font-family:var(--mono);font-size:10.5px;color:var(--ink2)}
.membership-cbs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:680px){.membership-cbs{grid-template-columns:1fr}}
.mcb-row{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border:1px solid var(--teal-line);border-radius:8px;background:#fff;text-align:left;width:100%;transition:border-color .12s,background .12s}
.mcb-row:hover:not([disabled]){border-color:var(--teal)}
.mcb-row-on{border-color:var(--teal);background:var(--teal-wash)}
.mcb-row[disabled]{opacity:.55;cursor:not-allowed}
.mcb{flex:none;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--rule2);background:#fff;display:flex;align-items:center;justify-content:center;margin-top:1px}
.mcb-on{background:var(--teal);border-color:var(--teal)}
.mcb svg{width:12px;height:12px}
.mcb-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.mcb-txt b{font-size:12.5px;font-weight:600}
.mcb-txt span{font-size:11px;color:var(--ink2);line-height:1.4}
.pos-empty{font-size:12.5px;color:var(--ink3);padding:12px;border:1px dashed var(--rule2);border-radius:8px;text-align:center}
.pos-body{display:block!important}
.pos-body .pos-lbl{margin-top:16px}
.pos-body .pos-lbl:first-child{margin-top:0}
/* booking POS layout: sticky cart on the left, form card on the right */
.booking-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
/* both columns are fixed-height with their own internal scroll now, so the cart
   column no longer needs to stick separately — that's what was drifting it out
   of alignment with the left panel as the page scrolled */
.booking-cart-col{position:static}
/* the cart stays side-by-side through tablet widths, narrowing rather than dropping below the form */
@media (max-width:1100px){.booking-layout{grid-template-columns:minmax(0,1fr) 250px}}
@media (max-width:820px){.booking-layout{grid-template-columns:minmax(0,1fr) 220px}}
@media (max-width:680px){.booking-layout{grid-template-columns:1fr}.booking-cart-col{position:static}}
.disc-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.disc-summary-col{position:sticky;top:16px}
.disc-summary-col .card-body{font-size:12.5px}
@media (max-width:960px){.disc-layout{grid-template-columns:1fr}.disc-summary-col{position:static}}
.pos-pay{grid-template-columns:repeat(4,minmax(0,1fr))!important}
@media (max-width:560px){.pos-pay{grid-template-columns:repeat(2,1fr)!important}}
/* New order card gets a tinted background */
/* booking card fills the available screen height so the footer sits at the true bottom
   even on short steps (Customer, Attendees) — not just while a long step happens to scroll */
.booking-main>.card{background:linear-gradient(#F7F9FF,#fff);display:flex;flex-direction:column;height:calc(100vh - 79px);overflow:hidden}
.booking-main>.card>.card-head,.booking-main>.card>.wizard-steps,.booking-main>.card>.form-foot{flex:0 0 auto}
.booking-main>.card>.form-body{flex:1 1 auto;min-height:0;overflow-y:auto;align-items:start}
/* one configuration block per product added to the order */
.pos-item{border:1px solid var(--blue-line);background:#FBFCFF;border-radius:9px;padding:12px 13px;margin:10px 0}
.pos-item .pos-lbl:first-child{margin-top:0}
.ticket-inputs{display:grid;gap:10px}
.ticket-input-row{display:grid;grid-template-columns:minmax(0,1fr) auto 100px;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--rule);border-radius:6px}
.ticket-input-row .ticket-price{font-family:var(--mono);font-size:11.5px;color:var(--ink3)}
/* payment method + CTA stay docked at the bottom of the panel; only the cart lines above scroll */
.booking-summary{border:1px solid var(--blue-line);border-radius:7px;overflow:hidden;background:#fff;display:flex;flex-direction:column;height:calc(100vh - 79px)}
.booking-summary-head{padding:10px 12px;background:var(--blue-wash);border-bottom:1px solid var(--blue-line);font-size:12.5px;font-weight:600;color:var(--blue);flex:0 0 auto}
.booking-summary-body{padding:6px 12px;flex:1 1 auto;min-height:0;overflow-y:auto}
.booking-summary-row,.booking-summary-total{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:12px}
.booking-summary-row span:last-child,.booking-summary-total span:last-child{font-family:var(--mono)}
.booking-summary-total{border-bottom:0;font-weight:700;font-size:13px}
.booking-discount{display:flex;gap:7px;padding:10px 0;border-bottom:1px solid var(--rule)}
.booking-discount .inp{min-width:0}
.booking-discount-msg{min-height:16px;padding-top:5px;font-size:10.5px;color:var(--ink3)}
.booking-discount-msg.ok{color:var(--ok);font-weight:600}
.booking-discount-msg.bad{color:var(--stop)}
.child-req{font-size:10.5px;color:var(--ink3);padding:0 0 6px 2px;line-height:1.4}
.child-req-warn{color:var(--stop);font-weight:600}
.attendee-list{grid-column:1/-1;display:grid;gap:10px}
.attendee-row{display:grid;grid-template-columns:150px minmax(0,1fr) minmax(140px,.7fr) 92px;gap:12px;align-items:end;padding:11px 12px;border:1px solid var(--rule);border-radius:6px}
.attendee-kind{align-self:center;font-size:12px;font-weight:600;color:var(--ink2)}
.event-pricing-field{grid-column:1/-1}
.event-pricing-field>.lab{display:none}
.event-price-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.event-price-row{display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--rule);border-radius:6px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.wide{grid-column:1/-1}
.lab{display:flex;align-items:center;gap:7px}
.lab-n{font-size:12.5px;font-weight:600;letter-spacing:-.005em}
.lab-t{font-size:9.5px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--blue);background:var(--blue-wash);border-radius:3px;padding:1px 6px}
.lab-req{font-size:9px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-left:auto}
.fld-miss .inp{border-color:var(--stop);background:#FEF7F7}
.inp{border:1px solid var(--rule2);border-radius:5px;padding:7px 10px;font:inherit;font-size:12.5px;background:#fff;width:100%;transition:border-color .12s}
.readval{padding:7px 0;font-size:13px;color:var(--ink);min-height:20px}
.inp:hover{border-color:var(--ink3)}
.inp[readonly]{background:#F4F5F2;color:var(--ink2);cursor:default}
.inp[readonly]:hover{border-color:var(--rule2)}
.inp::placeholder{color:#B7BDB8}
.inp.mono{font-family:var(--mono);font-size:12px}
.selwrap{position:relative}
.selwrap::after{content:"▾";position:absolute;right:10px;top:8px;color:var(--ink3);font-size:10px;pointer-events:none}
.selwrap .inp{appearance:none;padding-right:26px;color:var(--ink2);cursor:pointer}
.form-sec.ta-host{overflow:visible}
.form-sec.ta-host>.form-sec-head{border-top-left-radius:7px;border-top-right-radius:7px}
.typeahead{position:relative}
.ta-menu{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:40;background:#fff;border:1px solid var(--rule);border-radius:8px;box-shadow:0 12px 30px rgba(20,25,20,.16);overflow:hidden;overflow-y:auto;max-height:244px}
.ta-item{display:flex;flex-direction:column;gap:1px;width:100%;text-align:left;padding:8px 12px;background:none;border:0;border-bottom:1px solid var(--rule2);cursor:pointer;font-size:12.5px}
.ta-item:last-child{border-bottom:0}
.ta-item:hover{background:var(--blue-wash)}
.ta-sub{font-size:11px;color:var(--ink3)}
.hint{font-size:11px;color:var(--ink2);margin:0;line-height:1.45}
.lab-tech{font-family:var(--mono);font-size:9.5px;color:#B2B8B3;margin:2px 0 0;letter-spacing:-.01em}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.inp-suffix{display:flex;align-items:center;border:1px solid var(--rule2);border-radius:5px;background:#fff;overflow:hidden;transition:border-color .12s}
.inp-suffix:hover,.inp-suffix:focus-within{border-color:var(--ink3)}
.inp-suffix .inp{border:0;border-radius:0;min-width:0}
.inp-suffix span{padding:0 10px;border-left:1px solid var(--rule);font-size:11.5px;color:var(--ink3);white-space:nowrap}
.sw{display:inline-flex;align-items:center;gap:9px;font-size:12px;color:var(--ink2);padding:4px 0}
.sw i{width:32px;height:18px;border-radius:20px;background:var(--rule2);position:relative;transition:background .15s;flex:none}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.sw[data-on="1"] i{background:var(--blue)}
.sw[data-on="1"] i::after{left:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;border:1px solid var(--rule2);border-radius:5px;padding:6px;min-height:34px}
.chipx{display:inline-flex;align-items:center;gap:6px;background:var(--blue-wash);border:1px solid var(--blue-line);color:var(--blue);border-radius:4px;padding:2px 7px;font-size:11px;font-family:var(--mono)}
.chip-add{border:1px dashed var(--rule2);color:var(--ink3);border-radius:4px;padding:2px 9px;font-size:11px}
.chip-opt{font-family:var(--mono);font-size:10.5px;transition:background .12s,color .12s,border-color .12s}
.chip-opt:hover{border-color:var(--ink3);color:var(--ink2)}
.chip-opt[data-on="1"]{border-style:solid;background:var(--blue-wash);border-color:var(--blue-line);color:var(--blue)}
.chip-opt[data-on="1"]::before{content:"✓ ";font-size:10px}
.picker{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pick{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule2);background:#fff;border-radius:6px;padding:6px 11px;font-size:12.5px;transition:border-color .12s,background .12s}
.pick:hover{border-color:var(--ink3)}
.pick[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-wash);font-weight:600;color:#16266E}
.pick-new{border-style:dashed;color:var(--ink3)}
.subs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:16px;overflow-x:auto}
.sub-tab{padding:7px 13px;font-size:12.5px;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.sub-tab:hover{color:var(--ink)}
.sub-tab[aria-selected="true"]{color:var(--blue);font-weight:600;border-bottom-color:var(--blue)}
.cond{grid-column:1/-1;border:1px solid var(--teal-line);background:var(--teal-wash);border-radius:7px;padding:0;overflow:hidden;transition:opacity .15s}
.cond-h{padding:9px 14px;border-bottom:1px solid var(--teal-line);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.cond-t{font-size:11.5px;font-weight:600;color:var(--teal)}
.cond-h .tip{margin-left:auto}
.cond-b{padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;background:#fff}
@media (max-width:640px){.cond-b{grid-template-columns:1fr}}
.rep{border:1px solid var(--rule2);border-radius:5px;overflow:hidden}
.rep-h,.rep-r{display:grid;gap:8px;padding:7px 10px;align-items:center}
.rep-h{background:#FBFCFA;border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.rep-r{border-bottom:1px solid var(--rule)}
.rep-r .inp{padding:5px 8px;font-size:11.5px}
.rep-add{padding:7px 10px;font-size:11.5px;color:var(--blue);width:100%;text-align:left;background:#FBFCFA}
.form-foot{padding:12px 20px;border-top:1px solid var(--rule);background:#FBFCFA;display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--ink2);flex-wrap:wrap}
.form-foot .btn:first-of-type{margin-left:auto}
.sys-r{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #F0F2EE;font-size:11.5px}
.sys-r:last-child{border-bottom:none}
.sys-r span:first-child{font-family:var(--mono);font-size:10.5px;color:var(--ink2)}
.sys-r span:last-child{color:var(--ink3);text-align:right}

@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .rail{max-height:180px}
  .stage-head{padding:16px 18px 0}.pane{padding:18px}
  .head-row{flex-wrap:wrap}.head-actions{margin:0;width:100%;order:3}
}
@media (max-width:720px){.booking-split{grid-template-columns:1fr}}
@media (max-width:640px){.attendee-row{grid-template-columns:1fr}}
@media (max-width:640px){.event-price-grid{grid-template-columns:1fr}}
@media (max-width:640px){.form-body,.form-sec-body,.summary-grid{grid-template-columns:1fr}.fld{grid-column:1/-1}}
/* product-version overrides: hide build-team scaffolding, neutralise status chips */
.lab-tech,.lab-t,.mitem-q,.mitem-ok,.chip-src,.chip-inf,.chip-clear,.faq-t,.faq-x,.hint{display:none!important}
.q,.req-miss{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;text-transform:none;color:var(--ink2);border:1px solid var(--rule2);background:#FAFBF9;border-radius:3px;padding:1px 6px}
.h-desc:empty{display:none}
/* hover tooltips — replace inline field hints and the field guide */
.tip{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;border:1px solid var(--rule2);color:var(--ink3);font-family:var(--mono);font-size:9px;font-style:italic;font-weight:600;cursor:help;flex:none;user-select:none}
.tip:hover,.tip:focus{border-color:var(--blue);color:var(--blue);outline:none}
.lab .tip{margin-left:1px}
.tipbox{position:fixed;transform:translate(-50%,-100%);background:var(--ink);color:#fff;padding:8px 11px;border-radius:6px;font-size:11.5px;line-height:1.5;max-width:290px;z-index:100;opacity:0;pointer-events:none;transition:opacity .1s;box-shadow:0 5px 16px rgba(20,25,20,.24)}
.tipbox .tip-impact{margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.16);color:#F2D6A8}
.tipbox .tip-impact span{font-family:var(--mono);font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;color:#E6B476;display:block;margin-bottom:2px}
.tipbox.on{opacity:1}
/* record list + detail/create/history pages */
.reclist tbody tr[data-open]{cursor:pointer}
.reclist tbody tr[data-open]:hover{background:#FAFBF9}
.pageback{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--ink2);margin-bottom:16px;padding:6px 11px;border:1px solid var(--rule2);border-radius:6px;background:#fff}
.pageback:hover{border-color:var(--ink3);background:#FAFBF9}
.detailhead{display:flex;align-items:center;gap:10px;margin:0 0 15px;flex-wrap:wrap}
.detailname{font-size:17px;font-weight:600;letter-spacing:-.02em;margin:0}
.drawer-layer{position:fixed;inset:0;z-index:90;display:flex;align-items:stretch;justify-content:flex-end;overflow:hidden}
.drawer-backdrop{position:absolute;inset:0;width:100%;height:100%;background:rgba(20,25,20,.32);cursor:default}
.drawer-panel{position:relative;flex:0 0 min(560px,94%);max-width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;background:#fff;box-shadow:-10px 0 30px rgba(20,25,20,.18);animation:drawer-in .18s ease-out both}
.drawer-panel .card-head{position:relative;flex:none;z-index:2;background:#fff}
.drawer-panel .form-body{flex:1;min-height:0;align-content:start;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.drawer-panel .form-foot{position:relative;flex:none;z-index:2;margin-top:0}
.cond-summary{background:var(--blue-wash);border:1px solid var(--blue-line);border-radius:7px;padding:9px 12px;font-size:12.5px;color:var(--ink);line-height:1.55}
.lnk{background:none;border:0;color:var(--blue);cursor:pointer;padding:0;font-size:11.5px}
.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink);cursor:pointer}
.chk input{width:15px;height:15px;flex:none;accent-color:var(--blue);cursor:pointer}
.seg2{display:inline-flex;border:1px solid var(--rule2);border-radius:7px;overflow:hidden;background:#fff}
.seg2-btn{border:0;background:none;padding:7px 15px;font-size:12.5px;font-weight:500;color:var(--ink2);cursor:pointer;border-right:1px solid var(--rule2)}
.seg2-btn:last-child{border-right:0}
.seg2-btn[data-on="1"]{background:var(--blue-wash);color:var(--blue);font-weight:600}
.lnk:hover{text-decoration:underline}
.msel-field{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:34px;padding:6px 30px 6px 8px;border:1px solid var(--rule2);border-radius:7px;background:#fff;cursor:pointer;position:relative}
.msel.open .msel-field{border-color:var(--blue-line)}
.msel-caret{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:9px}
.msel-ph{color:var(--ink3);font-size:12.5px}
.msel-tag{display:inline-flex;align-items:center;gap:5px;background:var(--blue-wash);border:1px solid var(--blue-line);color:var(--blue);border-radius:5px;padding:2px 5px 2px 8px;font-size:11.5px;font-family:var(--mono)}
.msel-tag button{color:var(--blue);font-size:14px;line-height:1}
.msel-pop{margin-top:6px;background:#fff;border:1px solid var(--rule2);border-radius:8px;box-shadow:0 6px 20px rgba(20,25,20,.12);padding:8px;max-height:250px;display:flex;flex-direction:column}
.msel-search{margin-bottom:6px;flex:none}
.msel-list{overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.msel-opt{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 9px;border-radius:6px;font-size:12.5px;text-align:left;color:var(--ink)}
.msel-opt:hover{background:var(--blue-wash)}
.msel-opt.on{background:var(--blue-wash);color:var(--blue);font-weight:500}
.msel-check{color:var(--blue);font-size:12px;flex:none}
.drawer-close{margin-left:auto;width:28px;height:28px;border:1px solid var(--rule2);border-radius:5px;color:var(--ink2);font-size:18px;line-height:1}
@keyframes drawer-in{from{transform:translateX(24px);opacity:.65}to{transform:none;opacity:1}}

/* ---- POS flow: inline cart edits, stronger slot hierarchy, customer lookup, prominent total, payment as final step ---- */
.pos-item-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.pos-item-name{font-size:12.5px;font-weight:700}
.pos-item-remove{margin-left:auto;font-size:10.5px;font-weight:500;color:var(--stop);border:1px solid #E8C4C9;background:#FBEFF1;border-radius:5px;padding:3px 9px;flex:none}
.pos-item-remove:hover{background:#F7D9DD}
.slot-group{border:1px solid var(--blue-line);background:var(--blue-wash);border-radius:9px;padding:11px 12px;margin-bottom:10px}
.slot-group-lbl{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--blue);margin-bottom:9px}
.slot-ico{font-size:12px}
.pos-grid-slots{gap:8px}
.pos-btn-slot{background:#fff;padding:10px 12px}
.pos-btn-slot .pos-btn-n{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:-.01em;display:block}
.pos-btn-slot .pos-btn-d{font-size:10.5px;margin-top:4px;color:var(--ink3)}
.pos-btn-slot[aria-pressed="true"]{background:var(--blue);border-color:var(--blue)}
.pos-btn-slot[aria-pressed="true"] .pos-btn-n,.pos-btn-slot[aria-pressed="true"] .pos-btn-d{color:#fff}
.cart-group{padding:10px 0;border-bottom:1px solid var(--rule)}
.cart-group:last-child{border-bottom:none}
.cart-group-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:5px}
.cart-group-name{font-size:12.5px;font-weight:700}
.cart-group-sub{font-size:10.5px;color:var(--ink3);font-family:var(--mono);white-space:nowrap}
.cart-line{display:flex;align-items:center;gap:10px;padding:5px 0}
.cart-line-cat{flex:1;min-width:0;font-size:12px;font-weight:500;color:var(--ink2)}
.cart-line-note{display:block;font-family:var(--mono);font-size:10px;font-weight:600;color:var(--amber);margin-top:2px}
.cart-line-redeemed{opacity:.9}
.cart-line-redeemed .cart-line-amt{color:var(--amber)}
.cart-line-amt{font-family:var(--mono);font-size:12px;min-width:52px;text-align:right}
.cart-step{display:inline-flex;align-items:center;border:1px solid var(--rule2);border-radius:6px;overflow:hidden;flex:none}
.cart-step button{width:22px;height:22px;font-size:13px;color:var(--ink2);line-height:1}
.cart-step button:hover{background:#F2F4F0}
.cart-step span{width:18px;text-align:center;font-family:var(--mono);font-size:11.5px;font-weight:600}
.cart-line-x{color:var(--ink3);font-size:13px;line-height:1;padding:2px 4px;flex:none}
.cart-line-x:hover{color:var(--stop)}
.booking-summary-count{font-family:var(--mono);font-size:9.5px;font-weight:400;color:#6B84D8;margin-left:6px}
.booking-summary-total{border-top:2px solid var(--ink);margin-top:4px;padding:12px 0 2px;font-weight:700;font-size:13.5px}
.booking-summary-total span:last-child{font-family:var(--mono);font-size:19px;color:var(--blue);letter-spacing:-.02em}
.head-running-total{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2);border:1px solid var(--rule2);background:#FAFBF9;border-radius:20px;padding:3px 11px}
.head-running-total b{font-family:var(--mono);font-size:13px;color:var(--blue)}
.fld{position:relative}
.cust-suggest{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--rule2);border-radius:7px;box-shadow:0 8px 20px rgba(20,25,20,.14);z-index:30;overflow:hidden}
.cust-suggest:empty{display:none}
.cust-suggest-row{display:flex;align-items:center;gap:8px;width:100%;padding:8px 11px;text-align:left;border-bottom:1px solid var(--rule)}
.cust-suggest-row:last-child{border-bottom:none}
.cust-suggest-row:hover{background:var(--blue-wash)}
.cust-suggest-name{font-size:12.5px;font-weight:600}
.cust-suggest-phone{font-family:var(--mono);font-size:11px;color:var(--ink3)}
/* matched-customer indicator lives inside the phone field itself, like a docked tab */
.inp-wrap{position:relative}
.inp-matched{padding-right:70px}
.cust-match-tab{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ok);background:var(--teal-wash);border:1px solid var(--teal-line);border-radius:4px;padding:3px 7px}
.cust-match-tab:hover{background:#DCEFEA;color:var(--stop);border-color:#E8C4C9}
.cust-match-tab-member{color:var(--amber);background:var(--amber-wash);border-color:var(--amber-line)}
.cust-match-tab-member:hover{background:#F5E4C2;color:var(--stop);border-color:#E8C4C9}
.sub-tab:disabled{color:var(--ink3);cursor:not-allowed;opacity:.55}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled:hover{border-color:var(--rule2);background:#fff}
.btn-primary:disabled:hover{background:var(--blue);border-color:var(--blue)}

/* ---- 3-step wizard header (Customer / Booking / Attendees) ---- */
.wizard-steps{display:flex;align-items:center;padding:14px 16px 0;flex-wrap:wrap}
.wizard-step{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink3);padding:4px 2px}
.wizard-step-n{width:20px;height:20px;border-radius:50%;background:var(--rule2);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:10px;flex:none}
.wizard-step-current{color:var(--ink)}
.wizard-step-current .wizard-step-n{background:var(--blue)}
.wizard-step-done{color:var(--ink2)}
.wizard-step-done .wizard-step-n{background:var(--ok)}
.wizard-step-line{flex:1;height:1px;background:var(--rule2);margin:0 8px;min-width:16px}
.wizard-hint{font-size:11.5px;color:var(--ink3);align-self:center}

/* ---- item cards: Products / Add-ons / Programs pickers, qty stepper on the right ---- */
.item-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.item-card{display:flex;align-items:center;gap:10px;border:1.5px solid var(--rule2);border-radius:10px;background:#fff;padding:11px 12px;transition:border-color .12s,box-shadow .12s}
.item-card-open{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-wash)}
.item-card-disabled{opacity:.5}
.item-card-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;text-align:left}
.item-card-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.item-card-meta{font-size:11px;color:var(--ink3)}
.item-card-step{flex:none}

/* ---- time-slot / batch availability ---- */
.slot-avail{display:block;margin-top:5px;font-family:var(--mono);font-size:10px;letter-spacing:.02em;color:var(--ink3)}
.slot-low{color:var(--warn);font-weight:600}
.slot-sold{color:var(--stop);font-weight:600}
.pos-btn-slot[aria-pressed="true"] .slot-avail{color:#D8E0FF}
.pos-btn-slot[aria-pressed="true"] .slot-low,.pos-btn-slot[aria-pressed="true"] .slot-sold{color:#FFE3B0}
.pos-btn:disabled .slot-avail{color:#B7BDB8}

/* ---- sub-tab counts (Products (2), Add-ons (1)…) ---- */
.sub-tab-count{display:inline-flex;align-items:center;justify-content:center;min-width:15px;height:15px;padding:0 4px;margin-left:5px;border-radius:20px;background:var(--blue);color:#fff;font-family:var(--mono);font-size:9.5px;font-weight:600}

/* ---- payment docked in the order summary — final step, revealed once the cart has items ---- */
.summary-pay{flex:0 0 auto;padding:12px;border-top:1px solid var(--rule);background:#fff}
.summary-pay-lbl{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}
.summary-pay-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:10px}
.summary-pay-btn{border:1.5px solid var(--rule2);background:#fff;border-radius:7px;padding:8px 6px;font-size:11.5px;font-weight:500;text-align:center}
.summary-pay-btn:hover{border-color:var(--ink3)}
.summary-pay-btn[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-wash);color:var(--blue);font-weight:600}
.summary-pay-cta{width:100%;text-align:center;padding:10px}

/* ---- POS mode: New/Edit Order gets the full screen, admin chrome hidden ---- */
.app.pos-mode .stage-head{display:none}

/* ---- date-driven time-slot picker: calendar + that day's available slots ---- */
.cal-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px}
@media (max-width:620px){.cal-layout{grid-template-columns:1fr}}
.cal-cal{background:#fff;border:1px solid var(--rule);border-radius:8px;padding:12px}
.cal-head{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:10px}
.cal-nav{width:22px;height:22px;border:1px solid var(--rule2);border-radius:5px;color:var(--ink2);font-size:13px;line-height:1}
.cal-nav:hover{border-color:var(--ink3);background:#F2F4F0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal-dow{font-family:var(--mono);font-size:9px;color:var(--ink3);padding:3px 0}
.cal-day,.cal-day-empty{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:11.5px;font-family:var(--mono);border:1px solid transparent;background:none;color:var(--ink);min-height:24px}
.cal-day:hover:not(:disabled){border-color:var(--blue-line);background:var(--blue-wash)}
.cal-day-off{color:#CDD2CB}
.cal-day-blackout{color:var(--stop);background:#FBEFF1;text-decoration:line-through;font-weight:600}
.cal-day-selected{background:var(--ink)!important;color:#fff!important;font-weight:700;text-decoration:none}
.cal-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:9.5px;color:var(--ink2)}
.cal-legend span{display:inline-flex;align-items:center;gap:5px}
.cal-legend i{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.cal-sw-blackout{background:#FBEFF1;border:1px solid var(--stop)}
.cal-sw-selected{background:var(--ink)}
.cal-slots-head{font-size:12.5px;font-weight:600;margin-bottom:9px}
.cal-slots-head small{font-weight:400;color:var(--ink3);margin-left:6px}
.cal-slots-count{font-weight:700;color:var(--blue);margin-left:6px}
.cal-slot-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;border:1.5px solid var(--rule2);border-radius:8px;padding:10px 13px;margin-bottom:8px;background:#fff;transition:border-color .12s,box-shadow .12s}
.cal-slot-row:last-child{margin-bottom:0}
.cal-slot-row:hover:not(:disabled){border-color:var(--ink3)}
.cal-slot-row-selected{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-wash)}
.cal-slot-row:disabled{opacity:.55;cursor:not-allowed}
.cal-slot-left{display:flex;align-items:center;gap:10px;min-width:0}
.cal-slot-check{flex:none;width:16px;height:16px;border-radius:4px;border:1.5px solid var(--rule2);background:#fff;position:relative;transition:background .12s,border-color .12s}
.cal-slot-check-on{background:var(--blue);border-color:var(--blue)}
.cal-slot-check-on::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.cal-slot-time{font-family:var(--mono);font-weight:700;font-size:13.5px}
.cal-slot-sub{font-size:10.5px;color:var(--ink3);margin-top:2px}
.cal-slot-right{flex:none;text-align:right}
.cal-slot-price{font-family:var(--mono);font-size:10.5px;color:var(--ink2);margin-top:5px}
.cal-slot-remaining{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink);margin-top:3px}
.cal-pill{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 8px;border-radius:20px;white-space:nowrap}
.cal-pill-ok{background:var(--teal-wash);color:var(--teal)}
.cal-pill-low{background:var(--amber-wash);color:var(--amber)}
.cal-pill-off{background:#F0F1EE;color:var(--ink3)}

/* ---- cancel-order confirmation, same escape-the-card pattern as the existing drawer ---- */
.confirm-layer{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center}
.confirm-backdrop{position:absolute;inset:0;width:100%;height:100%;background:rgba(20,25,20,.4);cursor:default}
.confirm-box{position:relative;background:#fff;border-radius:10px;padding:22px 24px;max-width:360px;width:90%;box-shadow:0 20px 50px rgba(20,25,20,.28);animation:drawer-in .15s ease-out both}
.confirm-title{font-size:15px;font-weight:700;letter-spacing:-.01em;margin:0 0 8px}
.confirm-body{font-size:12.5px;color:var(--ink2);line-height:1.55;margin:0 0 18px}
/* ---- Careers (admin: listings + routing) ---- */
.tool-sel .inp{padding:6px 10px;font-size:12px;min-width:158px}
.toolbar .search{min-width:310px;flex:0 1 340px}
.tool-sel{position:relative}
.career-jd-p{margin:0;font-size:12.5px;color:var(--ink2);line-height:1.65}
.inp[readonly]{background:#FBFCFA;color:var(--ink2);cursor:default}
.career-acts{display:flex;gap:6px;white-space:nowrap}
.pill-blue{color:var(--blue);border-color:var(--blue-line);background:var(--blue-wash)}
/* the ratio reads as one rule, so it takes the row under the pair above it */
.product-form .fld[data-df="adult_child_ratio"]{grid-column:1/-1}
.ratio-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:7px}
.ratio-row .chk{flex:none}
.ratio-n{width:56px;text-align:center;padding:5px 6px;font-size:12.5px}
.ratio-sel .inp{padding:5px 26px 5px 9px;font-size:12px;min-width:132px}
.ratio-sel .inp:disabled{background:#FBFCFA;color:var(--ink3)}
.ratio-n:disabled{background:#FBFCFA;color:var(--ink3)}
.ratio-x{font-size:12.5px;color:var(--ink2)}
.ratio-msg{font-size:11.5px;color:var(--ink3);margin-top:3px;min-height:16px}
.ratio-msg.is-bad{color:var(--stop);font-weight:500}
.th-sort{font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;
  display:inline-flex;align-items:center;gap:5px;padding:0;white-space:nowrap}
.th-sort:hover{color:var(--ink)}
.th-arrow{font-size:8px;line-height:1;color:var(--n-200);position:relative;top:-1px}
.th-sort:hover .th-arrow{color:var(--ink3)}
.th-sort.is-on{color:var(--blue)}
.th-sort.is-on .th-arrow{color:var(--blue);font-size:7px}
th:has(.th-sort){padding:0}
th .th-sort{padding:9px 14px}
.career-title{min-width:210px}
.career-title b{display:block}
.career-sub{font-size:11px;color:var(--ink3);margin-top:2px;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.45}
.career-loc{font-size:12px;min-width:150px}
.career-left{font-size:10.5px;font-family:var(--mono);color:var(--ink3);margin-top:3px}
.career-left.is-soon{color:var(--warn);font-weight:600}
.career-left.is-past{color:var(--stop);font-weight:600}
.career-tmpl{font-family:var(--mono);font-size:11.5px;line-height:1.65;white-space:pre-wrap;
  margin:0;padding:12px 13px;border:1px solid var(--rule);border-radius:5px;background:#FBFCFA;
  max-height:none;overflow:auto;color:var(--ink2)}
.career-subj{font-size:12.5px;padding:8px 11px;border:1px solid var(--rule);border-radius:5px;
  background:#FBFCFA;word-break:break-word}
.career-hint{font-size:11px;color:var(--ink3);margin-top:2px}
.career-file{padding:7px 10px;font-size:12px;cursor:pointer;background:#fff}
.career-file::file-selector-button{font:inherit;font-size:11.5px;font-weight:500;margin-right:10px;
  padding:4px 11px;border:1px solid var(--rule2);border-radius:5px;background:#FBFCFA;
  color:var(--ink);cursor:pointer}
.career-file::file-selector-button:hover{border-color:var(--ink3)}
.form-err{color:var(--stop);font-size:12px;margin-right:auto}
.fld.is-miss .lab-n{color:var(--stop)}
.fld.is-miss .inp{border-color:var(--stop)}
.career-mail-h{grid-column:1/-1;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink3);border-top:1px solid var(--rule);
  padding-top:15px;margin-top:5px}
.app-file{font-family:var(--mono);font-size:11px;background:var(--blue-wash);
  border:1px solid var(--blue-line);color:var(--blue);border-radius:3px;padding:2px 7px;
  display:inline-block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  vertical-align:bottom;cursor:pointer;text-align:left}
.app-file:hover{background:var(--blue-line);border-color:var(--blue)}
.app-file:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.app-note{font-size:11.5px;color:var(--ink2);min-width:170px;max-width:206px;line-height:1.5}
.app-qual{font-size:12px;min-width:150px;max-width:220px;line-height:1.45}
.app-port{font-size:12px;max-width:190px}
.app-port-miss{font-size:11.5px;color:var(--ink3)}
/* Every question occupies exactly two lines whether it needs them or not, and the
   "more" link keeps its line even when hidden — so every collapsed row is the same
   height and the list stays a list. Only an opened row grows. */
#qryTable td{vertical-align:top}          /* an opened question grows downward, so the
                                             rest of the row reads from the top too */
.qry-text{font-size:12.5px;color:var(--ink2);min-width:340px;max-width:560px;line-height:1.6}
.qry-q{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;

const FAQ_CAMPS = [["The workshop",[
 ["Short code|code","The identifier on reports and attendee lists.","KIN for Kinetic Kids.","Immutable once a batch has been sold."],
 ["Name visitors see|title","The listing title.","“Kinetic Kids”.","Renaming it changes what a resent confirmation would say for a batch already booked."],
 ["Category|category_id","Which section of What's On it appears under, and whether it runs as a single session or multi-day batches.","Summer Camp.","Comes from the Program categories master, so marketing can add a category without a release."],
 ["Subtitle|subtitle","The line under the title on the listing.","Creativity • Design Thinking • Problem Solving.","Marketing copy, not a rule. Nothing validates against it."],
 ["Minimum age|min_age","The youngest a child the workshop is meant for.","9, from §2's “Children 9+ Yrs”.","Age is collected but not mandatory, so this cannot be enforced. It is shown on the listing and beside the age field, and a parent who books outside it is not stopped."],
 ["Where it runs|location_text","Printed on the confirmation and the reminder.","Museum of Solutions, Lower Parel.","Free text. If a batch runs somewhere else, that is a per-batch fact this field cannot express."],
 ["Default seats|capacity","The number a newly added batch starts with.","9, from §2.","This is only a starting value — <b>each batch owns its own number</b>. Changing it here does not touch batches already created, which is what the copy control on the Pricing tab is for."],
 ["Bookings close this long before it starts|cutoff_days / cutoff_hours","Days then hours before the batch begins.","2 and 0, so a Tuesday batch closes on the Sunday.","Measured from <b>each batch's</b> start, not the workshop's — August stays open long after July has closed. Two days is comfortable for a camp buying materials per child; set both to zero and someone books at midnight for a ten o'clock start."],
 ["Tax rates that can apply|tax_rate_ids[]","The rate rows that could apply.","All three components.","Place of supply picks which fire, exactly as for a ticket."],
 ["Invoice code|hsn_sac_id","The code this invoices under.","SAC 999692.","A workshop is a service like admission, so it shares the code. If MuSo ever charges separately for materials, that part would need its own."],
 ["Description|description","The listing copy, with formatting.","Five mornings of building things that move.","§2 gives this a formatted text area, separate from the one-line subtitle. Both appear on the page and they are not interchangeable."],
 ["Photos and video|media[]","Files shown on the listing.","Four images and a video for Kinetic Kids.","The first image is the What\u2019s On card. Upload them in the wrong order and the card shows the wrong picture, which nothing warns you about."],
 ["Children may attend without an adult|unaccompanied_allowed","Whether a younger child can be booked with no adult on the same booking.","On for Kinetic Kids and the robotics taster, which are drop-offs. Off for the storytelling afternoon, which an adult sits through.","This is the setting that suspends the ticket type\u2019s own rule, and it belongs to the activity rather than the age band — two listings on the same band can differ. Setting it off while the band offers no adult ticket makes the listing unsellable, and the master refuses that pair rather than letting it reach the booking page."],
 ["Age filter|age_filter_id","Which band this appears under on What\u2019s On.","9 years and over.","Not the same as the minimum age. This is browsing — leave it blank and the listing appears under no age filter at all, so a parent narrowing by age never finds it."],
 ["Page title|seo_title","The headline a search engine shows.","Kinetic Kids summer camp at MuSo, Mumbai.","Falls back to the name when blank, which is usually too short to be useful in a search result."],
 ["Meta description|seo_description","The two lines under that headline.","A five-day making camp for children 9 and over\u2026","Around 155 characters before it is cut. Left blank, the search engine picks whatever the page starts with, which is often a navigation menu."],
 ["Web address|url_handle","The last part of the page address.","kinetic-kids gives muso.in/whats-on/kinetic-kids.","Changing it after the page has been shared breaks every existing link. Treat it as fixed once published."],
 ["Status|status","Where this sits between written and retired.","Draft while it is being built; Active once it is on sale.","<b>Draft is not the same as unavailable.</b> A draft has never been on the site; paused is a live page that has stopped taking bookings, which is what you want when a batch fills mid-season; archived takes it off the site but keeps its history."]]],

 ["Each batch",[
 ["Batch name|name","What a parent picks between.","“Batch 1”.","§2 shows parents choosing “Batch 1 (July 14th–18th)”, so the dates matter more than the name. A name alone is not enough to choose by."],
 ["Runs between|start_date / end_date","The first and last day.","14 to 18 July.","Two batches of the same workshop must not overlap if the same instructor runs both — nothing here checks that."],
 ["Days it runs|days_of_week[]","Which days between those dates.","Tue to Sat.","§2 also allows “every x days”, for a workshop that meets weekly over two months rather than daily over one week."],

/* An HSN / SAC code carries multiple tax-rate components. These read the CGST + SGST (intra-state) breakup off it. */
const hsnTaxCodes = code => { const h=hsnByCode(code); return (h&&h.tax)||[]; };
const hsnComponents = code => hsnTaxCodes(code).filter(c=>/^(CGST|SGST)/.test(c)).map(c=>({name:(RATE(c)||{}).name||c,pct:(RATE(c)||{}).pct||0}));
const hsnTotalPct = code => hsnComponents(code).reduce((a,c)=>a+c.pct,0);
const hsnHalfPct = code => { const cg=hsnTaxCodes(code).find(c=>/^CGST/.test(c)); return (RATE(cg)||{}).pct||0; };
/* Format the components of an HSN as "CGST 6% + SGST 6%". */
const hsnCompLabel = code => hsnComponents(code).map(c=>`${c.name} ${c.pct}%`).join(" + ");

/* Log an email event carrying its content so the timeline can show "View email". */
function schoolLogEmail(rec, who, what, kind){ (rec.timeline=rec.timeline||[]).unshift({on:fmtDMY(new Date()), who, what, email:schoolComposeEmail(rec,kind)}); }
/* Backfill seed timeline entries that represent an outbound email (status changes,
   "emailed"/"Email sent", proforma) with a viewable snapshot, so historical events
   carry the same "View email" affordance as live ones. Inbound events (enquiry
   received, check-in, payment recorded) are left alone. Called once at startup
   (after all helpers/consts are initialised). */
function schoolBackfillEmails(){ SCHOOL_BOOKINGS.forEach(rec=>{ (rec.timeline||[]).forEach(en=>{
  if(en.email) return;
  const w=en.what||"";
  if(/Enquiry received/i.test(w)) en.email = schoolComposeEmail(rec,"ack");   // acknowledgement mail sent back on a website enquiry
  else if(/Status\s*→|emailed|Email sent|proforma/i.test(w)) en.email = schoolComposeEmail(rec, /Status\s*→/.test(w)?"status":"booking");
}); }); }
/* A booking with any payment against it is Confirmed (or further) — its status is then
   driven automatically by payment and the visit date and cannot be set by hand. */
const schoolStatusLocked = rec => !!(rec && (rec.payments||[]).some(p=>+p.amount>0));
/* Drive status from payment: any receipt confirms the booking (partial → Confirmed),
   clearing the balance takes it Live. Never downgrades a manual Lost / Rejected. */
function schoolAdvanceOnPayment(rec){
  const c=schoolCompute(rec);
  if(c.balance<=0){ if(["Open","In Discussion","Confirmed"].includes(rec.status)){ rec.status="Live"; schoolLog(rec,"System","Paid in full. Status → Live."); } }
  else if(["Open","In Discussion"].includes(rec.status)){ rec.status="Confirmed"; schoolLog(rec,"System","Payment received — booking confirmed. Status → Confirmed (now locked)."); }
}
/* Totals — mirrors shopSaleCompute's shape. Complementary heads are ₹0; a flat
   18% GST (CGST 9 + SGST 9) applies, e-invoice only when a GSTIN is on file. */
function schoolCompute(rec){
  const visits=rec.visits||[];
  const students=visits.reduce((a,v)=>a+(+v.students||0),0);
  const adults=visits.reduce((a,v)=>a+(+v.adults||0),0);
  const escorts=visits.reduce((a,v)=>a+(+v.escorts||0),0);
  const teachersComp=visits.reduce((a,v)=>a+(+v.teachersComp||0),0);
  const visitTotal=students*(+rec.entryStudent||0)+adults*(+rec.entryAdult||0);
  // Food & F&B now lives on each visit — aggregate across all visits.
  let foodTotal=0, foodStudents=0, foodAdults=0, foodComp=0;
  visits.forEach(v=>{ const f=v.food||{};
    foodStudents+=+f.students||0; foodAdults+=+f.adults||0; foodComp+=+f.comp||0;
    const rate=(f.optionIds||[]).reduce((acc,nm)=>{const o=fbByName(nm);return o?{adult:acc.adult+(+o.adult||0),child:acc.child+(+o.child||0)}:acc;},{adult:0,child:0});
    foodTotal+=(+f.students||0)*rate.child+(+f.adults||0)*rate.adult; });
  const subtotal=visitTotal+foodTotal;
  const gstPct=18, gst=Math.round(subtotal*gstPct/100), cgst=Math.round(gst/2), sgst=gst-cgst;
  const grand=subtotal+gst;
  const paid=(rec.payments||[]).reduce((a,p)=>a+(+p.amount||0),0);
  const balance=Math.max(0,grand-paid);
  return {students,adults,escorts,teachersComp,visitTotal,foodTotal,foodStudents,foodAdults,foodComp,subtotal,gstPct,gst,cgst,sgst,grand,paid,balance,
          eInv:!!(rec.gstin&&rec.gstin.trim())};
}

const SCHOOL_EXPORT_NAMES={school:"school-records.csv","school-boards":"school-by-board.csv","school-repeat":"school-repeat-visitors.csv"};
function schoolExportRows(kind){
  if(kind==="school-boards"){
    const map={}; SCHOOL_BOOKINGS.forEach(r=>{const c=schoolCompute(r);(r.boards||[]).forEach(b=>{const m=map[b]||(map[b]={board:b,recs:0,students:0,rev:0});m.recs++;m.students+=c.students;if(["Confirmed","Live","Ended"].includes(r.status))m.rev+=c.grand;});});
    return [["Board","Records","Students","Revenue"]].concat(Object.values(map).map(m=>[m.board,m.recs,m.students,Math.round(m.rev)]));
  }
  if(kind==="school-repeat"){
    const map={}; SCHOOL_BOOKINGS.forEach(r=>{const m=map[r.school]||(map[r.school]={school:r.school,visits:0,students:0});m.visits++;m.students+=schoolCompute(r).students;});
    return [["School","Records","Students"]].concat(Object.values(map).filter(m=>m.visits>1).map(m=>[m.school,m.visits,m.students]));
  }
  return [["ID","School","Location","POC","Phone","Status","Students","Adults","Grand total","Paid","Balance"]].concat(
    SCHOOL_BOOKINGS.map(r=>{const c=schoolCompute(r);return [r.id,r.school,r.location,r.poc,r.phone,r.status,c.students,c.adults,c.grand,c.paid,c.balance];}));
}

const timeToMin = t => { const m=/(\d{1,2}):(\d{2})/.exec(t||""); return m?(+m[1]*60 + +m[2]):null; };
/* Everything blocking a venue on a date: seeded cross-module bookings + the current
   draft's own other optionals on the same venue/date (so it flags its own clashes). */
function venueDayBookings(venue,date,src,skip){
  const list = VENUE_BOOKINGS.filter(b=>b.venue===venue && b.date===date).map(b=>Object.assign({},b));
  const d = src==="sponsored"?spDraft:schoolDraft;
  if(d && Array.isArray(d.visits)) d.visits.forEach((v,vi)=>(v.optionals||[]).forEach((o,oi)=>{
    if(skip && skip.vi===vi && skip.oi===oi) return;
    if(o.venue!==venue || o.date!==date) return;
    const p=(o.time||"").split(/[–-]/).map(s=>s.trim());
    const s=o.start||p[0]||"", e=o.end||p[1]||"";
    if(!s && !e) return;
    list.push({venue,date,start:s,end:e,module:(src==="sponsored"?"Sponsored":"School"),by:d.school||"This booking",purpose:o.kind||"Visit block",status:"This booking"});
  }));
  return list.sort((a,b)=>(timeToMin(a.start)||0)-(timeToMin(b.start)||0));
}
/* Inline verdict banner for the "Check availability" button. */
function optCheckBanner(chk){
  if(!chk) return "";
  const c = chk.status==="ok" ? "background:#eaf7ee;border:1px solid #bfe6cb;color:#1e7f3c"
          : chk.status==="clash" ? "background:#fdeceb;border:1px solid #f2b8b5;color:#9b2c2c"
          : "background:#fff7e6;border:1px solid #f0d38a;color:#8a6100";
  return `<div class="optcheck-result" style="margin-top:8px;padding:8px 11px;border-radius:6px;font-size:12px;${c}">${escHtml(chk.msg)}</div>`;
}
/* Bookings on a venue/date that overlap a proposed start–end (excluding the block being edited). */
function venueClashCheck(venue,date,start,end,src,skip){
  const ps=timeToMin(start), pe=timeToMin(end);
  if(ps==null||pe==null) return [];
  return venueDayBookings(venue,date,src,skip).filter(b=>{const bs=timeToMin(b.start),be=timeToMin(b.end);return bs!=null&&be!=null&&bs<pe&&be>ps;});
}
/* Compute the "Check availability" verdict for one optional block (from the draft). */
function runVenueCheck(src,vi,oi){
  const d = src==="sponsored"?spDraft:schoolDraft;
  const o = (((d||{}).visits||[])[vi]||{}).optionals||[];
  const opt = o[oi] || {};
  const p=(opt.time||"").split(/[–-]/).map(s=>s.trim());
  const st=opt.start||p[0]||"", en=opt.end||p[1]||"";
  if(!opt.venue||!opt.date||!st||!en) return {src,vi,oi,status:"incomplete",msg:"Fill Venue, Date, Start and End time first."};
  const cl=venueClashCheck(opt.venue,opt.date,st,en,src,{vi,oi});
  if(!cl.length) return {src,vi,oi,status:"ok",msg:`No clashes — ${opt.venue} is free ${st}–${en} on ${opt.date}.`};
  const f=cl[0];
  return {src,vi,oi,status:"clash",msg:`Clashes with ${f.module} · ${f.by} (${f.start}–${f.end})${cl.length>1?` and ${cl.length-1} more`:""} on ${opt.venue}.`};
}
/* Scan every venue block on a draft booking for clashes — used on Create / Save. */
function bookingClashes(src){
  const d = src==="sponsored"?spDraft:schoolDraft;
  const out=[];
  (((d||{}).visits)||[]).forEach((v,vi)=>(v.optionals||[]).forEach((o,oi)=>{
    const p=(o.time||"").split(/[–-]/).map(s=>s.trim());
    const st=o.start||p[0]||"", en=o.end||p[1]||"";
    if(!o.venue||!o.date||!st||!en) return;
    const cl=venueClashCheck(o.venue,o.date,st,en,src,{vi,oi});
    if(cl.length){ const f=cl[0]; out.push(`${o.venue} ${st}–${en} on ${o.date} — clashes with ${f.module} · ${f.by} (${f.start}–${f.end})${cl.length>1?` +${cl.length-1} more`:""}`); }
  }));
  return out;
}
/* Live-toggle an optional's Check-availability button as its fields fill, and clear a stale verdict. */
function syncOptCheckBtn(rowEl){
  const val=n=>{const el=rowEl.querySelector('[data-vof="'+n+'"],[data-spvof="'+n+'"]');return el?el.value.trim():"";};
  const ok = !!(val("venue")&&val("date")&&val("start")&&val("end"));

  if(btn) btn.disabled=!ok;
  venueCheck=null;
  const r=rowEl.querySelector(".optcheck-result"); if(r) r.remove();
}

const shopCatByName = n => SHOP_CATEGORIES.find(c=>c.name===n);
function shopPdFor(cat){ const c=shopCatByName(cat); if(!c) return ""; const n=SHOP_ITEMS.filter(x=>x.cat===cat).length+1; return c.code+"-"+String(n).padStart(5,"0"); }
const shopItemByPd = pd => SHOP_ITEMS.find(x=>x.pd===pd);
/* Barcodes live per unit, not per product: a 13-digit EAN-style code "89" + 5-digit PD + 6-digit unit number. */
function shopUnitBarcode(pd,n){ const num=String(pd).replace(/\D/g,"").padStart(5,"0").slice(-5); return "89"+num+String(n).padStart(6,"0"); }
/* Ensure an item carries one barcode per unit on hand — tops up when stock grows (create / Add stock). */
function ensureShopBarcodes(it){ it.barcodes=it.barcodes||[]; const need=Math.max(0,+it.stock||0); while(it.barcodes.length<need) it.barcodes.push(shopUnitBarcode(it.pd,it.barcodes.length+1)); return it.barcodes; }
SHOP_ITEMS.forEach(ensureShopBarcodes);   // seed each product's unit barcodes from its opening stock
const shopItemByBarcode = bc => SHOP_ITEMS.find(x=>(x.barcodes||[]).some(b=>String(b)===String(bc).trim()));
/* GST% for an item comes from its HSN / SAC code, which carries the tax-rate components (intra-state = CGST + SGST); falls back to any rate rows on the item itself. */
const shopGstPct = it => hsnTotalPct(it&&it.hsn) || (it&&it.tax||[]).filter(c=>/^(CGST|SGST)/.test(c)).reduce((a,c)=>a+((RATE(c)||{}).pct||0),0);
const shopHalfPct = it => hsnHalfPct(it&&it.hsn) || (()=>{ const cg=(it&&it.tax||[]).find(c=>/^CGST/.test(c)); return (RATE(cg)||{}).pct||0; })();  // CGST (= SGST) half
/* Selling price (the GST-inclusive MRP) and the pre-tax Base = Selling − GST, both computed live from the HSN rate — never the stored base field, which can be stale. */
const shopSellingOf = it => +((it&&it.mrp)||0);
const shopBaseOf = it => { if(!it||!it.pd) return 0; const selling=shopSellingOf(it), gstPct=shopGstPct(it); const gstAmt=(selling&&gstPct)?Math.round(selling*gstPct/(100+gstPct)):0; return selling-gstAmt; };
