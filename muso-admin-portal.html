function bookingForm(editing=false){
  const record=editing?BOOKINGS[selBooking]:null;
  const products=P.filter(p=>p.type==="Product" || (p.type==="Add-on" && p.standalone));
  const programs=PROGRAMS();
  const PCATS=CATS.map(c=>c.name); // programs are priced per seat; ask by the same visitor categories
  // resolvers
  const slotOf=(idx,cfg)=>{const p=P[idx];return p.slots.find(s=>s.n===cfg.slot)||p.slots[0];};
  const addonSlotOf=(code,cfg)=>{const a=P.find(x=>x.c===code);return a.slots.find(s=>s.n===cfg.slot)||a.slots[0];};
  const progRec=key=>{const [k,idx]=key.split(":");return k==="event"?EVENTS[+idx]:WORKSHOPS[+idx];};
  const progBatchOf=(key,cfg)=>{const r=progRec(key);return r.batches[cfg.batch||0]||r.batches[0]||{};};
  const qtySum=cfg=>Object.values((cfg&&cfg.qty)||{}).reduce((a,n)=>a+ +n,0)+Object.values((cfg&&cfg.redeem)||{}).reduce((a,n)=>a+ +n,0);
  // line totals
  const prodLine=(i,cfg)=>{const p=P[i],s=slotOf(i,cfg);return p.cats.reduce((t,c)=>t+((cfg.qty&&cfg.qty[c])||0)*(s.price[c]||0),0);};
  const addonLine=(code,cfg)=>{const a=P.find(x=>x.c===code),s=addonSlotOf(code,cfg);return a.cats.reduce((t,c)=>t+((cfg.qty&&cfg.qty[c])||0)*(s.price[c]||0),0);};
  const progLine=(key,cfg)=>{const b=progBatchOf(key,cfg);return PCATS.reduce((t,c)=>t+((cfg.qty&&cfg.qty[c])||0)*(b.price||0),0);};
  // ---- membership: staff explicitly allocates each Product ticket to either "Redeem from
  // membership" (free, drawn from the shared pass pool) or "Pay for tickets" (full price) — no
  // automatic first-come allocation. Add-ons stay paid but get the member's add-on discount rate
  // instead of being free. Programs are untouched — the pass pool doesn't cover camps/workshops/
  // events. ----
  const member=bookingCustomer.member;
  const passesRemainingBefore=member?Math.max(0,member.passesTotal-member.passesUsed):0;
  const productRedemption=new Map(); // "i|category" -> {redeemed,paid,amount}
  let totalRedeemedThisOrder=0;
  [...bookingProducts].forEach(([i,cfg])=>{const p=P[i],s=slotOf(i,cfg);
    p.cats.forEach(c=>{
      const paid=(cfg.qty&&cfg.qty[c])||0, redeemed=(cfg.redeem&&cfg.redeem[c])||0;
      if(!paid&&!redeemed) return;
      totalRedeemedThisOrder+=redeemed;
      productRedemption.set(i+"|"+c,{redeemed,paid,amount:paid*(s.price[c]||0)});
    });
  });
  const passesRemainingAfter=Math.max(0,passesRemainingBefore-totalRedeemedThisOrder);
  const redeemedTillDate=member?member.passesUsed+totalRedeemedThisOrder:0; // lifetime, including this order
  const productPaidTotal=[...productRedemption.values()].reduce((t,r)=>t+r.amount,0);
  const addonRawTotal=[...bookingAddons].reduce((t,[c,cf])=>t+addonLine(c,cf),0);
  const progTotal=[...bookingPrograms].reduce((t,[k,cf])=>t+progLine(k,cf),0);
  const subtotal=productPaidTotal+addonRawTotal+progTotal;
  const productInCart=[...bookingProducts.values()].some(cfg=>qtySum(cfg)>0);
  const hasItems=productInCart||[...bookingAddons.values()].some(cfg=>qtySum(cfg)>0)||[...bookingPrograms.values()].some(cfg=>qtySum(cfg)>0);
  const discount=DISCOUNTS.find(d=>d.status==="Approved"&&(d.cond||[]).some(c=>String(c.code||"").toUpperCase()===bookingDiscountCode.toUpperCase()));
  const discAmt=discount?(String(discount.v).includes("%")?subtotal*(parseFloat(discount.v)||0)/100:Math.min(subtotal,parseFloat(String(discount.v).replace(/[^0-9.]/g,""))||0)):0;
  const addonDiscountPct=member?(member.addonDiscountPct||0):0;
  const addonDiscountAmt=addonRawTotal*addonDiscountPct/100;
  const gst=Math.round((subtotal-discAmt-addonDiscountAmt)*0.18);
  const grand=subtotal-discAmt-addonDiscountAmt+gst;
  const section=(title,body)=>`<section class="form-sec"><div class="form-sec-head"><span class="form-sec-title">${title}</span></div><div class="form-sec-body">${body}</div></section>`;
  const step=(pfx,cat,q)=>`<div class="pos-qty-row"><span class="n">${cat}</span><span class="p">${money(q.price)} each</span><span class="pos-step"><button data-book-qty="${pfx}|${escAttr(cat)}|-1" ${q.n===0?"disabled":""}>−</button><span>${q.n}</span><button data-book-qty="${pfx}|${escAttr(cat)}|1">+</button></span></div>`;
  const slotBadge=(s)=>{const left=slotLeft(s),st=availState(left,s.cap);if(!st)return"";const cls=st.key==="sold"?" slot-sold":st.key==="low"?" slot-low":"";return `<span class="slot-avail${cls}">${st.label} · ${left}/${s.cap}</span>`;};
  // ---- date-driven slot picker: calendar on the left, that day's slots on the right ----
  const slotBar=(pfx,list,cfg)=>{
    const selDate=cfg.date||defaultDateFor(list);
    const base=currentCalBaseDate(); // slotBar only renders for the currently-open item
    const y=base.getFullYear(),m=base.getMonth();
    const first=new Date(y,m,1),startBlank=dayIndexMon0(first),daysInMonth=new Date(y,m+1,0).getDate();
    const cells=[]; for(let i=0;i<startBlank;i++) cells.push(null); for(let d=1;d<=daysInMonth;d++) cells.push(new Date(y,m,d));
    const calBody=cells.map(d=>{
      if(!d) return '<span class="cal-day cal-day-empty"></span>';
      const ds=fmtDMY(d),blackout=isBlackout(ds),avail=slotsForDate(list,ds).length>0,selected=ds===selDate;
      const cls="cal-day"+(selected?" cal-day-selected":"")+(blackout?" cal-day-blackout":"")+(!avail&&!blackout?" cal-day-off":"");
      return (avail&&!blackout)||selected
        ? `<button class="${cls}" data-book-cal-date="${pfx}|${ds}" title="${blackout?"Blackout":avail?"":"No slots"}">${d.getDate()}</button>`
        : `<span class="${cls}">${d.getDate()}</span>`;
    }).join("");
    const cal=`<div class="cal-cal">
      <div class="cal-head"><button class="cal-nav" data-book-cal-nav="-1" aria-label="Previous month">‹</button><span>${MONTHS[m]} ${y}</span><button class="cal-nav" data-book-cal-nav="1" aria-label="Next month">›</button></div>
      <div class="cal-grid">${WEEKDAYS.map(w=>`<span class="cal-dow">${w}</span>`).join("")}${calBody}</div>
      <div class="cal-legend"><span><i class="cal-sw-blackout"></i>Blackout / Public Holiday</span><span><i class="cal-sw-selected"></i>Selected</span></div>
    </div>`;
    const candidates=slotsForDate(list,selDate);
    const dOf=parseDMY(selDate);
    const dayLabel=dOf?`${WEEKDAYS[dayIndexMon0(dOf)]} ${dOf.getDate()} ${MONTHS[dOf.getMonth()]}`:selDate;
    const rows=candidates.length?candidates.map(s=>{
      const left=slotLeft(s),sold=left<=0,cur=s.n===cfg.slot,st=availState(left,s.cap)||{key:"ok",label:"Available"};
      const pill=st.key==="sold"?["cal-pill-off",st.label]:st.key==="low"?["cal-pill-low",st.label]:["cal-pill-ok",st.label];
      return `<button class="cal-slot-row${cur?" cal-slot-row-selected":""}" data-book-slot="${pfx}|${escAttr(s.n)}" ${sold&&!cur?"disabled":""}>
        <div class="cal-slot-main"><div class="cal-slot-time">${s.t1}–${s.t2}</div><div class="cal-slot-sub">${s.n}</div></div>
        <div class="cal-slot-right"><span class="cal-pill ${pill[0]}">${pill[1]}</span><div class="cal-slot-price">${money(s.price.Adult||0)} / ticket</div>${s.cap!=null?`<div class="cal-slot-remaining">${left}/${s.cap}</div>`:""}</div>
      </button>`;
    }).join(""):`<div class="pos-empty">${isBlackout(selDate)?"Closed — blackout date.":"No slots run on this day."}</div>`;
    const list2=`<div class="cal-slots"><div class="cal-slots-head">Available Slots <small>${dayLabel}</small></div>${rows}</div>`;
    return `<div class="slot-group"><div class="cal-layout">${cal}${list2}</div></div>`;
  };
  const itemCard=(key,open,badgeQty,name,meta,disabled)=>`<div class="item-card${open?" item-card-open":""}${disabled?" item-card-disabled":""}">
    <button class="item-card-main" data-book-card="${key}" aria-expanded="${open}" ${disabled?"disabled":""}>
      <div class="item-card-name">${name}</div>
      <div class="item-card-meta">${meta}</div>
    </button>
  </div>`;

  // ---- PRODUCTS tab ----
  const productCards=products.map(p=>{
    const i=P.indexOf(p),key="prod|"+i,cfg=bookingProducts.get(i),open=bookingOpenItem===key;
    const cat0=p.cats[0],curSlot=cfg?slotOf(i,cfg):firstAvailableSlot(p.slots);
    const qtyNow=(cfg&&cfg.qty&&cfg.qty[cat0])||0,totalQty=cfg?qtySum(cfg):0;
    const from=Math.min(...p.slots.map(s=>s.price.Adult||Infinity));
    const meta=`${p.type==="Add-on"?"Add-on · ":""}${p.slots.length} slot${p.slots.length===1?"":"s"} · from ${money(from)}`;
    return itemCard(key,open,totalQty,p.n,meta);
  }).join("");
  const redeemStep=(pfx,cat,price,n,disablePlus)=>`<div class="pos-qty-row pos-qty-row-redeem"><span class="n">${cat}</span><span class="p"><s>${money(price)}</s></span><span class="pos-step"><button data-book-redeem="${pfx}|${escAttr(cat)}|-1" ${n===0?"disabled":""}>−</button><span>${n}</span><button data-book-redeem="${pfx}|${escAttr(cat)}|1" ${disablePlus?"disabled":""}>+</button></span></div>`;
  const productDetails=[...bookingProducts].filter(([i])=>bookingOpenItem==="prod|"+i).map(([i,cfg])=>{
    const p=P[i],s=slotOf(i,cfg);
    const remaining=globalPassesRemaining();
    const redeemSection=member?`<div class="redeem-block">
      <div class="redeem-head">
        <div><div class="pos-lbl" style="margin:0">Redeem from your membership</div><div class="redeem-sub">Included visits, free of charge — mix any ticket types, up to what your membership covers.</div></div>
        <div class="redeem-stat"><span class="redeem-stat-used">${redeemedTillDate} of ${member.passesTotal} used</span><span class="redeem-stat-left">${remaining} remaining</span></div>
      </div>
      ${p.cats.map(c=>redeemStep("prod|"+i,c,s.price[c]||0,(cfg.redeem&&cfg.redeem[c])||0,remaining<=0)).join("")}
    </div>`:"";
    const payLbl=member?`<div class="pos-lbl" style="margin:0 0 11px;display:block"><div>Pay for tickets</div><div class="redeem-sub">For anyone in the group who isn't using the membership — priced for the ${s.t1}–${s.t2} slot.</div></div>`:`<div class="pos-lbl">${p.n} · tickets</div>`;
    const payBlock=`<div class="pay-block">${payLbl}${p.cats.map(c=>step("prod|"+i,c,{price:s.price[c]||0,n:(cfg.qty&&cfg.qty[c])||0})).join("")}</div>`;
    const ticketSections=member?`<div class="ticket-cols">${redeemSection}${payBlock}</div>`:payBlock;
    return `<div class="pos-item"><div class="pos-item-head"><span class="pos-item-name">${p.n}</span></div>${slotBar("prod|"+i,p.slots,cfg)}${ticketSections}</div>`;
  }).join("");
  const productsTab=`<div class="item-cards">${productCards}</div>${productDetails}`;

  // ---- ADD-ONS tab ----
  const bookableAddons=P.filter(p=>p.type==="Add-on" && p.standalone && !bookingProducts.has(P.indexOf(p)));
  const addonCards=bookableAddons.map(a=>{
    const key="addon|"+a.c,cfg=bookingAddons.get(a.c),open=bookingOpenItem===key;
    const cat0=a.cats[0],curSlot=cfg?addonSlotOf(a.c,cfg):firstAvailableSlot(a.slots);
    const qtyNow=(cfg&&cfg.qty&&cfg.qty[cat0])||0,totalQty=cfg?qtySum(cfg):0;
    const meta=`Add-on · from ${money(a.slots[0].price.Adult||0)}`;
    return itemCard(key,open,totalQty,a.n,meta,!productInCart);
  }).join("");
  const addonDetails=[...bookingAddons].filter(([code])=>bookingOpenItem==="addon|"+code).map(([code,cfg])=>{
    const a=P.find(x=>x.c===code);if(!a)return"";const s=addonSlotOf(code,cfg);
    return `<div class="pos-item"><div class="pos-item-head"><span class="pos-item-name">${a.n}</span></div>${slotBar("addon|"+code,a.slots,cfg)}<div class="pos-lbl">${a.n} · tickets</div>${a.cats.map(c=>step("addon|"+code,c,{price:s.price[c]||0,n:(cfg.qty&&cfg.qty[c])||0})).join("")}</div>`;
  }).join("");
  const addonsTab=`${productInCart?"":'<div class="pos-lbl"><small>— add a product to the order first</small></div>'}<div class="item-cards">${addonCards}</div>${addonDetails}`;

  // ---- PROGRAMS tab ----
  const programCards=programs.map(p=>{
    const progKey=p.kind+":"+p.idx,key="prog|"+progKey,cfg=bookingPrograms.get(progKey),open=bookingOpenItem===key;
    const r=p.rec,batches=r.batches||[];
    const bIdx=cfg?(cfg.batch||0):Math.max(0,batches.findIndex(b=>slotLeft(b)>0));
    const curBatch=batches[bIdx]||{};
    const qtyNow=(cfg&&cfg.qty&&cfg.qty[PCATS[0]])||0,totalQty=cfg?qtySum(cfg):0;
    const meta=`${r.cat} · ${money(curBatch.price||0)}`;
    return itemCard(key,open,totalQty,r.n,meta);
  }).join("");
  const programDetails=programs.filter(p=>bookingOpenItem==="prog|"+p.kind+":"+p.idx).map(p=>{
    const progKey=p.kind+":"+p.idx,cfg=bookingPrograms.get(progKey);if(!cfg)return"";
    const r=p.rec,b=progBatchOf(progKey,cfg);
    return `<div class="pos-item"><div class="pos-item-head"><span class="pos-item-name">${r.n}</span></div><div class="pos-lbl">${r.n} · batch</div><div class="pos-grid">${(r.batches||[]).map((bb,bi)=>{const soldOut=slotLeft(bb)<=0,cur=(cfg.batch||0)===bi;return `<button class="pos-btn" data-book-batch="${progKey}|${bi}" aria-pressed="${cur}" ${soldOut&&!cur?"disabled":""}><div class="pos-btn-n">${bb.n}</div><div class="pos-btn-d">${bb.from}${bb.to&&bb.to!==bb.from?" – "+bb.to:""}</div><div class="pos-btn-p">${money(bb.price)}</div>${slotBadge(bb)}</button>`;}).join("")}</div><div class="pos-lbl">${r.n} · seats</div>${PCATS.map(c=>step("prog|"+progKey,c,{price:b.price||0,n:(cfg.qty&&cfg.qty[c])||0})).join("")}</div>`;
  }).join("");
  const programsTab=`<div class="item-cards">${programCards}</div>${programDetails}`;

  // ---- attendees (one per ticket) — step 3 ----
  const heads=[];
  const collect=(items,recFn,catsFn)=>items.forEach(([id,cfg])=>{const nm=recFn(id);catsFn(id).forEach(c=>{const total=((cfg.qty&&cfg.qty[c])||0)+((cfg.redeem&&cfg.redeem[c])||0);for(let n=0;n<total;n++)heads.push({label:nm+" · "+c+" "+(n+1), cat:c});});});
  collect([...bookingProducts],i=>P[i].n,i=>P[i].cats);
  collect([...bookingAddons],code=>(P.find(x=>x.c===code)||{}).n,code=>(P.find(x=>x.c===code)||{cats:[]}).cats);
  collect([...bookingPrograms],key=>progRec(key).n,()=>PCATS);
  const attendeesTab = heads.length ? `<div class="pos-lbl">Attendee details <small>one per ticket</small></div><div class="attendee-list">${heads.map((h,idx)=>{const child=/child/i.test(h.cat||"");const req=child?'<span class="lab-req">Required</span>':'';const rq=child?" required aria-required=\"true\"":"";return `<div class="attendee-row"><div class="attendee-kind">${h.label}</div><div class="fld"><div class="lab"><span class="lab-n">Name</span>${req}</div><input class="inp"${rq} placeholder="Full name"></div><div class="fld"><div class="lab"><span class="lab-n">Date of birth</span></div><input class="inp mono" data-dob="${idx}" placeholder="DD/MM/YYYY"></div><div class="fld"><div class="lab"><span class="lab-n">Age</span>${req}</div><input class="inp mono" id="age_${idx}"${rq} placeholder="Years" aria-live="polite"></div></div>`;}).join("")}</div>` : `<div class="pos-empty">Add tickets first — attendees appear here.</div>`;

  // ---- step 2 sub-tabs, each labelled with how many tickets are already in it ----
  const prodCount=[...bookingProducts.values()].reduce((s,c)=>s+qtySum(c),0);
  const addonCount=[...bookingAddons.values()].reduce((s,c)=>s+qtySum(c),0);
  const progCount=[...bookingPrograms.values()].reduce((s,c)=>s+qtySum(c),0);
  const tabDefs=[["products","Products",prodCount],["addons","Add-ons",addonCount],["programs","Programs",progCount]];
  const tabBar=`<div class="subs">${tabDefs.map(([k,l])=>`<button class="sub-tab" data-book-tab="${k}" aria-selected="${bookingTab===k}">${l}</button>`).join("")}</div>`;
  const tabContent={products:productsTab,addons:addonsTab,programs:programsTab}[bookingTab]||productsTab;
  const bookingStepBody=`<section class="form-sec"><div class="form-sec-head"><span class="form-sec-title">What to book</span></div>
    ${tabBar}<div class="form-sec-body pos-body">${tabContent}</div></section>`;
  const attendeesStepBody=`<section class="form-sec"><div class="form-sec-head"><span class="form-sec-title">Attendee details</span></div><div class="form-sec-body pos-body">${attendeesTab}</div></section>`;

  // ---- order summary — grouped by product/slot, running total, inline qty edit + removal on every line, payment docked at the bottom ----
  const cartCatLine=(pfx,cat,qty,price,amount,note,useRedeemControl)=>{ amount=amount==null?qty*price:amount; const attr=useRedeemControl?"data-book-redeem":"data-book-qty"; return `<div class="cart-line${useRedeemControl?" cart-line-redeemed":""}">
    <div class="cart-line-cat">${cat}${note?` <span class="cart-line-note">${note}</span>`:""}</div>
    <span class="cart-step"><button ${attr}="${pfx}|${escAttr(cat)}|-1" aria-label="Fewer ${cat}">−</button><span>${qty}</span><button ${attr}="${pfx}|${escAttr(cat)}|1" aria-label="More ${cat}">+</button></span>
    <span class="cart-line-amt">${money(amount)}</span>
    <button class="cart-line-x" ${attr}="${pfx}|${escAttr(cat)}|-${qty}" aria-label="Remove ${cat}">✕</button>
  </div>`; };
  const cartGroup=(name,sub,linesHtml)=>`<div class="cart-group">
    <div class="cart-group-head"><span class="cart-group-name">${name}</span><span class="cart-group-sub">${sub}</span></div>
    ${linesHtml}
  </div>`;
  const cartRows=[];
  [...bookingProducts].forEach(([i,cfg])=>{const p=P[i],s=slotOf(i,cfg);
    const lines=p.cats.flatMap(c=>{const r=productRedemption.get(i+"|"+c); if(!r) return [];
      const out=[];
      if(r.redeemed>0) out.push(cartCatLine("prod|"+i,c,r.redeemed,0,0,"Covered by membership",true));
      if(r.paid>0) out.push(cartCatLine("prod|"+i,c,r.paid,s.price[c]||0,r.amount,""));
      return out;
    }).join("");
    if(lines) cartRows.push(cartGroup(p.n,cfg.date?`${cfg.date} · ${s.t1}–${s.t2}`:s.n,lines));});
  [...bookingAddons].forEach(([code,cfg])=>{const a=P.find(x=>x.c===code);if(!a)return;const s=addonSlotOf(code,cfg);
    const lines=a.cats.map(c=>{const q=(cfg.qty&&cfg.qty[c])||0;return q?cartCatLine("addon|"+code,c,q,s.price[c]||0):"";}).filter(Boolean).join("");
    if(lines) cartRows.push(cartGroup(a.n,cfg.date?`${cfg.date} · ${s.t1}–${s.t2}`:s.n,lines));});
  [...bookingPrograms].forEach(([key,cfg])=>{const r=progRec(key),b=progBatchOf(key,cfg);
    const lines=PCATS.map(c=>{const q=(cfg.qty&&cfg.qty[c])||0;return q?cartCatLine("prog|"+key,c,q,b.price||0):"";}).filter(Boolean).join("");
    if(lines) cartRows.push(cartGroup(r.n,b.n||r.cat,lines));});
  const summaryPay=hasItems?`<div class="summary-pay">
    <div class="summary-pay-lbl">Payment method</div>
    <div class="summary-pay-grid">${["Cash","Card","UPI","Voucher"].map(m=>`<button class="summary-pay-btn" data-book-pay="${escAttr(m)}" aria-pressed="${bookingPay===m}">${m}</button>`).join("")}</div>
    ${editing?"":`<button class="btn btn-primary summary-pay-cta">Take payment · ${money(grand)}</button>`}
  </div>`:"";
  const summary=`<aside class="booking-summary"><div class="booking-summary-head">Order summary${cartRows.length?` <span class="booking-summary-count">${cartRows.length} item${cartRows.length===1?"":"s"}</span>`:""}</div><div class="booking-summary-body">
    ${cartRows.length?cartRows.join(""):`<div class="pos-empty">Nothing added yet.<br>Pick a product or program to begin.</div>`}
    <div class="booking-discount"><input class="inp mono" id="bookingDiscountCode" placeholder="Discount code" value="${escAttr(bookingDiscountCode)}"><button class="btn" data-apply-book-discount="1">Apply</button></div>
    ${bookingDiscountTried?`<div class="booking-discount-msg${discount?" ok":" bad"}">${discount?`✓ ${discount.n} applied — ${discount.v} off`:"Code not recognised or expired."}</div>`:""}
    <div class="booking-summary-row"><span>Subtotal</span><span>${money(subtotal)}</span></div>
    ${discAmt?`<div class="booking-summary-row" style="color:var(--ok)"><span>${discount.v} discount applied</span><span>− ${money(discAmt)}</span></div>`:""}
    ${addonDiscountAmt?`<div class="booking-summary-row" style="color:var(--amber)"><span>★ ${member.tier} Add-on Discount (${addonDiscountPct}%)</span><span>− ${money(addonDiscountAmt)}</span></div>`:""}
    ${(discAmt||addonDiscountAmt)?`<div class="booking-summary-row" style="font-weight:600"><span>Net amount</span><span>${money(subtotal-discAmt-addonDiscountAmt)}</span></div>`:""}
    <div class="booking-summary-row"><span>GST 18%</span><span>${money(gst)}</span></div>
    <div class="booking-summary-total"><span>Total due</span><span>${money(grand)}</span></div>
  </div>${summaryPay}</aside>`;

  // ---- customer — phone-first lookup against past orders, not just blank entry — step 1 ----
  const custMatch=bookingCustomerLinked>=0?CUSTOMERS[bookingCustomerLinked]:null;
  const customerSection=section("Customer",`
    <div class="fld"><div class="lab"><span class="lab-n">Phone</span></div><div class="inp-wrap"><input class="inp mono${custMatch?" inp-matched":""}" id="bookCustPhone" type="tel" inputmode="tel" autocomplete="off" placeholder="10-digit mobile number" value="${escAttr(bookingCustomer.phone)}">${custMatch?`<button type="button" class="cust-match-tab${bookingCustomer.member?" cust-match-tab-member":""}" data-unlink-customer="1" title="Matched ${escAttr(custMatch.name)}${bookingCustomer.member?` — ${escAttr(bookingCustomer.member.tier)} member, ${Math.max(0,bookingCustomer.member.passesTotal-bookingCustomer.member.passesUsed)} passes remaining`:""} — click to remove">${bookingCustomer.member?bookingCustomer.member.tier:"Existing"}</button>`:""}<div class="cust-suggest" id="custSuggest"></div></div></div>
    <div class="fld"><div class="lab"><span class="lab-n">Customer name</span></div><input class="inp" id="bookCustName" placeholder="Full name" value="${escAttr(bookingCustomer.name)}"></div>
    <div class="fld"><div class="lab"><span class="lab-n">Email</span><span class="lab-req">Optional</span></div><input class="inp" id="bookCustEmail" type="email" placeholder="name@example.com" value="${escAttr(bookingCustomer.email)}"></div>
  `);

  // ---- 3-step wizard: Customer → Booking → Attendees. Payment lives in the summary, not a step. ----
  const STEP_DEFS=[[1,"Customer"],[2,"Booking"],[3,"Attendees"]];
  const wizardBar=`<div class="wizard-steps">${STEP_DEFS.map(([n,l],idx)=>{
    const state=n===bookingStep?"current":n<bookingStep?"done":"todo";
    return `${idx>0?'<span class="wizard-step-line"></span>':""}<button class="wizard-step wizard-step-${state}" data-book-step="${n}" ${n>bookingStep?"disabled":""}><span class="wizard-step-n">${state==="done"?"✓":n}</span><span class="wizard-step-l">${l}</span></button>`;
  }).join("")}</div>`;
  const stepBody = bookingStep===1?customerSection:bookingStep===2?bookingStepBody:attendeesStepBody;
  const hint = (bookingStep===3 && !editing) ? `<span class="wizard-hint">Pick a payment method in the order summary to finish →</span>` : "";
  const back = bookingStep>1?`<button class="btn" data-book-back="1">← Back</button>`:"";
  const navBtn = bookingStep<3
    ? `<button class="btn btn-primary" data-book-next="1" ${bookingStep===2&&!hasItems?"disabled":""}>${bookingStep===1?"Next: Booking →":hasItems?"Next: Attendees →":"Add tickets to continue"}</button>`
    : editing ? `<button class="btn btn-primary">Save changes</button>` : "";

  const cancelConfirm = bookingCancelConfirm ? `<div class="confirm-layer">
    <button class="confirm-backdrop" data-book-cancel-dismiss="1" aria-label="Keep editing"></button>
    <div class="confirm-box" role="dialog" aria-modal="true" aria-labelledby="cancelConfirmTitle">
      <div class="confirm-title" id="cancelConfirmTitle">Discard this order?</div>
      <div class="confirm-body">${editing?"Any changes you've made won't be saved.":"The customer's details, tickets and attendees entered so far will be lost."} This can't be undone.</div>
      <div class="confirm-actions"><button class="btn btn-primary" data-book-cancel-dismiss="1">Keep editing</button><button class="btn btn-danger" data-book-cancel-confirm="1">Discard order</button></div>
    </div>
  </div>` : "";
  return `<div class="booking-layout">
    <div class="booking-main"><div class="card">
      <div class="card-head"><span class="card-title">${editing?"Edit "+record.ref:"New order"}</span>${hasItems?`<span class="head-running-total">Running total <b>${money(grand)}</b></span>`:""}<span class="card-note">Point of sale</span></div>
      ${wizardBar}
      <div class="form-body product-form">
        ${stepBody}
      </div>
      <div class="form-foot">${hint}<button class="btn" data-book-cancel="1">Cancel</button>${back}${navBtn}</div>
    </div></div>
    <aside class="booking-cart-col">${summary}</aside>
  </div>${cancelConfirm}`;
}

const SING={blackout:"blackout date",affiliates:"affiliate link",
  sources:"source",paymodes:"payment mode",scripts:"script",categories:"category",pools:"pool",
  tax:"tax rate",hsn:"code",discounts:"discount",products:"product or add-on",
  programs:"program",progcats:"program category",events:"event",camps:"camp or workshop",bookings:"order"};
const singular=(k,n)=>SING[k]||n.toLowerCase().replace(/s$/,"");
const TYPE_LABEL={media:"Files",string:"Text",int:"Number",decimal:"Number",money:"Amount",
  date:"Date",datetime:"Date and time",time:"Time",bool:"Yes or no",enum:"Choose one",
  "enum[]":"Choose several",fk:"Pick from a list","fk[]":"Pick several",rows:"Table",
  json:"Table",richtext:"Formatted text",system:"Set automatically"};
const NARROW=["int","decimal","money","date","datetime","bool","time"];
function example(note){
  if(!note) return "";
  const f=note.split(/[,\u2014.]/)[0].trim().replace(/\u2026$/,"").trim();
  return /^[A-Za-z0-9][A-Za-z0-9_\-\/]{1,22}$/.test(f)?f:"";
}
/* Field guide \u2192 tooltips: description (what) + impact (watch-for), example \u2192 placeholder.
   Built from the FAQ data, keyed by field name, with per-master preference. */
const FIELD_HINTS = (()=>{
  const perMaster={}, any={};
  Object.entries(FAQ).forEach(([master,groups])=>{
    perMaster[master]=perMaster[master]||{};
    (groups||[]).forEach(([,rows])=>rows.forEach(r=>{
      const nm=(String(r[0]).split("|")[1]||r[0]).trim();
      const rec={what:r[1]||"",example:r[2]||"",edge:r[3]||""};
      perMaster[master][nm]=rec;
      if(!any[nm]) any[nm]=rec;
    }));
  });
  return {perMaster, any};
})();
function fieldHint(name){
  const order = current==="programs" ? ["events","camps"] : [current];
  for(const m of order){ const mm=FIELD_HINTS.perMaster[m]; if(mm&&mm[name]) return mm[name]; }
  return FIELD_HINTS.any[name]||null;
}
/* Detail-page tooltips: map a read-only field label to the same description + watch-for the form shows. */
const LABEL_HINT = (()=>{
  const norm=s=>String(s).toLowerCase().replace(/\([^)]*\)/g,"").replace(/[^a-z0-9]/g,"");
  const m={};
  const add=sch=>(sch||[]).forEach(f=>{ if(!Array.isArray(f)||!f[0])return;
    const p=String(f[0]).split("|"), lab=p[0], name=p[1]||p[0];
    const note=f.length>3?f[3]:(String(f[2]||"").includes(" · ")?"":(f[2]||""));
    const k=norm(lab); if(!m[k]) m[k]={name,note}; });
  [PROD_BASE,PROD_ADDON_ONLY,PROD_PRODUCT_ONLY,PROD_REST,LISTING_FIELDS,PROGRAM_SCHEMA,EVENT_SCHEMA,CAMP_SCHEMA].forEach(add);
  Object.values(typeof SCHEMAS!=="undefined"?SCHEMAS:{}).forEach(add);
  const alias={code:"shortcode",active:"status",where:"whereitruns",ages:"minimumage",
    bookingsclose:"bookingcutoff",photosandvideo:"media",webaddress:"urlslug",
    supervision:"unaccompaniedattendance",tax:"taxrates",eventcode:"shortcode",
    eventname:"name",time:"starttime"};
  Object.entries(alias).forEach(([a,t])=>{ if(m[t]&&!m[a]) m[a]=m[t]; });
  return {m,norm};
})();
function dtip(label){
  const e=LABEL_HINT.m[LABEL_HINT.norm(label)]; if(!e) return "";
  const h=fieldHint(e.name);
  const desc=e.note||(h&&h.what)||"";
  const impact=(h&&h.edge)?h.edge:"";
  return tipRich(desc,impact);
}
/* Turn a prose example into a short input placeholder. */
function egPlaceholder(ex){
  if(!ex) return "";
  let s=stripTags(ex).replace(/[\u201c\u201d"\u2018\u2019]/g,"").trim();
  s=s.split(/ for | \u2014 | \u2013 |, | from /)[0].trim().replace(/[.\u3002]$/,"").trim();
  s=s.replace(/\u00a7\s?\d+(?:\.\d+)*(?:'s)?/g,"").trim();
  // reject prose (too many words, or a filler opener) so placeholders stay clean
  if(/\s/.test(s) && s.split(/\s+/).length>3) return "";
  if(/^(not|the|a|an|left|around|it|this|set|blank|shown|guidance|treat|belongs|same|which|where)\b/i.test(s)) return "";
  return (s && s.length<=32 && !/[<>]/.test(s)) ? s : "";
}

/* Strip build-team scaffolding from rendered HTML: scope-explainer note boxes,
   provenance rows, "?" annotations and stray section citations. */
function scrub(h){
  // whole "note-scope" / "note-open" explainer boxes
  h = h.replace(/<div class="note note-(?:scope|open)">[\s\S]*?<\/div>\s*<\/div>/g,"");
  // provenance <q>…</q>, DB field-name captions and scope-only detail rows
  h = h.replace(/<q>[\s\S]*?<\/q>/g,"");
  h = h.replace(/<p class="lab-tech">[\s\S]*?<\/p>/g,"");
  h = h.replace(/<div class="f"><div class="f-k">(?:Named in|From the scope|Source)<\/div>[\s\S]*?<\/div><\/div>/g,"");
  // section citations and scaffolding phrases
  h = h.replace(/&sect;/g,"§").replace(/§\s?\d+(?:\.\d+)*(?:'s)?/g,"");
  h = h.replace(/\bScope\b\s*(?=[:§]|$)/g,"");
  [ /Needs confirmation from MuSo before build:?/gi,
    /\bthe scope names this master but does not supply its records\.?/gi,
    /MuSo needs to set that\.?/gi,
    /needs MuSo to confirm\.?/gi,
    /\bnot stated\b/gi, /\bto confirm\b/gi, /\bprovisional\b/gi,
    /Placeholder\s*[—-]\s*/gi, /Settled during design\.?/gi
  ].forEach(re=>h=h.replace(re,""));
  // tidy leftovers
  h = h.replace(/\(\s*\)/g,"").replace(/\s+([,.;])/g,"$1").replace(/\s{2,}/g," ");
  return h;
}

/* Parse a "DD Mon YYYY" string to a Date (null if unparseable). */
function parseDMY(str){
  const m=/(\d{1,2})\s+([A-Za-z]{3,})\s+(\d{4})/.exec(str||"");
  if(!m) return null;
  const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  const mo=MON[m[2].slice(0,3).toLowerCase()];
  if(mo===undefined) return null;
  const dt=new Date(+m[3],mo,+m[1]);
  return isNaN(dt.getTime())?null:dt;
}
/* One session per calendar day between a batch's from/to dates. */
function genBatchDays(from,to,t1,t2){
  const a=parseDMY(from), b=parseDMY(to);
  if(!a||!b||b<a) return [];
  const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const days=[], cur=new Date(a); let guard=0;
  while(cur<=b && guard++<400){
    days.push({ d:`${WD[cur.getDay()]} ${String(cur.getDate()).padStart(2,"0")} ${MO[cur.getMonth()]}`, t1:t1||"10:00", t2:t2||"13:00" });
    cur.setDate(cur.getDate()+1);
  }
  return days;
}

/* ---- calendar date <-> slot matching, for the Products/Add-ons time-slot picker ----
   A slot's "days" (e.g. "Tue – Fri") and "from"/"to" date range are real data; blackout
   dates are sample data (the file has no real blackout-date records yet), same spirit
   as the cap/sold numbers added for spots-left. Blackout always wins over any slot. */
const WEEKDAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const BLACKOUTS=["15 Aug 2026","26 Jan 2027"]; // sample — Independence Day / Republic Day
function parseDMY(str){ const m=/^(\d{1,2})\s+(\w{3})\s+(\d{4})$/.exec((str||"").trim()); if(!m) return null; const mi=MONTHS.indexOf(m[2]); if(mi<0) return null; return new Date(+m[3],mi,+m[1]); }
function fmtDMY(d){ return String(d.getDate()).padStart(2,"0")+" "+MONTHS[d.getMonth()]+" "+d.getFullYear(); }
function dayIndexMon0(d){ return (d.getDay()+6)%7; } // 0=Mon .. 6=Sun
function dateMatchesDays(d,daysStr){
  const parts=(daysStr||"").split(/[–-]/).map(s=>s.trim());
  const start=WEEKDAYS.indexOf(parts[0]), end=WEEKDAYS.indexOf(parts[1]!=null?parts[1]:parts[0]);
  if(start<0||end<0) return true; // unparseable pattern — don't block on it
  const idx=dayIndexMon0(d);
  return start<=end ? (idx>=start&&idx<=end) : (idx>=start||idx<=end);
}
function dateInSlotRange(d,s){ const from=parseDMY(s.from),to=parseDMY(s.to); if(!from||!to) return false; return d>=from&&d<=to; }
function isBlackout(dateStr){ return BLACKOUTS.includes(dateStr); }
function slotsForDate(slots,dateStr){
  if(!dateStr||isBlackout(dateStr)) return [];
  const d=parseDMY(dateStr); if(!d) return [];
  return (slots||[]).filter(s=>dateInSlotRange(d,s)&&dateMatchesDays(d,s.days));
}
function defaultDateFor(slots){
  const today=new Date();
  for(let i=0;i<400;i++){
    const d=new Date(today.getFullYear(),today.getMonth(),today.getDate()+i);
    const ds=fmtDMY(d);
    if(slotsForDate(slots,ds).length) return ds;
  }
  const first=(slots&&slots[0])||{}; return first.from||fmtDMY(today);
}

function ensureCartEntry(kind,id){
  if(kind==="prod"){ const i=+id; if(!bookingProducts.has(i)){ const slots=P[i].slots,d=defaultDateFor(slots); const s=slotsForDate(slots,d).find(x=>slotLeft(x)>0)||slotsForDate(slots,d)[0]||firstAvailableSlot(slots); bookingProducts.set(i,{slot:s.n,date:d,qty:{},redeem:{}}); } }
  else if(kind==="addon"){ if(!bookingAddons.has(id)){ const a=P.find(x=>x.c===id); const slots=a?a.slots:[]; const d=defaultDateFor(slots); const s=slotsForDate(slots,d).find(x=>slotLeft(x)>0)||slotsForDate(slots,d)[0]||firstAvailableSlot(slots); bookingAddons.set(id,{slot:s?s.n:"",date:d,qty:{}}); } }
  else if(kind==="prog"){ if(!bookingPrograms.has(id)){ const rec=progRecFor(id); const batches=(rec&&rec.batches)||[]; let bi=batches.findIndex(b=>slotLeft(b)>0); if(bi<0) bi=0; bookingPrograms.set(id,{batch:bi,qty:{}}); } }
}
function progRecFor(id){ const [k,idx]=id.split(":"); return k==="event"?EVENTS[+idx]:WORKSHOPS[+idx]; }
function getCartCfg(kind,id){ return kind==="prod"?bookingProducts.get(+id):kind==="addon"?bookingAddons.get(id):bookingPrograms.get(id); }
function removeCartEntry(kind,id){ if(kind==="prod") bookingProducts.delete(+id); else if(kind==="addon") bookingAddons.delete(id); else bookingPrograms.delete(id); }
function hasBookingItems(){
  const sum=cfg=>Object.values((cfg&&cfg.qty)||{}).reduce((a,n)=>a+ +n,0)+Object.values((cfg&&cfg.redeem)||{}).reduce((a,n)=>a+ +n,0);
  return [...bookingProducts.values()].some(c=>sum(c)>0)||[...bookingAddons.values()].some(c=>sum(c)>0)||[...bookingPrograms.values()].some(c=>sum(c)>0);
}
/* how many general-admission passes the matched member has left right now, across every
   product's explicit redeem allocation in the current cart — shared/global, not per-product */
function globalPassesRemaining(){
  const member=bookingCustomer.member; if(!member) return 0;
  const base=Math.max(0,member.passesTotal-member.passesUsed);
  const used=[...bookingProducts.values()].reduce((t,cfg)=>t+Object.values(cfg.redeem||{}).reduce((tt,n)=>tt+ +n,0),0);
  return Math.max(0,base-used);
}

const bookingQtyValue=el=>Math.max(0,+(el.matches("input")?el.value:el.dataset.value)||0);
function renderBookingAttendees(){

  list.innerHTML=rows.join("")||'<div class="muted" style="font-size:12px">Add ticket quantities to enter attendee details.</div>';

function recalcBookingSummary(showMessage=false){
  const inputs=[...document.querySelectorAll("[data-bookqty]")];
  const subtotal=inputs.reduce((sum,input)=>sum+(bookingQtyValue(input)*(+input.dataset.unit||0)),0);
  const code=bookingDiscountCode.trim().toUpperCase();
  const discount=DISCOUNTS.find(d=>d.status==="Approved"&&(d.cond||[]).some(c=>String(c.code||"").toUpperCase()===code));
  let amount=0;
  if(discount){ amount=String(discount.v).includes("%")?subtotal*(parseFloat(discount.v)||0)/100:Math.min(subtotal,parseFloat(String(discount.v).replace(/[^0-9.]/g,""))||0); }
  const subtotalEl=document.getElementById("bookingSubtotal"), discountEl=document.getElementById("bookingDiscountAmount"), totalEl=document.getElementById("bookingTotal"), msg=document.getElementById("bookingDiscountMessage");
  if(subtotalEl) subtotalEl.textContent=money(subtotal);
  if(discountEl) discountEl.textContent="−"+money(amount);
  if(totalEl) totalEl.textContent=money(subtotal-amount);
  if(msg&&showMessage) msg.textContent=!code?"Enter a discount code.":discount?`${discount.n} applied.`:"Code is invalid or unavailable.";
}

  if(e.target.id==="progCat"){ progCat=e.target.value; progKind=progFormat(progCat)==="multi"?"camp":"event"; render(); }
  if(e.target.id==="copyFrom"){ copyFrom=+e.target.value; copyTo=new Set(); render(); }
  if(e.target.id==="bookingProductSelect"){ bookingProduct=+e.target.value; bookingSlot=P[bookingProduct].slots[0].n; render(); }
  if(e.target.id==="bookingSlotSelect"){ bookingSlot=e.target.value; render(); }
  refreshDiscountSummaries();
});
/* Whole years from a DD/MM/YYYY date of birth to today; null if incomplete/invalid. */
function ageFromDOB(str){
  const m=/^\s*(\d{1,2})\/(\d{1,2})\/(\d{4})\s*$/.exec(str||"");
  if(!m) return null;
  const d=+m[1], mo=+m[2], y=+m[3];
  if(mo<1||mo>12||d<1||d>31||y<1900) return null;
  const today=new Date();
  let age=today.getFullYear()-y;
  const hadBirthday=(today.getMonth()+1>mo)||(today.getMonth()+1===mo&&today.getDate()>=d);
  if(!hadBirthday) age--;
  if(age<0||age>120) return null;
  return age;
}
function ageLabel(str){ const a=ageFromDOB(str); return a===null?"":(a===0?"Under 1 yr":a+(a===1?" yr":" yrs")); }
document.addEventListener("input",e=>{
  const dob=e.target.closest&&e.target.closest("[data-dob]");
  if(dob){ const el=document.getElementById("age_"+dob.dataset.dob); if(el) el.value=ageLabel(e.target.value); return; }
  if(e.target.classList&&e.target.classList.contains("msel-search")){
    const q=e.target.value.trim().toLowerCase(), wrap=e.target.closest(".msel");
    if(wrap) wrap.querySelectorAll(".msel-opt").forEach(o=>{ o.style.display=(!q||(o.dataset.label||"").includes(q))?"":"none"; });
    return;
  }
  if(e.target.matches&&e.target.matches("[data-member-search]")){
    const q=e.target.value.trim().toLowerCase(), qd=q.replace(/\D/g,"");
    const tbl=document.getElementById("membersTable"); if(!tbl) return;
    let shown=0;
    tbl.querySelectorAll("[data-member-row]").forEach(r=>{ const hay=r.dataset.search||"";
      const hit=!q||hay.includes(q)||(qd&&hay.replace(/\D/g,"").includes(qd));
      r.style.display=hit?"":"none"; if(hit) shown++; });
    const empty=tbl.querySelector("[data-member-empty]"); if(empty) empty.style.display=shown?"none":"";
    const addrow=tbl.querySelector("[data-member-addrow]"); if(addrow) addrow.style.display=q?"none":"";
    const cnt=document.getElementById("memberCount"); if(cnt) cnt.textContent=q?(shown+" of "+MEMBERS.length+" members"):(MEMBERS.length+" members");
    return;
  }
  if(e.target.matches&&e.target.matches("[data-utm]")){ captureUtmFlyout(); const el=document.getElementById("shareLinkPreview"); if(el) el.textContent=shareLink(curDiscount()); return; }
  if(e.target.matches&&e.target.matches("[data-series]")){ syncDiscountForm(); const el=document.getElementById("seriesPreview"); if(el){ const s=curDiscount().series||{}; const err=seriesError(s);
      if(err){ el.textContent=err; el.style.color="var(--stop)"; }
      else{ const list=seriesCodes(s,4),n=seriesCount(s); el.textContent=`${list.slice(0,3).join(", ")}${n>3?` … ${seriesCode(s,Math.floor(+s.to||0))}`:""} · ${n.toLocaleString()} code${n===1?"":"s"}`; el.style.color="var(--blue)"; } }
    return; }
  if(!e.target.matches("[data-bookqty]")){ refreshDiscountSummaries(); return; }
  const qty=Math.max(0,+e.target.value||0), unit=+e.target.dataset.unit||0, index=e.target.dataset.bookindex;
  const summary=document.querySelector(`[data-summary-line="${index}"]`);
  if(summary){ summary.querySelector("[data-summary-qty]").textContent=qty; summary.querySelector("[data-summary-amount]").textContent=money(qty*unit); }
  recalcBookingSummary(false);
  renderBookingAttendees();
});
document.addEventListener("input",e=>{
  if(e.target.id==="bookCustName"){ bookingCustomer.name=e.target.value; return; }
  if(e.target.id==="bookCustEmail"){ bookingCustomer.email=e.target.value; return; }
  if(e.target.id==="bookCustPhone"){
    bookingCustomer.phone=e.target.value; bookingCustomerLinked=-1; bookingCustomer.member=null;
    const box=document.getElementById("custSuggest"); if(!box) return;
    const digits=e.target.value.replace(/\D/g,"");
    if(digits.length<10){ box.innerHTML=""; return; }
    const matches=CUSTOMERS.filter(c=>c.phone.replace(/\D/g,"").startsWith(digits)).slice(0,4);
    box.innerHTML=matches.length?matches.map(c=>`<button type="button" class="cust-suggest-row" data-pick-customer="${escAttr(c.phone)}"><span class="cust-suggest-name">${c.name}</span><span class="cust-suggest-phone">${c.phone}</span></button>`).join(""):"";
  }
});

/* hover / focus tooltips — description + impact (watch for) */
const tipbox=document.createElement("div"); tipbox.className="tipbox"; document.body.appendChild(tipbox);
function showTip(t){
  const d=t.dataset.tip||"", im=t.dataset.impact||"";
  tipbox.innerHTML="";
  if(d){ const p=document.createElement("div"); p.className="tip-desc"; p.textContent=d; tipbox.appendChild(p); }
  if(im){ const p=document.createElement("div"); p.className="tip-impact";
    const s=document.createElement("span"); s.textContent="Watch for"; p.appendChild(s);
    p.appendChild(document.createTextNode(im)); tipbox.appendChild(p); }
  const r=t.getBoundingClientRect();
  tipbox.style.left=(r.left+r.width/2)+"px"; tipbox.style.top=(r.top-6)+"px"; tipbox.classList.add("on"); }
document.addEventListener("mouseover",e=>{ const t=e.target.closest&&e.target.closest(".tip"); if(t) showTip(t); });
document.addEventListener("mouseout",e=>{ if(e.target.closest&&e.target.closest(".tip")) tipbox.classList.remove("on"); });
document.addEventListener("focusin",e=>{ const t=e.target.closest&&e.target.closest(".tip"); if(t) showTip(t); });
document.addEventListener("focusout",e=>{ if(e.target.closest&&e.target.closest(".tip")) tipbox.classList.remove("on"); });

render();

</script>
