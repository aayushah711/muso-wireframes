/* ---- sale math (shared by the sale form, the invoice detail and the reports) ---- */
function shopSaleCompute(sale){
  // Total = the Selling price (list). Discount is a % off the Selling price. Sub total = Total − Discount is
  // the taxable value, and CGST/SGST are charged on it. Grand total = Sub total + GST.
  const lines=(sale.lines||[]).map(l=>{ const it=shopItemByPd(l.pd)||{}; const qty=+l.qty||0; const base=shopBaseOf(it)*qty, selling=shopSellingOf(it)*qty; return {...l,it,qty,base,selling,gross:selling,gstPct:shopGstPct(it),halfPct:shopHalfPct(it)}; });
  const total=lines.reduce((a,l)=>a+l.selling,0);       // "Total" — the selling price
  const baseTotal=lines.reduce((a,l)=>a+l.base,0);      // pre-tax base (shown per-line in Item details)
  let discPct=(+sale.instantPct||0);                    // instant discount (manager-authorised)
  const cp=sale.coupon?shopCoupon(sale.coupon):null; const couponOk=cp&&cp.status==="Approved";
  let flat=0;
  if(couponOk){ if(cp.type==="Percentage") discPct+=(+cp.v||0); else flat+=(+cp.v||0); }
  discPct=Math.min(100,discPct);
  const discAmt=Math.min(total, total*discPct/100+flat);   // discount is taken off the Selling price (Total)
  const subtotal=Math.max(0, total-discAmt);            // "Sub total" — the taxable value
  const factor=total>0?subtotal/total:0;                // spread the taxable value across lines pro-rata
  let cgst=0,sgst=0;
  lines.forEach(l=>{ l.taxable=l.selling*factor; cgst+=l.taxable*l.halfPct/100; sgst+=l.taxable*l.halfPct/100; });
  const gst=cgst+sgst;
  const grand=Math.round(subtotal+gst);
  // when every taxed line shares one rate, show the CGST/SGST % in the breakup; otherwise it's a mixed cart
  const halfPcts=[...new Set(lines.filter(l=>l.it&&l.it.pd&&l.halfPct>0).map(l=>l.halfPct))];
  const uniformHalf=halfPcts.length===1?halfPcts[0]:null;
  return {lines,total,baseTotal,subtotal,net:subtotal,discPct,discAmt,couponOk,coupon:cp,factor,cgst,sgst,gst,grand,uniformHalf};
}

/* Number → Indian words for the tax invoice ("Rupees … Only"). */
function amountInWords(num){
  num=Math.round(+num||0); if(num===0) return "Rupees Zero Only";
  const a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const b=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const two=n=>n<20?a[n]:b[Math.floor(n/10)]+(n%10?" "+a[n%10]:"");
  const three=n=>{ const h=Math.floor(n/100),r=n%100; return (h?a[h]+" Hundred"+(r?" ":""):"")+(r?two(r):""); };
  let out="", cr=Math.floor(num/10000000); num%=10000000; const la=Math.floor(num/100000); num%=100000; const th=Math.floor(num/1000); num%=1000;
  if(cr) out+=three(cr)+" Crore "; if(la) out+=three(la)+" Lakh "; if(th) out+=three(th)+" Thousand "; if(num) out+=three(num);
  return "Rupees "+out.trim().replace(/\s+/g," ")+" Only";
}

/* ---- CSV export for the Shop tables ---- */
function shopExportRows(kind){
  if(kind==="shopitems") return [["PD","Name","Category","Base price","GST %","MRP","Stock","Barcodes"]].concat(SHOP_ITEMS.map(x=>[x.pd,x.n,x.cat,x.base,shopGstPct(x),x.mrp,x.stock,(x.barcodes||[]).length]));
  if(kind==="shopcoupons") return [["Code","Description","Type","Value","Proposed by","Status","Valid from","Valid to"]].concat(SHOP_COUPONS.map(c=>[c.code,c.desc,c.type,c.v,c.proposedBy,c.status,c.from,c.to]));
  if(kind==="shopsales") return [["Txn","Invoice","Date","Customer","Phone","GSTIN","Items","Payment","Subtotal","Discount","GST","Grand total"]].concat(SHOP_SALES.map(s=>{const c=shopSaleCompute(s);const n=(s.lines||[]).reduce((a,l)=>a+(+l.qty||0),0);return [s.txn,s.inv,s.date,s.name,s.phone,s.gstin||"",n,s.pay,Math.round(c.subtotal),Math.round(c.discAmt),Math.round(c.gst),c.grand];}));
  if(kind==="shopreports-pay"){ const byPay={}; SHOP_SALES.forEach(s=>{const c=shopSaleCompute(s);byPay[s.pay]=(byPay[s.pay]||0)+c.grand;}); return [["Payment mode","Amount"]].concat(Object.entries(byPay).map(([k,v])=>[k,Math.round(v)])); }
  if(kind==="shopreports-hsn"){ const hm={}; SHOP_SALES.forEach(s=>{const c=shopSaleCompute(s);c.lines.forEach(l=>{const it=l.it;if(!it.hsn)return;const taxable=l.taxable,cg=taxable*l.halfPct/100;const m=hm[it.hsn]||(hm[it.hsn]={hsn:it.hsn,qty:0,taxable:0,cgst:0,sgst:0,pct:l.gstPct});m.qty+=l.qty;m.taxable+=taxable;m.cgst+=cg;m.sgst+=cg;});}); return [["HSN/SAC","Qty sold","Taxable value","CGST %","CGST","SGST %","SGST","Total tax"]].concat(Object.values(hm).map(m=>[m.hsn,m.qty,Math.round(m.taxable),m.pct/2,Math.round(m.cgst),m.pct/2,Math.round(m.sgst),Math.round(m.cgst+m.sgst)])); }
  return [];
}
function downloadCSV(name,rows){
  try{
    const csv=rows.map(r=>r.map(c=>{const s=String(c==null?"":c);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(",")).join("\r\n");
    const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
    const url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  }catch(e){}
}

/* Cut a product's slots into segments at every distinct start and end time. */
function SEGMENTS(a){
  const t = x => /^\d\d:\d\d$/.test(x) ? (+x.slice(0,2))*60 + (+x.slice(3,5)) : null;
  const live = a.slots.filter(x=>t(x.t1)!==null && t(x.t2)!==null);
  if(!live.length) return [];
  const marks = [...new Set(live.flatMap(x=>[t(x.t1),t(x.t2)]))].sort((p,q)=>p-q);
  const fmt = m => String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
  const out=[];
  for(let i=0;i<marks.length-1;i++){
    const from=marks[i], to=marks[i+1];
    const on = live.filter(x=>t(x.t1)<=from && t(x.t2)>=to);
    if(on.length) out.push({from:fmt(from),to:fmt(to),slots:on.map(x=>x.n)});
  }
  return out;
}

pools:[["Inventory pools",[

/* ---- camps: the four sub-tabs ---- */
function listingCard(l,name){
  const row=(k,v,warn)=>`<div class="f"><div class="f-k">${k}${dtip(k)}</div><div class="f-v">${
    v?v:`<span class="q">${warn||"not set"}</span>`}</div></div>`;
  const st={Active:'<span class="pill pill-ok"><i class="dot"></i>Active</span>',
            Draft:'<span class="pill pill-draft"><i class="dot"></i>Draft — not on the site</span>',
            Paused:'<span class="pill pill-off">Paused — visible, not bookable</span>',
            Archived:'<span class="pill pill-off">Archived</span>'}[l.status];
  return `<div class="card">
    <div class="card-head"><span class="card-title">Listing</span>
      ${st}<span class="card-note">What the What's On page shows</span></div>
    <div class="insp-body">
      ${row("Description",l.desc)}
      ${row("Photos and video",l.media,"nothing uploaded")}
      <div class="f"><div class="f-k">Supervision</div><div class="f-v">${
          l.unacc ? "Children may attend without an adult — a drop-off."
                  : "An adult must be on the booking with a younger child."}</div></div>
      ${row("Web address","muso.in/whats-on/<b>"+l.slug+"</b>")}
      ${row("Page title",l.seoT,"falls back to “"+name+"”")}
      ${row("Meta description",l.seoD,"the search result will show whatever the page starts with")}
      ${row("Meta keywords",l.seoK,"comma-separated keywords for search")}
    </div>
    <div class="card-body" style="border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink2);line-height:1.65">
      §2 asks for all of this per listing, and §12 asks for search tags on every customer-facing page. <b style="color:var(--ink)">Draft is not the same as unavailable</b> — a draft has never been on the site, while paused is a live page that has stopped taking bookings, which is what you want mid-season when a batch fills.
    </div>
  </div>`;
}

/* ---- plain-English summary of what a discount actually does ---- */
function condPhrase(c){
  if(c.k==="Items in the basket"){
    const named=c.prods&&c.prods.length?c.prods.map(p=>{const s=slotLabel(c.slots&&c.slots[p]);return `${condQty(c,p)} ${p}${s?` (${s})`:""}`;}):null;
    const cats=c.cats&&c.cats.length?" ("+c.cats.join(", ")+")":"";
    const item=named?named.join(c.pm==="all of"?" and ":" or "):`${c.qty||"1"} of any item`;
    return `${c.op} ${item}${cats}`;
  }
  if(c.k==="Customer holds a membership") return "the customer is a member";
  if(c.k==="A code is entered") return `the code ${c.code} is entered`;
  if(c.k==="The booking date") return `the booking date is ${c.from===c.to?c.from:c.from+" to "+c.to}`;
  if(c.k==="Arrived via an affiliate link") return `the visit arrives via ${String(c.who||"an affiliate").toLowerCase()}`;
  if(c.k==="Applied by staff") return "";
  return String(c.k||"").toLowerCase();
}
/* The lines a "matching lines" discount comes off — items, with optional slot + age category. */
/* The items a discount comes off = the items named in its basket condition. */
function discBasketItems(d){
  const c=(d.cond||[]).find(x=>x.k==="Items in the basket");
  return (c&&c.prods)||[];
}
function matchLinesText(d){
  const prods=discBasketItems(d);
  return prods.length ? prods.join(" and ") : "the matching lines";
}
function effectPhrase(d){
  const tgt=matchLinesText(d);
  if(d.tiers&&d.tiers.length) return `a volume discount (${d.tiers.map(t=>t[1].toString().replace("%","")+"% from "+t[0]).join(", ")}) off ${tgt}`;
  if(!d.v) return `a discount off ${tgt}`;
  const amt=d.value==="Flat amount"?("₹"+String(d.v).replace(/[^0-9.]/g,"")):d.v;
  return `${amt} off ${tgt}`;
}
/* How a discount is applied — a code is always created; two independent attributes. */
function applyInfo(d){
  if(d.auto!==undefined||d.staffOnly!==undefined||d.memberOnly!==undefined) return {auto:!!d.auto, staffOnly:!!d.staffOnly, memberOnly:!!d.memberOnly};
  return {auto:d.apply==="auto", staffOnly:d.apply==="manual", memberOnly:false};   // legacy fallback
}
function audienceText(a){ return a.staffOnly&&a.memberOnly?"staff & members only":a.staffOnly?"staff only":a.memberOnly?"members only":"everyone"; }
function applyText(d){ const a=applyInfo(d); return (a.auto?"Auto-applied":"Applied with the code")+" · "+audienceText(a); }
function discountSummary(d){
  const a=applyInfo(d);
  const aud=audienceText(a);
  const lead=(a.auto?"Applies automatically":"Applies when the code is entered")+(aud!=="everyone"?`, ${aud},`:"");
  const conds=(d.cond||[]).map(condPhrase).filter(Boolean);
  const when=conds.length?` when the order has ${conds.join(", and ")}`:"";
  const visit=(d.visit&&d.visit[0])?` for a visit on ${d.visit[0]}${d.visit[1]&&d.visit[1]!==d.visit[0]?"–"+d.visit[1]:""}`:"";
  return `${lead}${when}${visit} — takes ${effectPhrase(d)}.`;
}
function discountSummaryShort(d){
  const s=discountSummary(d);
  return s.length>150?s.slice(0,148).replace(/[,;\s]+\S*$/,"")+"…":s;
}
function applyBadge(d){
  const a=applyInfo(d);
  const aud={"staff & members only":"Staff & members","staff only":"Staff only","members only":"Members only","everyone":"Everyone"}[audienceText(a)];
  const whoCls=(a.staffOnly||a.memberOnly)?'<span class="pill pill-off">'+aud+'</span>':'<span class="mode">'+aud+'</span>';
  return (a.auto?'<span class="pill pill-ok"><i class="dot"></i>Auto-applied</span>':'<span class="mode">Code entered</span>')+' '+whoCls;
}
function condSummaryText(c){
  const cc=Object.assign({k:"Items in the basket"},c||{});
  return `The order must contain <b>${condPhrase(cc)}</b>`;
}
/* Short "what the customer gets" phrase — the discounted items are the basket items. */
function valueOnlyPhrase(d){
  if(!d.v) return "a discount";
  if(d.value==="Flat amount") return "₹"+String(d.v).replace(/[^0-9.]/g,"")+" off";
  return d.v+" off";   // percentage, e.g. "15% off"
}
/* One merged summary for the section: what triggers it + what the customer gets. */
function discountRuleSummary(d){
  const bd=condDraftFromDiscount(d);
  const val=valueOnlyPhrase(d);
  if(bd.prods&&bd.prods.length){
    const cond=condPhrase(Object.assign({k:"Items in the basket"},bd));
    return `Buy <b>${cond}</b> and get <b>${val}</b> on ${bd.prods.length>1?"them":"it"}`;
  }
  return `Get <b>${val}</b> on <b>any order</b>`;
}
/* The sticky right-hand overview of the whole discount being configured. */
function discSummaryPanel(d){
  const a=applyInfo(d), aud=audienceText(a);
  const rows=[
    ["Method", a.auto?"Automatic discount":(isSeries(d)?("Series · "+codeLabel(d)):("Code · "+(d.n||"—")))],
    ["For", aud.charAt(0).toUpperCase()+aud.slice(1)],
    ["Amount", d.v?(d.value?d.value+" · "+d.v:d.v):"—"],
    ["Runs", d.dates&&d.dates[0]?(d.dates[0]+(d.dates[1]?" – "+d.dates[1]:" onward")):"Any time"],
    ...(d.visit&&d.visit[0]?[["Visit",d.visit[0]+(d.visit[1]&&d.visit[1]!==d.visit[0]?" – "+d.visit[1]:"")]]:[]),
    ...(isSeries(d)?[["Vouchers", seriesCount(d.series).toLocaleString()+" codes"]]:[]),
    ["Per user", (d.codes&&d.codes.oncePerUser===false)?"Reusable":"Once"],
    ["Total uses", d.maxr||"No limit"],

  ];
  return `<div class="cond-summary" style="margin-bottom:12px">${discountRuleSummary(d)}</div>

      <td style="padding:4px 0 4px 12px;text-align:right;font-weight:500;word-break:break-word">${vv}</td></tr>`).join("")}</tbody></table>`;
}

function dTuple(name){ return SCHEMAS.discounts.find(f=>Array.isArray(f)&&f[0].split("|")[1]===name); }
function dfld(name,values){ const t=dTuple(name); return t?field(t,values):""; }

/* Read every field()-rendered control (tagged data-df) back into a plain object. */
function readForm(root){
  const out={};
  const fields=root&&root.querySelectorAll?root.querySelectorAll("[data-df]"):[];
  [...fields].forEach(fld=>{
    const name=fld.dataset.df;
    if(fld.querySelector(".sw")){ out[name]=fld.querySelector(".sw").dataset.on==="1"; return; }
    if(fld.querySelector(".rep")){ out[name]=[...fld.querySelectorAll(".rep-r")].map(r=>[...r.querySelectorAll("input")].map(i=>i.value.trim())); return; }
    const chips=fld.querySelectorAll(".chip-opt");
    if(chips.length){ out[name]=[...chips].filter(c=>c.dataset.on==="1").map(c=>c.textContent.trim()); return; }
    const sel=fld.querySelector("select");
    if(sel){ out[name]=sel.value; return; }
    const inputs=[...fld.querySelectorAll("input,textarea")];
    if(inputs.length>1) out[name]=inputs.map(i=>i.value.trim());
    else if(inputs.length===1) out[name]=inputs[0].value.trim();
  });
  return out;
}
/* Map the generic form values back onto a discount record's own shape. */
function applyFormToDiscount(d,f){
  const has=k=>f[k]!==undefined;
  const clean=v=>(v&&!/^Select/.test(v))?v:undefined;
  const back=(v,map)=>map[String(v||"").toLowerCase()]||v;
  if(has("name")) d.n=f.name||d.n;
  if(has("status")){ const v=clean(f.status); if(v) d.status=back(v,{"draft":"Draft","pending approval":"Pending approval","approved":"Approved","withdrawn":"Withdrawn"}); }
  if(has("value_type")){ const v=clean(f.value_type); if(v){ d.value=back(v,{"percentage":"Percentage","flat amount":"Flat amount"}); d.vt=d.value; } }
  if(has("value")){ const raw=String(f.value||"").replace(/[^0-9.]/g,""); d.v= raw?(d.value==="Percentage"?raw+"%":raw):""; }
  if(has("valid_from / valid_to")&&Array.isArray(f["valid_from / valid_to"])) d.dates=f["valid_from / valid_to"];
  if(has("visit_from / visit_to")&&Array.isArray(f["visit_from / visit_to"])) d.visit=f["visit_from / visit_to"];
  if(has("max_redemptions")) d.maxr=f.max_redemptions||"";
  if(has("prepared_by")) d.maker=f.prepared_by||d.maker;
  if(has("approved_by")){ const v=clean(f.approved_by); d.checker=v||"—"; }
  // one code is always created per discount
  d.codes=d.codes||{oncePerUser:true,gen:"1"};
  d.codes.gen="1";
  d.cond=d.cond||[];
  return d;
}

/* A 12-character alphanumeric discount code (ambiguous chars omitted). */
function genCode(){ const cs="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s=""; for(let i=0;i<12;i++) s+=cs.charAt(Math.floor(Math.random()*cs.length)); return s; }
/* ---- voucher series: one discount → many unique codes (prefix + numeric range) ---- */
const SERIES_CAP = 1000;   // most codes the wireframe will render in one list
function seriesPad(to){ return String(Math.max(1,Math.floor(+to||0))).length; }
function seriesCount(s){ const a=Math.floor(+s.from||0),b=Math.floor(+s.to||0); return b>=a?(b-a+1):0; }
function seriesCode(s,n){ return (s.prefix||"")+String(n).padStart(seriesPad(s.to),"0"); }
function seriesCodes(s,cap){ const out=[],a=Math.floor(+s.from||0),b=Math.floor(+s.to||0),lim=cap||SERIES_CAP; for(let n=a;n<=b&&out.length<lim;n++) out.push(seriesCode(s,n)); return out; }
function seriesLabel(s){ const a=Math.floor(+s.from||0),b=Math.floor(+s.to||0); return seriesCode(s,a)+"–"+seriesCode(s,b); }   // e.g. JSW001–JSW100
/* The code identity shown across listing / summary / detail. */

/* Validation message for the series inputs, or "" when valid. */
function seriesError(s){
  if(!s) return "";
  if(!(s.prefix||"").trim()) return "Enter a code prefix.";
  const a=+s.from, b=+s.to;
  if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0) return "From and To must be whole numbers.";
  if(b<a) return "“To” must be greater than or equal to “From”.";
  const n=seriesCount(s);
  if(n===0) return "This range produces no codes.";
  if(n>SERIES_CAP) return `That is ${n.toLocaleString()} codes — keep a single series to ${SERIES_CAP.toLocaleString()} or fewer.`;
  return "";
}

function shareLink(d){

const itemSlots = name => { const p=P.find(x=>x.n===name); return p&&p.slots&&p.slots.length?p.slots.map(s=>s.n):[]; };

function modeOf(prods){ return (prods&&prods.length&&prods.every(isCatName))?"cats":"items"; }
function condDraftFromDiscount(d){
  const base={pm:"all of",prods:[],cats:[],op:"at least",qty:"1",qtys:{},slots:{},mode:"items"};
  (d.cond||[]).filter(c=>c.k==="Items in the basket").forEach((c,i)=>{
    base.prods=[...new Set([...base.prods,...(c.prods||[])])];
    base.cats=[...new Set([...base.cats,...(c.cats||[])])];
    Object.assign(base.slots,c.slots||{});
    const cq=c.qtys||{};
    (c.prods||[]).forEach(p=>{ base.qtys[p]=(cq[p]!=null?cq[p]:(c.qty||"1")); });
    if(i===0){ base.pm=c.pm||base.pm; base.op=c.op||base.op; base.qty=c.qty||base.qty; }
  });
  base.mode=modeOf(base.prods);
  return base;
}

  rules(a){

    const ctxCard=(ctx,title,note)=>{
      const list=a.rules[ctx];
      const body = list.length ? list.map((r,i)=>{
        const prob=ruleProblem(r,cats);
        const reqs=ruleReqs(r);
        const reqChips=cats.filter(c=>c!==r.subject).map(c=>
          `<button type="button" class="chip-add chip-opt" data-on="${reqs.includes(c)?1:0}" data-rule-req="${ctx}|${i}|${escAttr(c)}">${escHtml(c)}</button>`).join("");
        const mid = `<div class="selwrap"><select class="inp" style="min-width:110px" data-rule-field="${ctx}|${i}|mode"><option value="any"${r.mode==="all"?"":" selected"}>needs any of</option><option value="all"${r.mode==="all"?" selected":""}>needs all of</option></select></div>`;
        return `<tr>
          <td><div class="selwrap"><select class="inp" data-rule-field="${ctx}|${i}|subject">${catOpts(r.subject)}</select></div></td>

          <td><div class="chips">${reqChips}</div></td>
          <td class="ctr"><input class="inp mono" style="width:60px;text-align:center" value="${escAttr(r.min)}" data-rule-field="${ctx}|${i}|min" aria-label="Minimum"></td>
          <td class="ctr"><input class="inp mono" style="width:60px;text-align:center" value="${escAttr(r.max)}" placeholder="∞" data-rule-field="${ctx}|${i}|max" aria-label="Maximum (blank = no limit)"></td>
          <td style="font-size:12px;color:${prob?"var(--stop)":"var(--ink2)"}">${prob?"⚠ "+escHtml(prob):escHtml(ruleSentence(r))}</td>
          <td style="text-align:right"><button class="btn btn-danger" data-rule-del="${ctx}|${i}" aria-label="Remove rule">Remove</button></td></tr>`;
      }).join("") : `<tr><td colspan="7" class="muted" style="text-align:center;padding:22px 16px">No rules — admits any mix of the categories it sells.</td></tr>`;
      return `<div class="card section-card">
        <div class="card-head card-head-tint"><span class="card-title">${title}</span><span class="card-note">${note}</span></div>
        <div class="matrix-wrap"><table><thead><tr>
          <th>For each</th><th>Match</th><th>Requires</th><th class="ctr">Min</th><th class="ctr">Max</th><th>In plain words</th><th></th></tr></thead>
        <tbody>${body}
          <tr><td colspan="7"><button class="rep-add" data-rule-add="${ctx}" style="border-radius:4px">+ Add rule</button></td></tr>
        </tbody></table></div></div>`;
    };
    const intro=`<div class="note note-scope"><span class="note-mark">Structure</span><div>
      Who may enter together, and in what ratio. Each rule reads <b>“for each <i>subject</i> ticket, require <i>min–max</i> of one or more other categories.”</b> Pick several required categories and choose <b>any of</b> (either satisfies the rule) or <b>all of</b> (each is required). <b>Min 1</b> makes them mandatory; <b>min 0</b> lets the subject enter alone; leave <b>Max</b> blank for no upper limit. These are shown for reference — the booking screen is not blocked on them yet.
    </div></div>`;
    const delRule = ruleDel && a.rules[ruleDel.ctx] ? a.rules[ruleDel.ctx][ruleDel.i] : null;
    const delConfirm = delRule ? `<div class="confirm-layer"><button class="confirm-backdrop" data-rule-del-cancel="1" aria-label="Cancel"></button>
      <div class="confirm-box" role="dialog" aria-modal="true"><div class="confirm-title">Remove this rule?</div>
      <div class="confirm-body">${escHtml(ruleSentence(delRule))} This can't be undone.</div>
      <div class="confirm-actions"><button class="btn" data-rule-del-cancel="1">Cancel</button><button class="btn btn-danger" data-rule-del-confirm="1">Remove rule</button></div></div></div>` : "";
    return intro+ctxCard("product","Entry rules","who may enter this product together, and in what ratio")+delConfirm;
  },

  tax(a){
    const rows = a.tax.map(RATE);
    return `<div class="note note-scope"><span class="note-mark">Structure</span><div>
      A tax row is <b>one rate</b>. CGST 9% and SGST 9% are two rows, not two columns on one — which is what makes §12's component-wise GST breakup possible. A product associates every rate that could apply to it, and the invoice charges whichever ones match the place of supply.

  prices(a){

/* Reception check-in helpers. Real Date() is fine in the page runtime. */
function nowTime(){ return new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}); }
/* Decorative QR-like glyph — a deterministic pattern from the ticket ref (not a real scannable QR). */
function fauxQR(seed, cls){
  seed=String(seed); let h=0; for(let i=0;i<seed.length;i++) h=((h*31)+seed.charCodeAt(i))>>>0;
  const N=7; let rects="";
  for(let i=0;i<N*N;i++){ h=(h*1103515245+12345)>>>0; const x=i%N, y=(i/N|0);
    const finder=(x<2&&y<2)||(x>N-3&&y<2)||(x<2&&y>N-3);   // solid squares in three corners, like a real QR
    if(finder||((h>>>16)&1)) rects+=`<rect x="${x}" y="${y}" width="1" height="1"/>`; }
  return `<svg class="qr${cls?" "+cls:""}" viewBox="0 0 ${N} ${N}" shape-rendering="crispEdges" aria-hidden="true">${rects}</svg>`;
}

/* A rename has to follow through to every role sitting on the old name, or the role
   is left pointing at a department that no longer exists. */
function deptSave(){
  const d=deptByName(deptEditing), el=document.getElementById("deptEditName");
  if(!d||!el) return;
  const name=el.value.trim(), box=document.getElementById("deptEditErr");
  const fld=document.getElementById("deptEditFld");
  const bad = !name ? "Give the department a name."
    : DEPARTMENTS.some(x=>x!==d && x.name.toLowerCase()===name.toLowerCase())
      ? `\u201C${name}\u201D is already on the list.` : "";
  if(bad){ if(fld) fld.classList.add("is-miss"); if(box) box.textContent=bad; return; }
  if(name!==d.name){
    CAREER_OPENINGS.forEach(r=>{ if(r.dept===d.name) r.dept=name; });
    d.name=name;
  }
  const act=document.getElementById("deptEditActive");
  if(act) d.is_active = act.dataset.on==="1";
  deptEditing=""; render();
}

/* Renaming a department is one field, so it happens in the same right-side flyout the
   role editor uses rather than a page of its own. The rename follows through to every
   role sitting on it — nothing is left pointing at a name that no longer exists. */

/* Deleting says what it will cost before it does it. A role on a deleted department
   keeps the name — the dropdown flags it rather than blanking the field. */

      return `<div class="scan-stage">

    // ---- SCANNED: ticket details + reception action ----

    const booked = `<div class="ci-kv">
        ${kv("Booked",`<b>${b.product}</b>`)}${kv("Date",b.date)}${kv("Time slot",b.slot)}
        ${kv("Tickets",b.tickets)}${kv("Party size",`${b.heads} ${b.heads===1?"person":"people"}`)}
        ${kv("Total",money(b.total))}
        ${kv("Payment",`<span class="pill pill-ok"><i class="dot"></i>Paid${b.paymentMode?" · "+b.paymentMode:""}</span>`)}
      </div>`;
    const visitor = `<div class="ci-kv">
        ${kv("Booking ref",`<span class="mono">${b.ref}</span>`)}${kv("Phone",`<span class="mono">${b.phone||"—"}</span>`)}
        ${kv("Email",b.email||"")}${kv("Location",b.location||"")}
      </div>`;
    const att = (b.attendees||[]).map(a=>`<div class="ci-att-row"><span>${a.name||'<span class="muted">Unnamed</span>'}</span><span class="ci-att-cat">${a.category}${a.dob?" · DOB "+a.dob:""}</span></div>`).join("");

    let action;
    if(phase==="ready"){
      action = `<button class="btn btn-primary btn-lg" data-checkin>Check in ${b.heads} ${b.heads===1?"visitor":"visitors"}</button>
        <button class="btn" data-scan-reset>Scan another ticket</button>`;
    } else if(phase==="in"){
      action = `<div class="ci-status-big"><div class="ci-tick">${TICK}</div><b>Checked in</b><div class="ci-time">at ${rec.inTime}</div></div>
        <button class="btn btn-out btn-lg" data-checkout>Check out</button>
        <button class="btn" data-scan-reset>Scan another ticket</button>`;
    } else {
      action = `<div class="ci-status-big"><div class="ci-tick">${TICK}</div><b>Visit complete</b><div class="ci-time">In ${rec.inTime} · Out ${rec.outTime}</div></div>
        <button class="btn btn-primary btn-lg" data-scan-reset>Scan next ticket</button>`;
    }

    const banner = phase==="ready" ? ["ci-banner-ok","Ticket scanned — verify the visitor, then check in"]
                 : phase==="in" ? ["ci-banner-ok","Visitor checked in"]
                 : ["ci-banner-off","Visit completed"];

    return `<div class="ci-banner ${banner[0]}">${fauxQR(b.ref,"qr-sm")}<span>${banner[1]}</span><span class="mono" style="margin-left:auto">${b.ref}</span></div>
      <div class="ci-scanned">
        <div>
          <div class="ci-visitor">${fauxQR(b.ref,"qr-lg")}<div><h2>${b.customer}</h2><div class="muted">${b.tickets}</div></div></div>
          <div class="card" style="margin-top:14px"><div class="card-head"><span class="card-title">Booking</span></div>${booked}</div>
          <div class="card"><div class="card-head"><span class="card-title">Visitor</span></div>${visitor}</div>
          <div class="card"><div class="card-head"><span class="card-title">Attendees</span><span class="card-note">${b.heads} in party</span></div><div class="ci-att">${att||'<div class="muted" style="padding:8px 0">No attendee names on file</div>'}</div></div>
        </div>
        <div class="card"><div class="card-head"><span class="card-title">Reception</span></div><div class="card-body ci-action">${action}</div></div>
      </div>`;
  },
  dashboard(){
    const pill=(cls,txt)=>`<span class="pill ${cls}"><i class="dot"></i>${txt}</span>`;
    const availPill=(left,cap)=>{ const st=availState(left,cap); return st?`<span class="pill pill-${st.key==="ok"?"ok":"off"}">${st.key==="ok"?'<i class="dot"></i>':""}${st.label}</span>`:'<span class="muted">—</span>'; };
    const allSlots=P.flatMap(p=>p.slots.map(s=>({p,s})));
    const capSold=allSlots.reduce((a,x)=>a+(x.s.sold||0),0), capTot=allSlots.reduce((a,x)=>a+(x.s.cap||0),0);
    const capPct=capTot?Math.round(capSold/capTot*100):0;
    const activeDisc=DISCOUNTS.filter(d=>d.status==="Approved").length;
    const progs=[...WORKSHOPS,...EVENTS];

    // ---- KPI tiles (with icons) ----
    const S=(p)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
    const ICO={
      orders:S('<path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2.5a1.5 1.5 0 0 0 0 3V16a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2.5a1.5 1.5 0 0 0 0-3Z"/><path d="M9 6v12" stroke-dasharray="1.5 2"/>'),
      revenue:S('<circle cx="9" cy="9" r="6"/><path d="M18.5 10.7A6 6 0 1 1 10.5 18.7"/><path d="M7.5 7h2v4"/>'),
      capacity:S('<path d="M12 14 15.5 9"/><path d="M3.6 18a9 9 0 1 1 16.8 0"/>'),
      discount:S('<path d="M12.5 2.5H5a2.5 2.5 0 0 0-2.5 2.5v7.5a2 2 0 0 0 .6 1.4l7.5 7.5a2 2 0 0 0 2.8 0l6.6-6.6a2 2 0 0 0 0-2.8L14.4 3.1a2 2 0 0 0-1.9-.6Z"/><circle cx="8" cy="8" r="1.4"/>'),
      adult:S('<circle cx="12" cy="7" r="4"/><path d="M6 21v-1.5a4.5 4.5 0 0 1 4.5-4.5h3a4.5 4.5 0 0 1 4.5 4.5V21"/>'),
      child:S('<circle cx="12" cy="6" r="3"/><path d="M9 21v-5l-1.5-2.5a4.5 4.5 0 0 1 9 0L15 16v5"/>'),
      repeat:S('<path d="M17 3l3.5 3.5L17 10"/><path d="M4 11V9.5A3.5 3.5 0 0 1 7.5 6h13"/><path d="M7 21l-3.5-3.5L7 14"/><path d="M20 13v1.5a3.5 3.5 0 0 1-3.5 3.5h-13"/>'),
      school:S('<path d="M12 4 2 9l10 5 10-5Z"/><path d="M6 11v5c0 1.1 2.7 2.5 6 2.5s6-1.4 6-2.5v-5"/><path d="M22 9v5.5"/>')
    };
    const kpi=(icon,color,label,sample,value,sub)=>`<div class="setcard"><div class="kpi-top"><span class="kpi-ico kpi-${color}">${ICO[icon]}</span><div class="set-k">${label}${sample?' <span class="kpi-sample">sample</span>':""}</div></div><div class="set-v pos">${value}</div><div class="kpi-sub">${sub}</div></div>`;
    const mix=DASH.adultsToday+DASH.childrenToday;
    const tiles=`<div class="set">
      ${kpi("orders","blue","Orders today",1,DASH.ordersToday,`${DASH.visitorsToday} visitors expected`)}
      ${kpi("revenue","teal","Revenue today",1,money(DASH.revenueToday),"across all channels")}
      ${kpi("capacity","amber","Capacity in use",0,`${capPct}<span class="set-u">%</span>`,`${capSold} of ${capTot} seats today`)}
      ${kpi("discount","blue","Active discounts",0,activeDisc,`of ${DISCOUNTS.length} configured`)}
    </div>`;

    // ---- live "in the building now" — booked vs checked-in adult/child per active session ----
    const bld=DASH.building||[];
    const ciTot=bld.reduce((a,r)=>a+r.cAdult+r.cChild,0);   // checked-in headcount currently inside
    const occRows=bld.map(r=>`<tr>
        <td><b style="font-weight:500">${r.product}</b></td>
        <td>${r.date}</td><td class="code">${r.start}</td><td class="code">${r.end}</td>
        <td class="code ctr occ-grp">${r.bAdult}</td><td class="code ctr">${r.bChild}</td>
        <td class="code ctr occ-grp">${r.cAdult}</td><td class="code ctr">${r.cChild}</td>
      </tr>`).join("");
    const occupancy=`<div class="card occ-card">
      <div class="card-head"><span class="card-title"><span class="dot-live"></span> In the building now</span><span class="card-note" style="margin-left:auto">${ciTot} currently inside</span></div>
      <div class="matrix-wrap"><table class="reclist occ-table">
        <thead>
          <tr><th colspan="4"></th><th colspan="2" class="ctr occ-grp">Booked</th><th colspan="2" class="ctr occ-grp">Checked-in</th></tr>
          <tr><th>Product</th><th>Date</th><th>Start time</th><th>End time</th><th class="ctr occ-grp">Adult</th><th class="ctr">Child</th><th class="ctr occ-grp">Adult</th><th class="ctr">Child</th></tr>
        </thead>
        <tbody>${occRows}</tbody>
      </table></div></div>`;

    // ---- audience stat strip (sample) ----
    const strip=`<div class="set">
      ${kpi("adult","blue","Adults today",1,DASH.adultsToday,`${Math.round(DASH.adultsToday/mix*100)}% of visitors`)}
      ${kpi("child","teal","Children today",1,DASH.childrenToday,`${Math.round(DASH.childrenToday/mix*100)}% of visitors`)}
      ${kpi("repeat","amber","Repeat visitors",1,DASH.repeatVisitors,`${DASH.repeatPct}% returning today`)}
      ${kpi("school","blue","Schools booked",1,DASH.schoolsToday,`${DASH.schoolsMonth} this month`)}
    </div>`;

    // ---- booking sources: website vs POS walk-ins (sample) ----
    const web=DASH.sources.website, pos=DASH.sources.pos, srcTot=web+pos||1;
    const webPct=Math.round(web/srcTot*100), posPct=100-webPct;
    const sources=`<div class="card"><div class="card-head"><span class="card-title">Booking sources</span><span class="card-note">sample · today</span></div>
      <div class="card-body">
        <div class="splitbar"><span style="width:${webPct}%;background:var(--blue)"></span><span style="width:${posPct}%;background:var(--teal)"></span></div>
        <div class="legend"><span><i style="background:var(--blue)"></i>Website <b>${web}</b> · ${webPct}%</span><span><i style="background:var(--teal)"></i>POS walk-ins <b>${pos}</b> · ${posPct}%</span></div>
      </div></div>`;

    // ---- today vs best day this week (from the sample trend) ----
    const bestVal=Math.max(...DASH.revenue7), bestIdx=DASH.revenue7.indexOf(bestVal), bestDay=DASH.days[bestIdx];
    const todayVal=DASH.revenueToday, isBest=todayVal>=bestVal, delta=todayVal-bestVal;
    const bestday=`<div class="card"><div class="card-head"><span class="card-title">Today vs best day this week</span><span class="card-note">sample</span></div>
      <div class="card-body"><div class="cmp">
        <div class="cmp-row"><span class="cmp-k">Today</span><div class="cmp-bar"><div class="cmp-fill" style="width:${Math.round(todayVal/bestVal*100)}%;background:var(--blue)"></div></div><span class="cmp-v">${money(todayVal)}</span></div>
        <div class="cmp-row"><span class="cmp-k">Best (${bestDay})</span><div class="cmp-bar"><div class="cmp-fill" style="width:100%;background:var(--teal)"></div></div><span class="cmp-v">${money(bestVal)}</span></div>
      </div>
      <div class="kpi-sub" style="margin-top:12px">${isBest?"Today is the week's best day. 🎉":`${money(Math.abs(delta))} below the week's best — ${Math.round(todayVal/bestVal*100)}% of ${bestDay}.`}</div>
      </div></div>`;

    // ---- today's sessions (real product slots) ----
    const sessionRows=allSlots.slice(0,9).map(({p,s})=>{ const left=slotLeft(s); return `<tr>
      <td class="code">${s.t1}–${s.t2}</td>
      <td><b style="font-weight:500">${p.n}</b><div class="sub">${s.n}</div></td>
      <td class="code" style="text-align:center">${s.sold}/${s.cap}</td>
      <td>${availPill(left,s.cap)}</td></tr>`; }).join("");
    const sessions=`<div class="card"><div class="card-head"><span class="card-title">Today's sessions</span><span class="card-note">${allSlots.length} slots</span></div>
      <div class="matrix-wrap" style="max-height:340px;overflow:auto"><table><thead><tr><th>Time</th><th>Product · slot</th><th class="ctr">Seats</th><th>Availability</th></tr></thead>
      <tbody>${sessionRows}</tbody></table></div></div>`;

    // ---- needs attention (real, derived) ----
    const pendingDisc=DISCOUNTS.filter(d=>d.status!=="Approved").length;
    const draftProgs=progs.filter(x=>x.listing&&x.listing.status==="Draft").length;
    const progSlots=progs.flatMap(x=>(x.batches||[]).map(b=>({cap:b.cap,sold:b.sold})));
    const tightSlots=[...allSlots.map(x=>x.s),...progSlots].filter(s=>{ const st=availState(slotLeft(s),s.cap); return st&&(st.key==="low"||st.key==="sold"); }).length;
    const refDate=parseDMY(DASH.todayDate);
    const upBlackouts=BLACKOUTS.filter(b=>{ const d=parseDMY(b); return d&&refDate&&d>=refDate; }).length;
    const attnDefs=[
      pendingDisc?["attn-warn",pendingDisc,`${pendingDisc} discount${pendingDisc>1?"s":""} awaiting approval`,"discounts"]:null,
      draftProgs?["attn-warn",draftProgs,`${draftProgs} program${draftProgs>1?"s":""} still in draft`,"programs"]:null,
      tightSlots?["attn-stop",tightSlots,`${tightSlots} slot${tightSlots>1?"s":""} sold out or filling fast`,"products"]:null,
      upBlackouts?["attn-info",upBlackouts,`${upBlackouts} blackout date${upBlackouts>1?"s":""} coming up`,"blackout"]:null
    ].filter(Boolean);
    const attn=`<div class="card"><div class="card-head"><span class="card-title">Needs attention</span></div>
      <div class="attn">${attnDefs.length?attnDefs.map(([cls,n,t,go])=>`<button class="attn-row ${cls}" data-goto="${go}"><span class="attn-n">${n}</span><span class="attn-t">${t}</span><span class="attn-go">›</span></button>`).join(""):'<div class="card-body muted" style="font-size:12.5px">All clear — nothing needs attention.</div>'}</div></div>`;

    // ---- revenue last 7 days (sample bars) ----
    const maxRev=Math.max(...DASH.revenue7);
    const bars=`<div class="card"><div class="card-head"><span class="card-title">Revenue — last 7 days</span><span class="card-note">sample</span></div>
      <div class="card-body"><div class="bars">${DASH.revenue7.map((v,i)=>{ const h=Math.round(v/maxRev*100),today=i===DASH.revenue7.length-1; return `<div class="bar${today?" today":""}"><span class="bar-v">${Math.round(v/1000)}k</span><div class="bar-track"><div class="bar-fill" style="height:${h}%"></div></div><span class="bar-x">${DASH.days[i]}</span></div>`; }).join("")}</div></div></div>`;

    // ---- capacity by product (real meters) ----
    const meterRows=P.map(p=>{ const sold=p.slots.reduce((a,s)=>a+(s.sold||0),0),cap=p.slots.reduce((a,s)=>a+(s.cap||0),0),pct=cap?Math.round(sold/cap*100):0; const st=availState(Math.max(0,cap-sold),cap)||{key:"ok"}; return `<div class="meterrow"><span class="mname">${p.n}</span><div class="meter"><div class="meter-fill ${st.key}" style="width:${pct}%"></div></div><span class="mnum">${sold}/${cap} · ${pct}%</span></div>`; }).join("");
    const meters=`<div class="card"><div class="card-head"><span class="card-title">Capacity by product</span></div><div class="card-body" style="padding-top:4px">${meterRows}</div></div>`;

    // ---- recent orders (real) ----
    const orderRows=BOOKINGS.map(b=>`<tr>
      <td class="code">${b.ref}</td>
      <td><b style="font-weight:500">${b.customer}</b><div class="sub">${b.product}</div></td>
      <td class="code" style="text-align:center">${b.heads}</td>
      <td class="code">${money(b.total)}</td>
      <td>${b.paymentMode||"—"}</td>
      <td>${b.status==="Confirmed"?pill("pill-ok","Confirmed"):pill("pill-draft",b.status)}</td></tr>`).join("");
    const orders=`<div class="card"><div class="card-head"><span class="card-title">Recent orders</span><span class="card-note">${BOOKINGS.length} shown</span></div>
      <div class="matrix-wrap"><table class="reclist"><thead><tr><th>Ref</th><th>Customer · product</th><th class="ctr">Heads</th><th>Total</th><th>Payment</th><th>Status</th></tr></thead>
      <tbody>${orderRows}</tbody></table></div></div>`;

    // ---- membership (real, from MEMBERS / MEMBERSHIP_TIERS) ----
    const memActive=MEMBERS.filter(x=>memberStatus(x).key==="ok").length;
    const memSoon=MEMBERS.filter(x=>memberStatus(x).key==="soon").length;
    const memExpired=MEMBERS.filter(x=>memberStatus(x).key==="expired").length;
    const byTier=MEMBERSHIP_TIERS.map(t=>({name:t.name,count:MEMBERS.filter(x=>x.tier===t.name).length}));
    const maxTier=Math.max(1,...byTier.map(t=>t.count));
    const memMeters=byTier.map(t=>`<div class="meterrow"><span class="mname">${tierPill(t.name)}</span><div class="meter"><div class="meter-fill ok" style="width:${Math.round(t.count/maxTier*100)}%"></div></div><span class="mnum">${t.count}</span></div>`).join("");
    const membership=`<div class="card"><div class="card-head"><span class="card-title">Membership</span><span class="card-note">${MEMBERS.length} members</span></div>
      <div class="card-body" style="display:flex;gap:22px;flex-wrap:wrap;border-bottom:1px solid var(--rule)">
        <span><span class="f-k">Active</span><br><b style="font-size:16px">${memActive}</b></span>
        <span><span class="f-k">Expiring soon</span><br><b style="font-size:16px;color:var(--warn)">${memSoon}</b></span>
        <span><span class="f-k">Expired</span><br><b style="font-size:16px;color:var(--stop)">${memExpired}</b></span></div>
      <div class="card-body" style="padding-top:6px">${memMeters}</div></div>`;
    // members expiring soon / expired — the attention list
    const flagged=MEMBERS.map((m,i)=>({m,i,st:memberStatus(m)})).filter(x=>x.st.key!=="ok").sort((a,b)=>(a.st.daysLeft??0)-(b.st.daysLeft??0));
    const expRows=flagged.length?flagged.map(({m,i,st})=>`<tr data-open="member:${i}">
        <td class="code">${m.id}</td>
        <td><b style="font-weight:500">${pairLabel(m)}</b></td>
        <td>${tierPill(m.tier)}</td>
        <td class="code">${m.expires}</td>
        <td>${memberStatusPill(m)}</td></tr>`).join("")
      :'<tr><td colspan="5" class="muted">No memberships need attention.</td></tr>';
    const expiring=`<div class="card"><div class="card-head"><span class="card-title">Memberships needing attention</span><span class="card-note">expiring or expired</span></div>
      <div class="matrix-wrap"><table class="reclist"><thead><tr><th>Member ID</th><th>Registered pair</th><th>Tier</th><th>Expires</th><th>Status</th></tr></thead>
      <tbody>${expRows}</tbody></table></div></div>`;

    return tiles + occupancy + strip + `<div class="dash-row">${sessions}${attn}</div>` + `<div class="dash-row">${bars}${meters}</div>` + `<div class="dash-row">${sources}${bestday}</div>` + `<div class="dash-row">${membership}${expiring}</div>` + orders;
  },
  tiers(){
    return `${toolbar("Search membership tiers",MEMBERSHIP_TIERS.length+" plans")}
    <div class="card"><div class="matrix-wrap"><table class="reclist"><thead><tr>
      <th>Plan</th><th>Price</th><th>Visits</th><th>Validity</th><th>Discounts (Birthday / Events / Workshops)</th><th>Status</th></tr></thead>
    <tbody>${MEMBERSHIP_TIERS.map((t,i)=>`<tr data-open="tier:${i}">
      <td>${tierPill(t.name)}</td>
      <td class="code">${money(t.price)}</td>
      <td class="code">${t.visits==="Unlimited"?'<b style="font-weight:600">Unlimited</b>':t.visits}</td>
      <td>${t.validity}</td>
      <td class="code">${t.discounts.birthday}% / ${t.discounts.events}% / ${t.discounts.workshops}%</td>
      <td>${t.status==="Active"?'<span class="pill pill-ok"><i class="dot"></i>Active</span>':'<span class="pill pill-draft"><i class="dot"></i>'+t.status+'</span>'}</td></tr>`).join("")}
      <tr><td colspan="6"><button class="rep-add" data-tab="new" style="border-radius:4px">+ New tier</button></td></tr>
    </tbody></table></div></div>`;
  },
  members(){
    const active=MEMBERS.filter(m=>memberStatus(m).key==="ok").length;
    const soon=MEMBERS.filter(m=>memberStatus(m).key==="soon").length;
    const redemMonth=MEMBERS.reduce((a,m)=>a+(m.redemptions||[]).filter(r=>/Aug 2026/.test(r.date)).reduce((s,r)=>s+(r.visits||0),0),0);
    const S=(p)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
    const kpi=(ico,color,label,value,sub)=>`<div class="setcard"><div class="kpi-top"><span class="kpi-ico kpi-${color}">${ico}</span><div class="set-k">${label}</div></div><div class="set-v pos">${value}</div><div class="kpi-sub">${sub}</div></div>`;
    const tiles=`<div class="set">
      ${kpi(S('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/>'),"blue","Total members",MEMBERS.length,"across all tiers")}
      ${kpi(S('<path d="M20 6 9 17l-5-5"/>'),"teal","Active",active,"currently valid")}
      ${kpi(S('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),"amber","Expiring soon",soon,"within 30 days")}
      ${kpi(S('<path d="M3 3v18h18"/><path d="M7 14l3-3 3 3 5-6"/>'),"blue","Redemptions",redemMonth,"visits this month")}
    </div>`;
    const rows=MEMBERS.map((m,i)=>{ const st=memberStatus(m); const bal=visitsBalance(m);
      const visCell=isUnlimited(m)?'<b style="font-weight:600">Unlimited</b>':`${m.visitsUsed||0} / ${m.visitsTotal||0} <span class="muted">(${bal} left)</span>`;
      const hay=`${String(m.phone).replace(/\D/g,"")} ${m.adult} ${m.child} ${m.id}`.toLowerCase();
      return `<tr data-open="member:${i}" data-member-row data-search="${escAttr(hay)}">
      <td class="code">${m.id}</td>
      <td><b style="font-weight:500">${pairLabel(m)}</b><div class="sub code">${m.phone}</div></td>
      <td>${tierPill(m.tier)}</td>
      <td>${m.expires}${st.daysLeft!=null?`<div class="sub">${st.daysLeft<0?"expired "+(-st.daysLeft)+"d ago":"in "+st.daysLeft+" days"}</div>`:""}</td>
      <td class="code">${visCell}</td>
      <td>${memberStatusPill(m)}</td>
      <td><div style="display:flex;gap:8px"><button class="btn" data-open="member:${i}">View</button><button class="btn" data-member-edit="${i}">Edit</button><button class="btn" data-open-renew="${i}">Renew</button></div></td></tr>`; }).join("");
    const searchbar=`<div class="toolbar"><label class="search"><span>&#8981;</span><input data-member-search placeholder="Search members by mobile number, name or ID" aria-label="Search members" autocomplete="off"></label>
      <span class="tool-note" id="memberCount">${MEMBERS.length} members</span></div>`;
    return tiles+searchbar+
    `<div class="card"><div class="matrix-wrap"><table class="reclist" id="membersTable"><thead><tr>
      <th>Member ID</th><th>Registered pair</th><th>Tier</th><th>Validity</th><th>Visits</th><th>Membership Status</th><th>Actions</th></tr></thead>

    return `<div class="note note-scope"><span class="note-mark">Scope</span><div>
      §12 asks for <b>GTM, GA, Meta and Google Ads</b> on the site. Rather than hard-coding four providers, the panel offers <b>three slots in the page</b> and lets marketing paste whatever a provider gives them — so a fifth tool next year is a paste, not a release.

      ${slots.map(([k,t,d])=>`<div class="card" style="margin:0">

          <span class="card-note code">${SCRIPTS.filter(x=>x.place===k).length}</span></div>

  shopreports(){
    const totRev=SHOP_SALES.reduce((a,s)=>a+shopSaleCompute(s).grand,0);
    const totGst=SHOP_SALES.reduce((a,s)=>a+shopSaleCompute(s).gst,0);
    const totNet=SHOP_SALES.reduce((a,s)=>a+shopSaleCompute(s).net,0);
    const byPay={}; SHOP_SALES.forEach(s=>{const c=shopSaleCompute(s);byPay[s.pay]=(byPay[s.pay]||0)+c.grand;});
    const S=(p)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
    const kpi=(ico,color,label,value,sub)=>`<div class="setcard"><div class="kpi-top"><span class="kpi-ico kpi-${color}">${ico}</span><div class="set-k">${label}</div></div><div class="set-v pos">${value}</div><div class="kpi-sub">${sub}</div></div>`;
    const tiles=`<div class="set">
      ${kpi(S('<path d="M3 3v18h18"/><path d="M7 14l3-3 3 3 5-6"/>'),"blue","Sales",SHOP_SALES.length,"transactions")}
      ${kpi(S('<circle cx="9" cy="9" r="6"/><path d="M18.1 10.7A6 6 0 1 1 10.7 18.1"/><path d="M7.5 7h2v4"/>'),"teal","Revenue",money(Math.round(totRev)),"incl. GST")}
      ${kpi(S('<path d="M4 4h16v16H4z"/><path d="M4 9h16M9 4v16"/>'),"amber","GST collected",money(Math.round(totGst)),"CGST + SGST")}
      ${kpi(S('<path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>'),"blue","Net (taxable)",money(Math.round(totNet)),"before GST")}
    </div>`;
    const payRows=Object.entries(byPay).map(([k,v])=>`<tr><td>${k}</td><td class="code">${money(Math.round(v))}</td></tr>`).join("");
    const payTable=`<div class="card"><div class="card-head"><span class="card-title">Revenue by payment mode</span><button class="btn" style="margin-left:auto" data-export="shopreports-pay">Export CSV</button></div><div class="matrix-wrap"><table class="reclist"><thead><tr><th>Payment mode</th><th>Amount</th></tr></thead><tbody>${payRows}</tbody></table></div></div>`;
    const hsnMap={};
    SHOP_SALES.forEach(s=>{ const c=shopSaleCompute(s);
      c.lines.forEach(l=>{ const it=l.it; if(!it||!it.hsn) return; const taxable=l.taxable, cg=taxable*l.halfPct/100;
        const m=hsnMap[it.hsn]||(hsnMap[it.hsn]={hsn:it.hsn,qty:0,taxable:0,cgst:0,sgst:0,pct:l.gstPct}); m.qty+=l.qty; m.taxable+=taxable; m.cgst+=cg; m.sgst+=cg; }); });
    const hsnRows=Object.values(hsnMap).map(m=>`<tr><td class="code">${m.hsn}</td><td class="code">${m.qty}</td><td class="code">${money(Math.round(m.taxable))}</td><td class="code">${m.pct/2}% · ${money(Math.round(m.cgst))}</td><td class="code">${m.pct/2}% · ${money(Math.round(m.sgst))}</td><td class="code">${money(Math.round(m.cgst+m.sgst))}</td></tr>`).join("");
    const hsnTable=`<div class="card"><div class="card-head"><span class="card-title">HSN / SAC-wise breakup</span><span class="card-note">quantity is the units sold — mandatory for the GST return</span><button class="btn" style="margin-left:auto" data-export="shopreports-hsn">Export CSV</button></div><div class="matrix-wrap"><table class="reclist"><thead><tr><th>HSN/SAC</th><th>Qty sold</th><th>Taxable value</th><th>CGST</th><th>SGST</th><th>Total tax</th></tr></thead><tbody>${hsnRows}</tbody></table></div></div>`;
    return tiles+payTable+hsnTable;
  },

function inventoryFields(noun="product"){

/* ---- Ratio between two visitor categories, on the product --------------------
   The Visitor categories master can only say "an Adult must also be on the booking" —
   a presence test, so one adult with twenty children passes it. Supervision is a
   ratio, and it belongs to the product because a gallery and a workshop do not
   supervise alike. The two sides are whatever categories this product actually sells
   to, so the rule is built from the selection made above it rather than assuming
   Adult and Child. */
let prodRatio = { a:"", b:"", min:"1", max:"5" };

const ratioInt = v => /^\d+$/.test(String(v).trim()) ? parseInt(v,10) : NaN;
const isAdultCat = n => /adult/i.test(String(n));

/* ---- Per-product entry rules (Validation rules tab) ------------------------
   A rule reads "for each `subject` ticket, require min..max `requires` tickets".
   min 1 makes the other category mandatory; min 0 lets the subject enter alone;
   a blank max means no upper limit. Held per product on P[i].rules.{product,addon}. */
const ruleReqs = r => Array.isArray(r.requires) ? r.requires.filter(Boolean) : (r.requires ? [r.requires] : []);
function ruleSentence(r){
  const S=r.subject||"—";
  const reqs=ruleReqs(r);
  const conj=(r.mode==="all")?" and ":" or ";
  const mn=ratioInt(r.min);
  const mx=(r.max===""||r.max==null)?Infinity:ratioInt(r.max);
  if(!reqs.length) return "Pick at least one required category.";
  if(!(mn>=0))     return "Set a whole-number minimum.";
  if(mn>=1){
    const range = mx===Infinity ? `at least ${mn}` : mx===mn ? `exactly ${mn}` : `${mn}–${mx}`;
    return `Every ${S} needs ${reqs.map(q=>`${range} ${q}`).join(conj)}.`;
  }
  const names=reqs.join(conj);
  if(mx===Infinity) return `${S} may enter alone — ${names} optional.`;
  if(mx===0)        return `${S} may enter, but no ${names} alongside.`;
  return `${S} may enter alone — up to ${mx} ${names} allowed.`;
}
function ruleProblem(r,cats){
  const reqs=ruleReqs(r);
  if(!r.subject||!reqs.length) return "Pick a subject and at least one required category.";
  if(reqs.includes(r.subject)) return "A category can't require itself.";
  if(cats&&(!cats.includes(r.subject)||reqs.some(q=>!cats.includes(q)))) return "This product doesn't sell one of these categories.";
  const mn=ratioInt(r.min); if(!(mn>=0)) return "Min needs a whole number (0 or more).";
  if(r.max!==""&&r.max!=null){ const mx=ratioInt(r.max);
    if(!(mx>=0)) return "Max needs a whole number, or leave it blank for no limit.";
    if(mx<mn) return `Max is below min — ${mx} cannot be fewer than ${mn}.`; }
  return "";
}

/* The categories ticked on the form right now — the rule can only speak about these. */
function ratioPickedCats(){
  const fld=document.querySelector('.fld[data-df="visitor_categories[]"]');
  if(!fld) return [];
  return [...fld.querySelectorAll('.chip-opt[data-on="1"]')].map(c=>c.textContent.trim().split(" · ")[0]);
}

/* Keep the two sides pointing at categories that are still selected. */
function ratioFix(cats){
  if(!cats.includes(prodRatio.a)) prodRatio.a = cats.find(isAdultCat) || cats[0] || "";
  if(!cats.includes(prodRatio.b) || prodRatio.b===prodRatio.a)
    prodRatio.b = cats.find(n=>n!==prodRatio.a && !isAdultCat(n)) || cats.find(n=>n!==prodRatio.a) || "";
}

function ratioProblems(cats){
  const r=prodRatio, out=[];
  if(cats.length<2){ out.push("Select at least two visitor categories above to set a ratio."); return out; }
  if(!r.a||!r.b){ out.push("Pick both sides of the ratio."); return out; }
  if(r.a===r.b){ out.push("The two sides have to be different categories."); return out; }
  const mn=ratioInt(r.min), mx=ratioInt(r.max);
  if(!(mn>=0)||!(mx>=0)) out.push("Min and max need whole numbers.");
  else if(mx<mn) out.push(`Max is below min — ${mx} cannot be fewer than ${mn}.`);
  else if(mx===0) out.push(`A max of 0 means no ${r.b} can be booked with this at all.`);
  return out;
}

/* The rule restated against a party you can picture. */
function ratioExample(){
  const r=prodRatio, mn=ratioInt(r.min), mx=ratioInt(r.max);
  const one=`1 ${r.a} may bring ${mn} to ${mx} ${r.b}`;
  return `${one}  ·  12 ${r.b} need at least ${Math.ceil(12/mx)} ${r.a}`;
}

/* Message and disabled states, updated in place so typing never loses the caret. */
function syncRatio(){
  const box=document.getElementById("ratioMsg");
  if(!box) return;
  const cats=ratioPickedCats();
  document.querySelectorAll("[data-ratio],[data-ratio-cat]").forEach(el=>{
    el.disabled = cats.length<2;
  });
  const problems=ratioProblems(cats);
  box.className = "ratio-msg" + (problems.length?" is-bad":"");
  box.textContent = problems.length ? problems[0] : ratioExample();
}

/* Rebuilt whenever the category selection changes, so the two dropdowns always
   offer exactly what this product is sold to. */
function ratioInner(cats){
  ratioFix(cats);
  const pick=(side,val)=>`<div class="selwrap ratio-sel"><select class="inp" data-ratio-cat="${side}">
    ${cats.length?cats.map(c=>`<option${c===val?" selected":""}>${escAttr(c)}</option>`).join("")
                 :`<option value="">No category selected</option>`}
  </select></div>`;
  return `<div class="lab"><span class="lab-n">Visitor category ratio</span>${tip("Supervision as a ratio rather than a presence test. Pick the two categories it holds between, then how many of the second one each of the first may bring. The sides come from the categories selected for this product.")}
      <span class="lab-req">Optional</span></div>
    <div class="ratio-row">
      ${pick("a",prodRatio.a)}
      <span class="ratio-x">allow</span>
      ${pick("b",prodRatio.b)}
      <span class="ratio-x">min</span>
      <input class="inp mono ratio-n" data-ratio="min" value="${escAttr(prodRatio.min)}" inputmode="numeric" aria-label="Minimum">
      <span class="ratio-x">max</span>
      <input class="inp mono ratio-n" data-ratio="max" value="${escAttr(prodRatio.max)}" inputmode="numeric" aria-label="Maximum">
    </div>
    <div class="ratio-msg" id="ratioMsg"></div>`;
}
function ratioField(cats){
  return `<div class="fld wide" data-df="adult_child_ratio">${ratioInner(cats||[])}</div>`;
}
function rebuildRatio(){
  const fld=document.querySelector('.fld[data-df="adult_child_ratio"]');
  if(!fld) return;
  fld.innerHTML = ratioInner(ratioPickedCats());
  syncRatio();

    const secs = label==="program" ? [

    const byName=names=>names.map(n=>schema.find(f=>(f[0].split("|")[1]||f[0])===n)).filter(Boolean);
