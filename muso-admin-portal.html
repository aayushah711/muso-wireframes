    const byName=names=>names.map(n=>schema.find(f=>(f[0].split("|")[1]||f[0])===n)).filter(Boolean);
    const secs=[["Basics",["code","name","capacity"]],["Status",["is_active"]]];
    headings=secs.map(s=>s[0]); groups=secs.map(s=>byName(s[1]));
  } else if(current==="hsn"){   // HSN / SAC code — field-based sections, not catalogue chunks
    const byName=names=>names.map(n=>schema.find(f=>(f[0].split("|")[1]||f[0])===n)).filter(Boolean);
    const secs=[["Basics",["code","kind","description"]],["Tax",["tax_rate_ids[]"]],["Status",["is_active"]]];
    headings=secs.map(s=>s[0]); groups=secs.map(s=>byName(s[1]));
  } else if(label==="role"){   // Careers opening — group by field, not catalogue chunks
    const byName=names=>names.map(n=>schema.find(f=>(f[0].split("|")[1]||f[0])===n)).filter(Boolean);
    const secs=[["The opening",["title","dept","type","active"]],
                ["Where, who and what we ask for",["loc","exp","portfolio"]],
                ["Dates",["posted / closes"]],
                ["Job description",["about","jd"]]];
    headings=secs.map(x=>x[0]); groups=secs.map(x=>byName(x[1]));
  } else if(label==="tax rate"){   // Tax rate — group by field so sections aren't catalogue chunks
    const byName=names=>names.map(n=>schema.find(f=>(f[0].split("|")[1]||f[0])===n)).filter(Boolean);
    const secs=[["Basics",["code","name"]],["Rate & validity",["percentage","is_active"]]];
    headings=secs.map(s=>s[0]); groups=secs.map(s=>byName(s[1]));
  } else if(label==="product"){   // Shop product — group by field so sections are meaningful, not chunks of 3
    const byName=names=>names.map(n=>schema.find(f=>(f[0].split("|")[1]||f[0])===n)).filter(Boolean);
    const secs=[["Basics",["pd","name","description","cat"]],["Pricing & tax",["base","mrp","tax_rate_ids[]","hsn_sac_id"]],["Inventory",["stock"]]];
    headings=secs.map(s=>s[0]); groups=secs.map(s=>byName(s[1]));
  } else if(label==="coupon"){   // Shop coupon
    const byName=names=>names.map(n=>schema.find(f=>(f[0].split("|")[1]||f[0])===n)).filter(Boolean);
    const secs=[["Coupon",["code","desc","type","v","valid_from / valid_to"]],["Approval",["proposedBy"]],["Status",["is_active"]]];
    headings=secs.map(s=>s[0]); groups=secs.map(s=>byName(s[1]));
  } else {
    for(let i=0;i<schema.length;i+=3) groups.push(schema.slice(i,i+3));
  }
  let secHTML=groups.map((group,i)=>`<section class="form-sec">
        <div class="form-sec-head"><span class="form-sec-title">${headings[i]||"Additional details"}</span></div>
        <div class="form-sec-body">${group.map(f=>field(f,values)).join("")}</div></section>`);
  if(label==="program"){
    const invSec=`<section class="form-sec"><div class="form-sec-head"><span class="form-sec-title">Inventory</span></div>
        <div class="form-sec-body">${inventoryFields("program")}</div></section>`;
    secHTML.splice(Math.max(0,secHTML.length-1),0,invSec);   // before Listing content
  }
  return `<div>
    <div class="card">
      <div class="card-head"><span class="card-title">${editing?"Edit":"New"} ${label}</span></div>
      <div class="form-body product-form">${secHTML.join("")}</div>
      ${current==="career"?"":`<div class="form-foot">${current==="departments"&&!editing?`<span class="form-err" id="deptErr"></span>`:""}<button class="btn" data-tab="list">Cancel</button><button class="btn btn-primary"${label==="event"?' data-save-event="1"':current==="departments"&&!editing?' data-dept-create="1"':current==="blackout"&&!editing?' data-blackout-create="1"':editing&&mEdit>=0&&masterData(current)?' data-medit-save="1"':''}>${editing?"Save changes":"Create "+label}</button></div>`}
    </div>
  </div>`;
}

function bookingForm(editing=false){
  const record=editing?BOOKINGS[selBooking]:null;
  const products=P.filter(p=>p.type==="Product" || (p.type==="Add-on" && p.standalone));
  const programs=PROGRAMS();
  const PCATS=CATS.map(c=>c.name); // programs are priced per seat; ask by the same visitor categories
  // resolvers
  // Each cart entry now holds an array of independent combinations (`cfg.combos`). A product/add-on
  // combo is {date, slot, qty, redeem}; a program combo is {batch, qty}. These helpers iterate combos.
  const combosOf=cfg=>(cfg&&cfg.combos)||[];
  const slotFor=(list,combo)=>(list||[]).find(s=>s.n===combo.slot)||(list||[])[0]||{};
  const priceIn=(s,c)=>(s&&s.price&&s.price[c])||0;
  const progRec=key=>{const [k,idx]=key.split(":");return k==="event"?EVENTS[+idx]:WORKSHOPS[+idx];};
  const batchFor=(key,combo)=>{const r=progRec(key),bs=(r&&r.batches)||[];return bs[combo.batch||0]||bs[0]||{};};
  const comboSum=combo=>Object.values(combo.qty||{}).reduce((x,n)=>x+ +n,0)+Object.values(combo.redeem||{}).reduce((x,n)=>x+ +n,0);
  const qtySum=cfg=>combosOf(cfg).reduce((a,c)=>a+comboSum(c),0);
  // line totals — sum across every combination of the entry
  const prodLine=(i,cfg)=>{const p=P[i];return combosOf(cfg).reduce((t,combo)=>{const s=slotFor(p.slots,combo);return t+p.cats.reduce((tt,c)=>tt+((combo.qty&&combo.qty[c])||0)*priceIn(s,c),0);},0);};
  const addonLine=(code,cfg)=>{const a=P.find(x=>x.c===code);return combosOf(cfg).reduce((t,combo)=>{const s=slotFor(a.slots,combo);return t+a.cats.reduce((tt,c)=>tt+((combo.qty&&combo.qty[c])||0)*priceIn(s,c),0);},0);};
  const progLine=(key,cfg)=>combosOf(cfg).reduce((t,combo)=>{const b=batchFor(key,combo);return t+PCATS.reduce((tt,c)=>tt+((combo.qty&&combo.qty[c])||0)*(b.price||0),0);},0);
  // ---- membership: staff explicitly allocates each Product ticket to either "Redeem from
  // membership" (free, drawn from the shared pass pool) or "Pay for tickets" (full price) — no
  // automatic first-come allocation. Add-ons stay paid but get the member's add-on discount rate
  // instead of being free. Programs are untouched — the pass pool doesn't cover camps/workshops/
  // events. ----
  const member=bookingCustomer.member;
  // A membership visit covers general admission — the MuSo Tour (c:"MUSO") — ONLY. The box is shown
  // solely for a Tour booking with no add-ons / other products; adding anything else hides it.
  // (Programs are allowed alongside — they get the automatic member discount below, not a visit.)
  const hasTour=membershipVisitApplies();
  const isTour=i=>P[i]&&P[i].c==="MUSO";
  // Membership visit is per Ticket (combination) of the MuSo Tour — the box sits between the slot picker and Pay for tickets.
  const visitCombos=(member&&hasTour)?[...bookingProducts].flatMap(([i,cfg])=>isTour(i)?combosOf(cfg).map((combo,ci)=>({i,ci,combo})).filter(x=>isVisitSlot(slotFor(P[i].slots,x.combo))):[]):[];
  const redeemVisitCount=visitCombos.filter(x=>x.combo.redeemVisit).length;
  const redeemAdultCount=visitCombos.filter(x=>x.combo.redeemVisit&&x.combo.redeemAdult).length;
  const passesRemainingBefore=member?Math.max(0,member.passesTotal-member.passesUsed):0;
  const productRedemption=new Map(); // "i|comboIdx|category" -> {paid,amount}
  [...bookingProducts].forEach(([i,cfg])=>{const p=P[i];
    combosOf(cfg).forEach((combo,ci)=>{
      const s=slotFor(p.slots,combo);
      p.cats.forEach(c=>{
        const paid=(combo.qty&&combo.qty[c])||0;
        if(!paid) return;
        productRedemption.set(i+"|"+ci+"|"+c,{paid,amount:paid*priceIn(s,c)});
      });
    });
  });
  // A membership visit covers 1 Adult + 1 Child for the full day. Only one visit may be used per
  // booking/day, so redemption is a single booking-level flag — never a per-ticket count.
  const visitsUsedThisOrder=redeemVisitCount;
  const passesRemainingAfter=Math.max(0,passesRemainingBefore-visitsUsedThisOrder);
  const redeemedTillDate=member?member.passesUsed+visitsUsedThisOrder:0; // lifetime, including this order
  const productPaidTotal=[...productRedemption.values()].reduce((t,r)=>t+r.amount,0);
  const addonRawTotal=[...bookingAddons].reduce((t,[c,cf])=>t+addonLine(c,cf),0);
  const progTotal=[...bookingPrograms].reduce((t,[k,cf])=>t+progLine(k,cf),0);
  const subtotal=productPaidTotal+addonRawTotal+progTotal;
  const productInCart=[...bookingProducts.values()].some(cfg=>qtySum(cfg)>0);
  const hasItems=productInCart||[...bookingAddons.values()].some(cfg=>qtySum(cfg)>0)||[...bookingPrograms.values()].some(cfg=>qtySum(cfg)>0)||redeemVisitCount>0;
  // ---- discounts: a typed code (any code, not just IND50) + auto-applied ones by cart condition ----
  // per-category qty across a cart entry (products/add-ons store qty per selected slot; programs are flat)
  const catQtys=cf=>{ const out={}; combosOf(cf).forEach(combo=>{ Object.entries(combo.qty||{}).forEach(([c,n])=>{ out[c]=(out[c]||0)+(+n||0); }); }); return out; };
  const anyQty=cf=>Object.values(catQtys(cf)).reduce((a,n)=>a+n,0)>0;
  const hasProduct=[...bookingProducts.values()].some(anyQty);
  const hasAddon=[...bookingAddons.values()].some(anyQty);
  const hasProgram=[...bookingPrograms.values()].some(anyQty);
  let maxCatQty=0; [...bookingProducts.values(),...bookingAddons.values()].forEach(cf=>{ Object.values(catQtys(cf)).forEach(n=>{ if(n>maxCatQty) maxCatQty=n; }); });
  const pctOf=(v,base)=>String(v).includes("%")?base*(parseFloat(v)||0)/100:Math.min(base,parseFloat(String(v).replace(/[^0-9.]/g,""))||0);
  // typed code — match any Approved code-based discount by d.n, cond code, or series voucher
  const codeUP=String(bookingDiscountCode||"").trim().toUpperCase();
  const seriesHit=d=>{ if(!isSeries(d)) return false; const s=d.series; if(!codeUP.startsWith(String(s.prefix||"").toUpperCase())) return false; const n=parseInt(codeUP.replace(/\D/g,""),10); return !isNaN(n)&&n>=+s.from&&n<=+s.to; };
  const discount=codeUP?DISCOUNTS.find(d=>d.status==="Approved"&&!applyInfo(d).auto&&(String(d.n||"").toUpperCase()===codeUP||(d.cond||[]).some(c=>String(c.code||"").toUpperCase()===codeUP)||seriesHit(d))):null;
  const codeDiscAmt=discount?pctOf(discount.v,subtotal):0;
  // auto-applied — evaluate each Approved automatic discount against the cart (simplified conditions)
  const autoDiscs=[]; let bundlingDone=false;
  DISCOUNTS.filter(d=>d.status==="Approved"&&applyInfo(d).auto).forEach(d=>{
    const kinds=(d.cond||[]).map(c=>c.k);
    if(kinds.includes("Customer holds a membership")){ if(member) autoDiscs.push({label:"Membership",v:d.v,amount:pctOf(d.v,subtotal)}); return; }
    if(applyInfo(d).memberOnly){ if(member&&hasProgram) autoDiscs.push({label:d.n,v:d.v,amount:pctOf(d.v,progTotal)}); return; }
    if(/Add-on bundling/i.test(d.n||"")){ if(!bundlingDone&&hasProduct&&hasAddon){ bundlingDone=true; autoDiscs.push({label:"Add-on bundling",v:d.v,amount:pctOf(d.v,addonRawTotal)}); } return; }
    if(d.tiers&&d.tiers.length){ if(maxCatQty>=+d.tiers[0][0]){ const tier=[...d.tiers].reverse().find(t=>maxCatQty>=+t[0])||d.tiers[0]; autoDiscs.push({label:"Quantity break",v:tier[1]+"%",amount:subtotal*(parseFloat(tier[1])||0)/100}); } return; }
  });
  const autoDiscAmt=autoDiscs.reduce((t,x)=>t+x.amount,0);
  const discAmt=Math.min(subtotal,codeDiscAmt+autoDiscAmt);
  const addonDiscountPct=member?(member.addonDiscountPct||0):0;
  const addonDiscountAmt=addonRawTotal*addonDiscountPct/100;
  const gst=Math.round(Math.max(0,subtotal-discAmt-addonDiscountAmt)*0.18);
  const grand=Math.max(0,subtotal-discAmt-addonDiscountAmt)+gst;
  const section=(title,body)=>`<section class="form-sec"><div class="form-sec-head"><span class="form-sec-title">${title}</span></div><div class="form-sec-body">${body}</div></section>`;
  const adultInCfg=cf=>combosOf(cf).reduce((a,combo)=>a+((combo.qty&&combo.qty["Adult"])||0),0);
  const adultQty=[...bookingProducts].reduce((t,[,cf])=>t+adultInCfg(cf),0)+[...bookingAddons].reduce((t,[,cf])=>t+adultInCfg(cf),0)+redeemAdultCount;
  const step=(pfx,cat,q)=>{ const cd=CATS.find(c=>c.name===cat); const needsAdult=cd&&cd.req==="Adult"; const warn=needsAdult&&q.n>0&&adultQty===0;
    return `<div class="pos-qty-row"><span class="n">${cat}</span><span class="p">${money(q.price)} each</span><span class="pos-step"><button data-book-qty="${pfx}|${escAttr(cat)}|-1" ${q.n===0?"disabled":""}>−</button><span>${q.n}</span><button data-book-qty="${pfx}|${escAttr(cat)}|1">+</button></span></div>${needsAdult?`<div class="child-req${warn?" child-req-warn":""}">${warn?"⚠ ":""}Purchase of an adult ticket is mandatory for this age group.</div>`:""}`; };
  const slotBadge=(s)=>{const left=slotLeft(s),st=availState(left,s.cap);if(!st)return"";const cls=st.key==="sold"?" slot-sold":st.key==="low"?" slot-low":"";return `<span class="slot-avail${cls}">${st.label} · ${left}/${s.cap}</span>`;};
  // ---- date-driven slot picker: calendar on the left, that day's slots on the right ----
  // one combination's date + time-slot picker: calendar on the left, that day's slots (RADIO — pick
  // one) on the right. pfx = "kind|id|comboIdx"; each combo tracks its own visible month (combo.calMonth).
  const comboPicker=(pfx,list,combo)=>{
    const selDate=combo.date||defaultDateFor(list);
    const anchor=combo.calMonth||parseDMY(selDate)||new Date();
    const y=anchor.getFullYear(),m=anchor.getMonth();
    const first=new Date(y,m,1),startBlank=dayIndexMon0(first),daysInMonth=new Date(y,m+1,0).getDate();
    const cells=[]; for(let i=0;i<startBlank;i++) cells.push(null); for(let d=1;d<=daysInMonth;d++) cells.push(new Date(y,m,d));
    const calBody=cells.map(d=>{
      if(!d) return '<span class="cal-day cal-day-empty"></span>';
      const ds=fmtDMY(d),blackout=isBlackout(ds),avail=slotsForDate(list,ds).length>0,selected=ds===selDate;
      const cls="cal-day"+(selected?" cal-day-selected":"")+(blackout?" cal-day-blackout":"")+(!avail&&!blackout?" cal-day-off":"");
      return (avail&&!blackout)||selected
        ? `<button class="${cls}" data-book-cal-date="${pfx}|${ds}" title="${blackout?"Blackout":avail?"":"No slots"}">${d.getDate()}</button>`
        : `<span class="${cls}">${d.getDate()}</span>`;
    }).join("");
    const cal=`<div class="cal-cal">
      <div class="cal-head"><button class="cal-nav" data-book-cal-nav="${pfx}|-1" aria-label="Previous month">‹</button><span>${MONTHS[m]} ${y}</span><button class="cal-nav" data-book-cal-nav="${pfx}|1" aria-label="Next month">›</button></div>
      <div class="cal-grid">${WEEKDAYS.map(w=>`<span class="cal-dow">${w}</span>`).join("")}${calBody}</div>
      <div class="cal-legend"><span><i class="cal-sw-blackout"></i>Blackout / Public Holiday</span><span><i class="cal-sw-selected"></i>Selected</span></div>
    </div>`;
    const candidates=slotsForDate(list,selDate);
    const dOf=parseDMY(selDate);
    const dayLabel=dOf?`${WEEKDAYS[dayIndexMon0(dOf)]} ${dOf.getDate()} ${MONTHS[dOf.getMonth()]}`:selDate;
    // radio: exactly one slot per combination — picking a slot replaces the previous choice.
    const rows=candidates.length?candidates.map(s=>{
      const left=slotLeft(s),sold=left<=0,checked=combo.slot===s.n,st=availState(left,s.cap)||{key:"ok",label:"Available"};
      const pill=st.key==="sold"?["cal-pill-off",st.label]:st.key==="low"?["cal-pill-low",st.label]:["cal-pill-ok",st.label];
      return `<button class="cal-slot-row${checked?" cal-slot-row-selected":""}" data-book-slot="${pfx}|${escAttr(s.n)}" role="radio" aria-checked="${checked}" ${sold&&!checked?"disabled":""}>
        <div class="cal-slot-left"><span class="cal-slot-check cal-slot-radio${checked?" cal-slot-check-on":""}"></span><div class="cal-slot-main"><div class="cal-slot-time">${s.t1}–${s.t2}</div><div class="cal-slot-sub">${s.n}</div></div></div>
        <div class="cal-slot-right"><span class="cal-pill ${pill[0]}">${pill[1]}</span><div class="cal-slot-price">${money((s.price&&s.price.Adult)||0)} / ticket</div>${s.cap!=null?`<div class="cal-slot-remaining">${left}/${s.cap}</div>`:""}</div>
      </button>`;
    }).join(""):`<div class="pos-empty">${isBlackout(selDate)?"Closed — blackout date.":"No slots run on this day."}</div>`;
    const list2=`<div class="cal-slots"><div class="cal-slots-head">Available Slots <small>${dayLabel} · pick one</small></div>${rows}</div>`;
    return `<div class="slot-group"><div class="cal-layout">${cal}${list2}</div></div>`;
  };
  const itemCard=(key,open,badgeQty,name,meta,disabled)=>`<div class="item-card${open?" item-card-open":""}${disabled?" item-card-disabled":""}">
    <button class="item-card-main" data-book-card="${key}" aria-expanded="${open}" ${disabled?"disabled":""}>
      <div class="item-card-name">${name}</div>
      <div class="item-card-meta">${meta}</div>
    </button>
  </div>`;

  // ---- PRODUCTS tab ----
  const productCards=products.map(p=>{
    const i=P.indexOf(p),key="prod|"+i,cfg=bookingProducts.get(i),open=bookingOpenItem===key;
    const totalQty=cfg?qtySum(cfg):0;
    const from=Math.min(...p.slots.map(s=>(s.price&&s.price.Adult)||Infinity));
    const meta=`${p.type==="Add-on"?"Add-on · ":""}${p.slots.length} slot${p.slots.length===1?"":"s"} · from ${money(isFinite(from)?from:0)}`;
    return itemCard(key,open,totalQty,p.n,meta);
  }).join("");
  // A membership visit (1 Adult + 1 Child, one per day) is redeemed via the full-width checkbox box
  // at the top of the tickets tab — see `membershipBox` below. The per-slot ticket section is now just
  // the "Pay for tickets" steppers, full width, for anyone not covered by the visit.
  // the "tour" ticket section — same qty steppers as before, just repeated once per selected slot,
  // each independently addressable via a "prod|i|slotName" prefix so its counts stay separate.
  // per-Ticket membership visit box — one visit = 1 Adult + 1 Child, drawn from the shared pass pool
  const cbox=(on,disabled)=>`<span class="mcb${on?" mcb-on":""}${disabled?" mcb-dis":""}">${on?'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>':""}</span>`;
  const memberVisitBox=(i,ci,combo)=>{
    const visitOn=!!combo.redeemVisit, adultOn=!!(visitOn&&combo.redeemAdult);
    const usedByOthers=redeemVisitCount-(visitOn?1:0);
    const canUse=(passesRemainingBefore-usedByOthers)>0||visitOn;
    const pfx="prod|"+i+"|"+ci;
    return `<div class="membership-box">
      <div class="membership-box-head"><span class="membership-box-title">Membership visit</span><span class="membership-box-stat">${redeemedTillDate} of ${member.passesTotal} used · <b>${passesRemainingAfter} remaining</b></span></div>
      <div class="membership-cbs">
        <button type="button" class="mcb-row${visitOn?" mcb-row-on":""}" data-redeem-visit="${pfx}" ${canUse?"":"disabled"}>
          ${cbox(visitOn,!canUse)}
          <span class="mcb-txt"><b>Use a membership visit for this ticket</b><span>${canUse||visitOn?`Admits 1 child, free — ${passesRemainingAfter} of ${member.passesTotal} left.`:"No visits remaining on this membership."}</span></span>
        </button>
        <button type="button" class="mcb-row${adultOn?" mcb-row-on":""}" data-redeem-adult="${pfx}" ${visitOn?"":"disabled"}>
          ${cbox(adultOn,!visitOn)}
          <span class="mcb-txt"><b>Add the accompanying adult, free</b><span>${visitOn?"One visit admits 1 adult + 1 child.":"Tick a membership visit first."}</span></span>
        </button>
      </div>
    </div>`;
  };
  const productDetails=[...bookingProducts].filter(([i])=>bookingOpenItem==="prod|"+i).map(([i,cfg])=>{
    const p=P[i], combos=combosOf(cfg);
    const blocks=combos.map((combo,ci)=>{
      const s=slotFor(p.slots,combo), pfx="prod|"+i+"|"+ci;
      const head=`<div class="combo-head"><span class="combo-title">Ticket ${ci+1}</span>${combos.length>1?`<button class="pos-item-remove" data-book-remove-combo="prod|${i}|${ci}">Remove</button>`:""}</div>`;
      const memBox=(member&&hasTour&&isTour(i)&&isVisitSlot(s))?memberVisitBox(i,ci,combo):"";
      const payLbl=member?`<div class="pos-lbl" style="margin:0 0 11px;display:block"><div>Pay for tickets</div><div class="redeem-sub">For anyone in the group who isn't using the membership — priced for the ${s.t1||""}–${s.t2||""} slot.</div></div>`:`<div class="pos-lbl">${p.n} · tickets</div>`;
      const payBlock=`<div class="pay-block">${payLbl}${p.cats.map(c=>step(pfx,c,{price:priceIn(s,c),n:(combo.qty&&combo.qty[c])||0})).join("")}</div>`;
      return `<div class="combo-block">${head}${comboPicker(pfx,p.slots,combo)}${memBox}${payBlock}</div>`;
    }).join("");
    return `<div class="pos-item"><div class="pos-item-head"><span class="pos-item-name">${p.n}</span></div>${blocks}<button class="rep-add" data-book-add-combo="prod|${i}">+ Add Ticket</button></div>`;
  }).join("");
  const productsTab=`<div class="item-cards">${productCards}</div>${productDetails}`;

  // ---- ADD-ONS tab ----
  const bookableAddons=P.filter(p=>p.type==="Add-on" && p.standalone && !bookingProducts.has(P.indexOf(p)));
  const addonCards=bookableAddons.map(a=>{
    const key="addon|"+a.c,cfg=bookingAddons.get(a.c),open=bookingOpenItem===key;
    const totalQty=cfg?qtySum(cfg):0;
    const meta=`Add-on · from ${money((a.slots[0]&&a.slots[0].price&&a.slots[0].price.Adult)||0)}`;
    return itemCard(key,open,totalQty,a.n,meta,!productInCart);
  }).join("");
  const addonDetails=[...bookingAddons].filter(([code])=>bookingOpenItem==="addon|"+code).map(([code,cfg])=>{
    const a=P.find(x=>x.c===code);if(!a)return"";
    const combos=combosOf(cfg);
    const blocks=combos.map((combo,ci)=>{
      const s=slotFor(a.slots,combo), pfx="addon|"+code+"|"+ci;
      const head=`<div class="combo-head"><span class="combo-title">Ticket ${ci+1}</span>${combos.length>1?`<button class="pos-item-remove" data-book-remove-combo="addon|${escAttr(code)}|${ci}">Remove</button>`:""}</div>`;
      const payBlock=`<div class="pay-block"><div class="pos-lbl">${a.n} · tickets</div>${a.cats.map(c=>step(pfx,c,{price:priceIn(s,c),n:(combo.qty&&combo.qty[c])||0})).join("")}</div>`;
      return `<div class="combo-block">${head}${comboPicker(pfx,a.slots,combo)}${payBlock}</div>`;
    }).join("");
    return `<div class="pos-item"><div class="pos-item-head"><span class="pos-item-name">${a.n}</span></div>${blocks}<button class="rep-add" data-book-add-combo="addon|${escAttr(code)}">+ Add Ticket</button></div>`;
  }).join("");
  const addonsTab=`${productInCart?"":'<div class="pos-lbl"><small>— add a product to the order first</small></div>'}<div class="item-cards">${addonCards}</div>${addonDetails}`;

  // ---- PROGRAMS tab ----
  const programCards=programs.map(p=>{
    const progKey=p.kind+":"+p.idx,key="prog|"+progKey,cfg=bookingPrograms.get(progKey),open=bookingOpenItem===key;
    const r=p.rec,batches=r.batches||[];
    const totalQty=cfg?qtySum(cfg):0;
    const from=Math.min(...batches.map(b=>b.price||Infinity));
    const meta=`${r.cat} · from ${money(isFinite(from)?from:0)}`;
    return itemCard(key,open,totalQty,r.n,meta);
  }).join("");
  const programDetails=programs.filter(p=>bookingOpenItem==="prog|"+p.kind+":"+p.idx).map(p=>{
    const progKey=p.kind+":"+p.idx,cfg=bookingPrograms.get(progKey);if(!cfg)return"";
    const r=p.rec,batches=r.batches||[],combos=combosOf(cfg);
    const blocks=combos.map((combo,ci)=>{
      const pfx="prog|"+progKey+"|"+ci, b=batchFor(progKey,combo);
      const head=`<div class="combo-head"><span class="combo-title">Ticket ${ci+1}</span>${combos.length>1?`<button class="pos-item-remove" data-book-remove-combo="prog|${progKey}|${ci}">Remove</button>`:""}</div>`;
      const grid=`<div class="pos-lbl">${r.n} · batch</div><div class="pos-grid">${batches.map((bb,bi)=>{const soldOut=slotLeft(bb)<=0,cur=(combo.batch||0)===bi;return `<button class="pos-btn" data-book-batch="prog|${progKey}|${ci}|${bi}" aria-pressed="${cur}" ${soldOut&&!cur?"disabled":""}><div class="pos-btn-n">${bb.n}</div><div class="pos-btn-d">${bb.from}${bb.to&&bb.to!==bb.from?" – "+bb.to:""}</div><div class="pos-btn-p">${money(bb.price)}</div>${slotBadge(bb)}</button>`;}).join("")}</div>`;
      const seats=`<div class="pos-lbl">${r.n} · seats</div>${PCATS.map(c=>step(pfx,c,{price:b.price||0,n:(combo.qty&&combo.qty[c])||0})).join("")}`;
      return `<div class="combo-block">${head}${grid}${seats}</div>`;
    }).join("");
    return `<div class="pos-item"><div class="pos-item-head"><span class="pos-item-name">${r.n}</span></div>${blocks}<button class="rep-add" data-book-add-combo="prog|${progKey}">+ Add Ticket</button></div>`;
  }).join("");
  const programsTab=`<div class="item-cards">${programCards}</div>${programDetails}`;

  // ---- attendees (one per ticket) — step 3 ----
  // Products/add-ons are keyed by slot, so each selected slot gets its own labeled attendee rows —
  // that's what lets staff put the same visitors on every slot, or different visitors per slot.
  const heads=[];
  const collectCombos=(items,recFor,slotsFor)=>items.forEach(([id,cfg])=>{
    const rec=recFor(id); if(!rec) return; const slist=slotsFor(id);
    combosOf(cfg).forEach(combo=>{
      const s=slotFor(slist,combo), slotLbl=`${combo.date||""}${s.t1?" "+s.t1+"–"+s.t2:(combo.slot?" "+combo.slot:"")}`.trim();
      rec.cats.forEach(c=>{const total=((combo.qty&&combo.qty[c])||0)+((combo.redeem&&combo.redeem[c])||0);for(let n=0;n<total;n++)heads.push({label:`${rec.n} — ${slotLbl} · ${c} ${n+1}`, cat:c});});
    });
  });
  collectCombos([...bookingProducts],i=>P[i],i=>P[i].slots);
  collectCombos([...bookingAddons],code=>P.find(x=>x.c===code),code=>(P.find(x=>x.c===code)||{slots:[]}).slots);
  [...bookingPrograms].forEach(([key,cfg])=>{const nm=progRec(key).n;combosOf(cfg).forEach(combo=>{const b=batchFor(key,combo);PCATS.forEach(c=>{const total=(combo.qty&&combo.qty[c])||0;for(let n=0;n<total;n++)heads.push({label:nm+(b.n?" · "+b.n:"")+" · "+c+" "+(n+1), cat:c});});});});
  // the free heads covered by a redeemed membership visit — 1 Child always, +1 Adult if joining (age band set here)
  visitCombos.filter(x=>x.combo.redeemVisit).forEach(x=>{ const lbl="Membership visit"+(x.combo.date?" · "+x.combo.date:""); heads.push({label:lbl+" · Child", cat:"Child"}); if(x.combo.redeemAdult) heads.push({label:lbl+" · Adult", cat:"Adult"}); });
  const attendeesTab = heads.length ? `<div class="pos-lbl">Attendee details <small>one per ticket</small></div><div class="attendee-list">${heads.map((h,idx)=>{const child=/child/i.test(h.cat||"");const req=child?'<span class="lab-req">Required</span>':'';const rq=child?" required aria-required=\"true\"":"";return `<div class="attendee-row"><div class="attendee-kind">${h.label}</div><div class="fld"><div class="lab"><span class="lab-n">Name</span>${req}</div><input class="inp"${rq} placeholder="Full name"></div><div class="fld"><div class="lab"><span class="lab-n">Date of birth</span></div><input class="inp mono" data-dob="${idx}" placeholder="DD/MM/YYYY"></div><div class="fld"><div class="lab"><span class="lab-n">Age</span>${req}</div><input class="inp mono" id="age_${idx}"${rq} placeholder="Years" aria-live="polite"></div></div>`;}).join("")}</div>` : `<div class="pos-empty">Add tickets first — attendees appear here.</div>`;

  // ---- step 2 sub-tabs, each labelled with how many tickets are already in it ----
  const prodCount=[...bookingProducts.values()].reduce((s,c)=>s+qtySum(c),0);
  const addonCount=[...bookingAddons.values()].reduce((s,c)=>s+qtySum(c),0);
  const progCount=[...bookingPrograms.values()].reduce((s,c)=>s+qtySum(c),0);
  const tabDefs=[["products","Products",prodCount],["addons","Add-ons",addonCount],["programs","Programs",progCount]];
  const tabBar=`<div class="subs">${tabDefs.map(([k,l])=>`<button class="sub-tab" data-book-tab="${k}" aria-selected="${bookingTab===k}">${l}</button>`).join("")}</div>`;
  const tabContent={products:productsTab,addons:addonsTab,programs:programsTab}[bookingTab]||productsTab;
  const bookingStepBody=`<section class="form-sec"><div class="form-sec-head"><span class="form-sec-title">What to book</span></div>
    ${tabBar}<div class="form-sec-body pos-body">${tabContent}</div></section>`;
  const attendeesStepBody=`<section class="form-sec"><div class="form-sec-head"><span class="form-sec-title">Attendee details</span></div><div class="form-sec-body pos-body">${attendeesTab}</div></section>`;

  // ---- order summary — grouped by product/slot, running total, inline qty edit + removal on every line, payment docked at the bottom ----
  const cartCatLine=(pfx,cat,qty,price,amount,note,useRedeemControl)=>{ amount=amount==null?qty*price:amount; const attr=useRedeemControl?"data-book-redeem":"data-book-qty"; return `<div class="cart-line${useRedeemControl?" cart-line-redeemed":""}">
    <div class="cart-line-cat">${cat}${note?` <span class="cart-line-note">${note}</span>`:""}</div>
    <span class="cart-step"><button ${attr}="${pfx}|${escAttr(cat)}|-1" aria-label="Fewer ${cat}">−</button><span>${qty}</span><button ${attr}="${pfx}|${escAttr(cat)}|1" aria-label="More ${cat}">+</button></span>
    <span class="cart-line-amt">${money(amount)}</span>
    <button class="cart-line-x" ${attr}="${pfx}|${escAttr(cat)}|-${qty}" aria-label="Remove ${cat}">✕</button>
  </div>`; };
  const cartGroup=(name,sub,linesHtml)=>`<div class="cart-group">
    <div class="cart-group-head"><span class="cart-group-name">${name}</span><span class="cart-group-sub">${sub}</span></div>
    ${linesHtml}
  </div>`;
  const cartRows=[];
  // one cart group per *combination* — the same item booked across two date/time combos shows up as
  // two separate, independently editable/removable groups in the order summary.
  const comboSub=(date,s)=>`${date||""}${s&&s.t1?" · "+s.t1+"–"+s.t2:""}`||(s&&s.n)||"";
  [...bookingProducts].forEach(([i,cfg])=>{const p=P[i];
    combosOf(cfg).forEach((combo,ci)=>{
      const s=slotFor(p.slots,combo), pfx="prod|"+i+"|"+ci;
      const lines=p.cats.flatMap(c=>{const r=productRedemption.get(i+"|"+ci+"|"+c); if(!r||!(r.paid>0)) return [];
        return [cartCatLine(pfx,c,r.paid,priceIn(s,c),r.amount,"")];
      }).join("");
      if(lines) cartRows.push(cartGroup(p.n,comboSub(combo.date,s),lines));
    });});
  [...bookingAddons].forEach(([code,cfg])=>{const a=P.find(x=>x.c===code);if(!a)return;
    combosOf(cfg).forEach((combo,ci)=>{
      const s=slotFor(a.slots,combo), pfx="addon|"+code+"|"+ci;
      const lines=a.cats.map(c=>{const q=(combo.qty&&combo.qty[c])||0;return q?cartCatLine(pfx,c,q,priceIn(s,c)):"";}).filter(Boolean).join("");
      if(lines) cartRows.push(cartGroup(a.n,comboSub(combo.date,s),lines));
    });});
  [...bookingPrograms].forEach(([key,cfg])=>{const r=progRec(key);
    combosOf(cfg).forEach((combo,ci)=>{const b=batchFor(key,combo);
      const lines=PCATS.map(c=>{const q=(combo.qty&&combo.qty[c])||0;return q?cartCatLine("prog|"+key+"|"+ci,c,q,b.price||0):"";}).filter(Boolean).join("");
      if(lines) cartRows.push(cartGroup(r.n,b.n||r.cat,lines));});});
  // membership visits show as their own free cart entry — 1 Child per redeemed visit, plus 1 Adult per accompanying-adult tick
  if(redeemVisitCount>0){
    const freeLine=(cat,qty)=>`<div class="cart-line cart-line-redeemed">
      <div class="cart-line-cat">${cat} <span class="cart-line-note">membership · free</span></div>
      <span class="cart-line-amt" style="min-width:auto;color:var(--ink3)">×${qty}</span>
      <span class="cart-line-amt">${money(0)}</span></div>`;
    const mlines=(redeemAdultCount>0?freeLine("Adult",redeemAdultCount):"")+freeLine("Child",redeemVisitCount);
    cartRows.push(cartGroup("Membership visit",`${member.tier} · ${redeemVisitCount} visit${redeemVisitCount>1?"s":""}`,mlines));
  }
  const summaryPay=hasItems?`<div class="summary-pay">
    <div class="summary-pay-lbl">Payment method</div>
    <div class="summary-pay-grid">${["Cash","Card","UPI","Voucher"].map(m=>`<button class="summary-pay-btn" data-book-pay="${escAttr(m)}" aria-pressed="${bookingPay===m}">${m}</button>`).join("")}</div>
    ${editing?"":`<button class="btn btn-primary summary-pay-cta">Take payment · ${money(grand)}</button>`}
  </div>`:"";
  const summary=`<aside class="booking-summary"><div class="booking-summary-head">Order summary${cartRows.length?` <span class="booking-summary-count">${cartRows.length} item${cartRows.length===1?"":"s"}</span>`:""}</div><div class="booking-summary-body">
    ${cartRows.length?cartRows.join(""):`<div class="pos-empty">Nothing added yet.<br>Pick a product or program to begin.</div>`}
    <div class="booking-discount"><input class="inp mono" id="bookingDiscountCode" placeholder="Discount code" value="${escAttr(bookingDiscountCode)}"><button class="btn" data-apply-book-discount="1">Apply</button></div>
    ${bookingDiscountTried?`<div class="booking-discount-msg${discount?" ok":" bad"}">${discount?`✓ ${codeLabel(discount)} applied — ${discount.v} off`:"Code not recognised or expired."}</div>`:""}
    <div class="booking-summary-row"><span>Subtotal</span><span>${money(subtotal)}</span></div>
    ${autoDiscs.map(x=>`<div class="booking-summary-row" style="color:var(--ok)"><span>${x.label} <span class="q" style="margin-left:2px">auto</span> · ${x.v}</span><span>− ${money(x.amount)}</span></div>`).join("")}
    ${discount?`<div class="booking-summary-row" style="color:var(--ok)"><span>${codeLabel(discount)} · ${discount.v} off</span><span>− ${money(codeDiscAmt)}</span></div>`:""}
    ${addonDiscountAmt?`<div class="booking-summary-row" style="color:var(--amber)"><span>★ ${member.tier} Add-on Discount (${addonDiscountPct}%)</span><span>− ${money(addonDiscountAmt)}</span></div>`:""}
    ${(discAmt||addonDiscountAmt)?`<div class="booking-summary-row" style="font-weight:600"><span>Net amount</span><span>${money(Math.max(0,subtotal-discAmt-addonDiscountAmt))}</span></div>`:""}
    <div class="booking-summary-row"><span>GST 18%</span><span>${money(gst)}</span></div>
    <div class="booking-summary-total"><span>Total due</span><span>${money(grand)}</span></div>
  </div>${summaryPay}</aside>`;

  // ---- customer — phone-first lookup against past orders, not just blank entry — step 1 ----
  const custMatch=bookingCustomerLinked>=0?CUSTOMERS[bookingCustomerLinked]:null;
  const miss=f=>bookingStep1Tried&&!String((bookingCustomer[f]||"")).trim();
  const reqMark=f=>miss(f)?'<span class="lab-req" style="color:var(--stop)">Required</span>':'<span class="lab-req">Required</span>';
  // Location and PIN code — at least ONE must be provided
  const locOrPin=String(bookingCustomer.location||"").trim()||String(bookingCustomer.pincode||"").trim();
  const missLoc=bookingStep1Tried&&!locOrPin;
  const reqLoc=`<span class="lab-req"${missLoc?' style="color:var(--stop)"':''}>Optional</span>`;
  const customerSection=section("Customer",`
    <div class="fld${miss("phone")?" fld-miss":""}"><div class="lab"><span class="lab-n">Phone</span>${reqMark("phone")}</div><div class="inp-wrap"><input class="inp mono${custMatch?" inp-matched":""}" id="bookCustPhone" type="tel" inputmode="tel" autocomplete="off" placeholder="10-digit mobile number" value="${escAttr(bookingCustomer.phone)}">${custMatch?`<button type="button" class="cust-match-tab${bookingCustomer.member?" cust-match-tab-member":""}" data-unlink-customer="1" title="Matched ${escAttr(custMatch.name)}${bookingCustomer.member?` — ${escAttr(bookingCustomer.member.tier)} member, ${Math.max(0,bookingCustomer.member.passesTotal-bookingCustomer.member.passesUsed)} passes remaining`:""} — click to remove">${bookingCustomer.member?bookingCustomer.member.tier:"Existing"}</button>`:""}<div class="cust-suggest" id="custSuggest"></div></div></div>
    <div class="fld${miss("name")?" fld-miss":""}"><div class="lab"><span class="lab-n">Name</span>${reqMark("name")}</div><input class="inp" id="bookCustName" placeholder="Full name" value="${escAttr(bookingCustomer.name)}"></div>
    <div class="fld"><div class="lab"><span class="lab-n">Email</span><span class="lab-req">Optional</span></div><input class="inp" id="bookCustEmail" type="email" placeholder="name@example.com" value="${escAttr(bookingCustomer.email)}"></div>
    <div class="fld"><div class="lab"><span class="lab-n">GSTIN</span><span class="lab-req">Optional</span></div><input class="inp mono" id="bookCustGstin" placeholder="For a business / e-invoice" value="${escAttr(bookingCustomer.gstin||"")}"></div>
    <div class="fld${missLoc?" fld-miss":""}"><div class="lab"><span class="lab-n">Location</span>${reqLoc}</div><input class="inp" id="bookCustLocation" placeholder="Customer's city or area" value="${escAttr(bookingCustomer.location||"")}"></div>
    <div class="fld${missLoc?" fld-miss":""}"><div class="lab"><span class="lab-n">PIN code</span>${reqLoc}</div><input class="inp mono" id="bookCustPincode" inputmode="numeric" placeholder="e.g. 400058" value="${escAttr(bookingCustomer.pincode||"")}"></div>
    ${bookingStep1Tried&&(miss("phone")||miss("name")||missLoc)?`<div class="fld" style="grid-column:1/-1;color:var(--stop);font-size:12px">Fill the required fields to continue — PIN code or Location is required.</div>`:""}
  `);

  // ---- 3-step wizard: Customer → Booking → Attendees. Payment lives in the summary, not a step. ----
  const STEP_DEFS=[[1,"Customer"],[2,"Booking"],[3,"Attendees"]];
  const wizardBar=`<div class="wizard-steps">${STEP_DEFS.map(([n,l],idx)=>{
    const state=n===bookingStep?"current":n<bookingStep?"done":"todo";
    return `${idx>0?'<span class="wizard-step-line"></span>':""}<button class="wizard-step wizard-step-${state}" data-book-step="${n}" ${n>bookingStep?"disabled":""}><span class="wizard-step-n">${state==="done"?"✓":n}</span><span class="wizard-step-l">${l}</span></button>`;
  }).join("")}</div>`;
  const stepBody = bookingStep===1?customerSection:bookingStep===2?bookingStepBody:attendeesStepBody;
  const hint = (bookingStep===3 && !editing) ? `<span class="wizard-hint">Pick a payment method in the order summary to finish →</span>` : "";
  const back = bookingStep>1?`<button class="btn" data-book-back="1">← Back</button>`:"";
  const navBtn = bookingStep<3
    ? `<button class="btn btn-primary" data-book-next="1" ${bookingStep===2&&!hasItems?"disabled":""}>${bookingStep===1?"Next: Booking →":hasItems?"Next: Attendees →":"Add tickets to continue"}</button>`
    : editing ? `<button class="btn btn-primary">Save changes</button>` : "";

  const cancelConfirm = bookingCancelConfirm ? `<div class="confirm-layer">
    <button class="confirm-backdrop" data-book-cancel-dismiss="1" aria-label="Keep editing"></button>
    <div class="confirm-box" role="dialog" aria-modal="true" aria-labelledby="cancelConfirmTitle">
      <div class="confirm-title" id="cancelConfirmTitle">Discard this order?</div>
      <div class="confirm-body">${editing?"Any changes you've made won't be saved.":"The customer's details, tickets and attendees entered so far will be lost."} This can't be undone.</div>
      <div class="confirm-actions"><button class="btn btn-primary" data-book-cancel-dismiss="1">Keep editing</button><button class="btn btn-danger" data-book-cancel-confirm="1">Discard order</button></div>
    </div>
  </div>` : "";
  return `<div class="booking-layout">
    <div class="booking-main"><div class="card">
      <div class="card-head"><span class="card-title">${editing?"Edit "+record.ref:"New order"}</span>${hasItems?`<span class="head-running-total">Running total <b>${money(grand)}</b></span>`:""}<span class="card-note">Point of sale</span></div>
      ${wizardBar}
      <div class="form-body product-form">
        ${stepBody}
      </div>
      <div class="form-foot">${hint}<button class="btn" data-book-cancel="1">Cancel</button>${back}${navBtn}</div>
    </div></div>
    <aside class="booking-cart-col">${summary}</aside>
  </div>${cancelConfirm}`;
}

const SING={blackout:"blackout date",affiliates:"affiliate link",
  sources:"source",paymodes:"payment mode",scripts:"script",categories:"category",pools:"pool",
  tax:"tax rate",hsn:"code",discounts:"discount",products:"product or add-on",
  programs:"program",progcats:"program category",departments:"department",events:"event",camps:"camp or workshop",bookings:"order",career:"role",
  fboptions:"F&B option",schoolslots:"school time slot",entryprices:"school entry price preset",school:"school booking",
  sponsors:"sponsor",districts:"district",sponsored:"sponsored booking",venues:"venue"};
const singular=(k,n)=>SING[k]||n.toLowerCase().replace(/s$/,"");
const TYPE_LABEL={media:"Files",string:"Text",int:"Number",decimal:"Number",money:"Amount",
  date:"Date",datetime:"Date and time",time:"Time",bool:"Yes or no",enum:"Choose one",
  "enum[]":"Choose several",fk:"Pick from a list","fk[]":"Pick several",rows:"Table",
  json:"Table",richtext:"Formatted text",system:"Set automatically"};
const NARROW=["int","decimal","money","date","datetime","bool","time"];
function example(note){
  if(!note) return "";
  const f=note.split(/[,\u2014.]/)[0].trim().replace(/\u2026$/,"").trim();
  return /^[A-Za-z0-9][A-Za-z0-9_\-\/]{1,22}$/.test(f)?f:"";
}
/* Field guide \u2192 tooltips: description (what) + impact (watch-for), example \u2192 placeholder.
   Built from the FAQ data, keyed by field name, with per-master preference. */
const FIELD_HINTS = (()=>{
  const perMaster={}, any={};
  Object.entries(FAQ).forEach(([master,groups])=>{
    perMaster[master]=perMaster[master]||{};
    (groups||[]).forEach(([,rows])=>rows.forEach(r=>{
      const nm=(String(r[0]).split("|")[1]||r[0]).trim();
      const rec={what:r[1]||"",example:r[2]||"",edge:r[3]||""};
      perMaster[master][nm]=rec;
      if(!any[nm]) any[nm]=rec;
    }));
  });
  return {perMaster, any};
})();
function fieldHint(name){
  const order = current==="programs" ? ["events","camps"] : [current];
  for(const m of order){ const mm=FIELD_HINTS.perMaster[m]; if(mm&&mm[name]) return mm[name]; }
  // Shop masters have their own schema notes — don't inherit another master's generic hint by field
  // name (that's what put "Batch 1" in the shop product Name placeholder), so return null and let the
  // schema note drive the tooltip + placeholder.
  if(/^shop/.test(current)) return null;
  return FIELD_HINTS.any[name]||null;
}
/* Detail-page tooltips: map a read-only field label to the same description + watch-for the form shows. */
const LABEL_HINT = (()=>{
  const norm=s=>String(s).toLowerCase().replace(/\([^)]*\)/g,"").replace(/[^a-z0-9]/g,"");
  const m={};
  const add=sch=>(sch||[]).forEach(f=>{ if(!Array.isArray(f)||!f[0])return;
    const p=String(f[0]).split("|"), lab=p[0], name=p[1]||p[0];
    const note=f.length>3?f[3]:(String(f[2]||"").includes(" · ")?"":(f[2]||""));
    const k=norm(lab); if(!m[k]) m[k]={name,note}; });
  [PROD_BASE,PROD_ADDON_ONLY,PROD_PRODUCT_ONLY,PROD_REST,LISTING_FIELDS,PROGRAM_SCHEMA,EVENT_SCHEMA,CAMP_SCHEMA].forEach(add);
  Object.values(typeof SCHEMAS!=="undefined"?SCHEMAS:{}).forEach(add);
  const alias={code:"shortcode",active:"status",where:"whereitruns",ages:"minimumage",
    bookingsclose:"bookingcutoff",photosandvideo:"media",webaddress:"urlslug",
    supervision:"unaccompaniedattendance",tax:"taxrates",eventcode:"shortcode",
    eventname:"name",time:"starttime"};
  Object.entries(alias).forEach(([a,t])=>{ if(m[t]&&!m[a]) m[a]=m[t]; });
  return {m,norm};
})();
function dtip(label){
  const e=LABEL_HINT.m[LABEL_HINT.norm(label)]; if(!e) return "";
  const h=fieldHint(e.name);
  const desc=e.note||(h&&h.what)||"";
  const impact=(h&&h.edge)?h.edge:"";
  return tipRich(desc,impact);
}
/* Turn a prose example into a short input placeholder. */
function egPlaceholder(ex){
  if(!ex) return "";
  let s=stripTags(ex).replace(/[\u201c\u201d"\u2018\u2019]/g,"").trim();
  s=s.split(/ for | \u2014 | \u2013 |, | from /)[0].trim().replace(/[.\u3002]$/,"").trim();
  s=s.replace(/\u00a7\s?\d+(?:\.\d+)*(?:'s)?/g,"").trim();
  // reject prose (too many words, or a filler opener) so placeholders stay clean
  if(/\s/.test(s) && s.split(/\s+/).length>3) return "";
  if(/^(not|the|a|an|left|around|it|this|set|blank|shown|guidance|treat|belongs|same|which|where)\b/i.test(s)) return "";
  return (s && s.length<=32 && !/[<>]/.test(s)) ? s : "";
}
/* Prefer an explicit "e.g. X" inside a note as the input placeholder. */
function egFromNote(note){ const m=String(note||"").match(/e\.g\.\s*([^.,;]+)/i); return m?m[1].trim():""; }
/* The careers schema is small and its own thing, so it renders its own fields rather
   than inheriting the catalogue's required-field heuristics. */
/* The second half of the tooltip, the same "watch for" the other forms carry: what
   this field does once it is live, not a restatement of what to type. */
/* Only where there is something to be careful of — a change that hits the live page at
   once, or one that cannot be undone. Everything else gets the description alone. */
const CAREER_WATCH = {
  active:"Off takes the role off the live page at once, whatever the dates say.",
  "posted / closes":"Past the closing date the role stops taking applications.",
  jd:"A new file replaces the old one. The old one is not kept."
};
/* Placeholders follow the Products & add-ons form: a bare example of the answer,
   no "e.g." prefix and no restating the label. */
const CAREER_PH = {

  exp:"2-4 years",
  about:"Formatted text"
};
function careerField(f,values,label,name,type,required){
  const val=values[name];
  const ph=CAREER_PH[name]?` placeholder="${escAttr(CAREER_PH[name])}"`:"";
  let note=f.length>3?f[3]:(f[2]||"");
  const opts=(f.length>3?f[2]:"").split("·").map(x=>x.trim()).filter(Boolean);
  const wide=["richtext","bool","file"].includes(type)||name==="loc"||name.includes(" / ");
  let ctl;
  if(type==="auto")
    ctl=`<input class="inp mono" value="${escAttr(val||autoValue())}" readonly tabindex="-1">`;
  else if(type==="bool"){
    /* A new role is live unless told otherwise, but nothing is asked of applicants
       unless it is switched on. */
    const on = val===undefined ? (name!=="portfolio") : !!val;
    ctl=`<button class="sw" data-on="${on?1:0}"><i></i><span>${on?"On":"Off"}</span></button>`;
  }
  else if(type==="dept"){
    /* The list comes from the Departments master, not from the schema. */
    const live=deptNames();
    const list=(val && !live.includes(val)) ? live.concat(val) : live;   // a role keeps a team since removed
    ctl=`<div class="selwrap"><select class="inp"><option>Select&#8230;</option>${list.map(o=>
      `<option${String(val||"")===o?" selected":""}>${escAttr(o)}${live.includes(o)?"":" — no longer on file"}</option>`).join("")}</select></div>`;
  }
  else if(type==="enum")
    ctl=`<div class="selwrap"><select class="inp"><option>Select&#8230;</option>${opts.map(o=>
      `<option${String(val||"").toLowerCase()===o.toLowerCase()?" selected":""}>${escAttr(o)}</option>`).join("")}</select></div>`;
  else if(type==="file"){
    /* The uploaded file replaces the generated JD. The name of whatever is already on the
       role is shown beside it, because a file input cannot be given a value. */
    ctl=`<input class="inp career-file" type="file" accept=".pdf,.doc,.docx,.rtf,.odt">` +
      (val&&val.name?`<span class="career-hint" style="margin-top:6px">On file:
        <span class="app-file">${escAttr(val.name)}</span>
        ${val.size?humanSize(val.size):""} — choosing a file replaces it.</span>`:"");
  }
  else if(type==="richtext")
    ctl=`<textarea class="inp" rows="${name==="about"?3:5}" style="resize:vertical"${
      ph || (name!=="about"?' placeholder="One per line"':"")}>${escAttr(val==null?"":val)}</textarea>`;
  else if(name.includes(" / ")){
    /* Same shape as the discount form's "Offer runs between": one label, two dates. */
    const parts=name.split(" / ");
    ctl=`<div class="row2">${parts.map((k,i)=>{
      const v=Array.isArray(val)?val[i]:(values[k]!=null?values[k]:"");
      return `<input class="inp mono" data-dpart="${escAttr(k)}" placeholder="${i?"Closes — DD Mon YYYY":"Opens — DD Mon YYYY"}" value="${escAttr(v==null?"":v)}">`;
    }).join("")}</div>`;
  }
  else
    ctl=`<input class="inp mono"${type==="date"?' placeholder="DD Mon YYYY"':ph} value="${escAttr(val==null?"":val)}">`;
  if(type==="auto") note = val ? "Set when the role was created. It never changes."
                              : "Reserved for this role and assigned when you save.";
  return `<div class="fld${wide?" wide":""}" data-df="${escAttr(name)}">
    <div class="lab"><span class="lab-n">${label}</span>${tipRich(note,CAREER_WATCH[name]||"")}
      <span class="lab-req">${type==="auto"?"Generated":required?"Required":"Optional"}</span></div>
    ${ctl}</div>`;
}

function field(f,values={}){
  const [label,name] = f[0].includes("|") ? f[0].split("|") : [f[0],f[0]];
  const val=values[name];
  const type=f[1];
  const hasOpts=f.length>3;
  const optRaw=hasOpts?f[2]:(String(f[2]||"").includes(" · ")?f[2]:"");
  const note=hasOpts?f[3]:(optRaw?"":(f[2]||""));
  const opts=optRaw?optRaw.split("·").map(x=>x.trim()).filter(Boolean):[];
  const parts=name.includes(" / ")?name.split(" / "):[name];
  const wide=(!NARROW.includes(type)||parts.length>1)?" wide":"";
  const CAREER_REQ=["title","dept","type","loc","exp","posted / closes","about"];
  if(current==="career"){
    if(name==="code") return "";   // generated, and shown on the role itself — never a form field
    return careerField(f,values,label,name,type,CAREER_REQ.includes(name));
  }
  const req=(/^code$|^name$|^label$|^title$|^date$|^trigger$|^channel$|^price$|^percentage$|^min_age$|^start_time$|_id$/.test(name)||name==="valid_from / valid_to"||name==="start_time / end_time")&&type!=="bool"&&!/override/.test(name)?"Required":"Optional";
  /* A value the panel writes itself. On a new record there is nothing to show yet and
     nothing to fill in, so the field stays off the form and only appears on the record. */
  if(type==="auto") return !val ? "" : `<div class="fld" data-df="${escAttr(name)}">
    <div class="lab"><span class="lab-n">${label}</span><span class="lab-req">Generated</span></div>
    <input class="inp mono" value="${escAttr(val)}" readonly tabindex="-1">
    ${note?`<span class="career-hint">${note}</span>`:""}</div>`;
  const hint=fieldHint(name);
  const isFk=type==="fk"||type==="fk[]";
  // schema note is authoritative for the description (fk fields carry a "→ target" note, so use the FAQ text there)
  const desc=(!isFk && note) ? note : ((hint&&hint.what)||note||"");
  const impact=(hint&&hint.edge)?hint.edge:"";
  const egph=egFromNote(note)||egPlaceholder(hint&&hint.example);
  let ctl="";
  if(type==="bool"){ const on = val===undefined ? /^is_active$|^active$/.test(name) : !!val; ctl=`<button class="sw" data-on="${on?1:0}"><i></i><span>${on?"On":"Off"}</span></button>`; }
  else if(type==="enum[]"){ ctl=`<div class="chips">${opts.map(o=>`<button class="chip-add chip-opt" data-on="${Array.isArray(val)&&val.includes(o)?1:0}">${o}</button>`).join("")}</div>`; }
  else if(type==="enum"){ ctl=`<div class="selwrap"><select class="inp"><option>Select&#8230;</option>${opts.map(o=>`<option${String(val||"").toLowerCase()===o.toLowerCase()?" selected":""}>${o}</option>`).join("")}</select></div>`; }
  else if(type==="fk[]"||type==="fk"){
    const t=(note.match(/\u2192\s*([^.]+)/)||[,"master"])[1].trim();
    const list=OPTIONS[t];
    if(type==="fk"){
      ctl=`<div class="selwrap"><select class="inp">${
        !list?`<option>Select&#8230;</option>`
        :!list.length?`<option>No records yet — add one in ${t}</option>`
        :`<option>Select&#8230;</option>`+list.map(o=>`<option${val===o||String(o).startsWith(String(val)+" ·")?" selected":""}>${o}</option>`).join("")}</select></div>`;
    } else {
      const isEventCats=(current==="events"||(current==="programs"&&progKind==="event"))&&name==="visitor_categories[]"&&(tab==="new"||tab==="edit");
      ctl=(!list||!list.length)
        ?`<div class="chips"><span class="muted" style="font-size:11.5px;padding:2px 4px">No records yet — add them in ${t}</span></div>`
        :`<div class="chips">${list.map(o=>{const key=String(o).split(" · ")[0];const on=isEventCats?eventCats.has(key):Array.isArray(val)&&val.some(v=>v===o||v===key||String(o).startsWith(v+" "));return `<button class="chip-add chip-opt" data-on="${on?1:0}"${isEventCats?` data-eventcat="${escAttr(key)}"`:""}>${o}</button>`;}).join("")}</div>`;
    }
  }
  else if(type==="eventprices"){
    ctl=`<div class="event-price-grid">${CATS.filter(cat=>eventCats.has(cat.name)).map(cat=>`<div class="event-price-row">
      <span style="font-size:12.5px;font-weight:600">${cat.name}</span>
      <div class="inp-suffix"><input class="inp mono" type="number" min="0" placeholder="0" value="${val&&val[cat.name]!=null?escAttr(val[cat.name]):""}"><span>₹</span></div>
    </div>`).join("")}</div>`;
  }
  else if(type==="rows"||type==="json"){
    let cols=(optRaw||note).split(/[·\u00d7]/).map(x=>x.trim().split(".")[0].trim()).filter(Boolean);
    if(cols.length<2) cols=["Item","Value"];
    cols=cols.slice(0,4);
    const g=`grid-template-columns:repeat(${cols.length},1fr) 20px`;
    const rowValues=Array.isArray(val)&&Array.isArray(val[0])?val:[cols.map(()=>"")];
    ctl=`<div class="rep"><div class="rep-h" style="${g}">${cols.map(c=>`<span>${c}</span>`).join("")}<span></span></div>
      ${rowValues.map(row=>`<div class="rep-r" style="${g}">${cols.map((_,i)=>`<input class="inp" placeholder="&#8212;" value="${escAttr(row[i]||"")}">`).join("")}<span class="muted">&times;</span></div>`).join("")}
      <button class="rep-add">+ Add row</button></div>`;
  }
  else if(type==="media"){
    ctl=`<div style="border:1px dashed var(--rule2);border-radius:7px;padding:16px;text-align:center;background:#FBFCFA">
      <div style="font-size:12.5px;font-weight:500">Drop images and video here</div>
      <div style="font-size:11.5px;color:var(--ink3);margin:3px 0 9px">${val?"Existing: "+val:"The first image is the one the listing card uses"}</div>
      <button class="btn">Choose files</button></div>`;
  }
  else if(type==="richtext"){ ctl=`<textarea class="inp" style="min-height:70px;resize:vertical" placeholder="Formatted text">${val!=null?escAttr(val):""}</textarea>`; }
  else{
    const isNum=["int","decimal","money"].includes(type);
    const cutoff=name==="cutoff_days / cutoff_hours";
    const minutes=name==="checkout_hold_minutes";
    const ex=cutoff?"":(egph||example(note));
    ctl=`<div class="${parts.length>1?"row2":""}">${parts.map((x,i)=>{
      const fieldVal=Array.isArray(val)?val[i]:val;
      const ph=cutoff?(i===0?"e.g. 1":"e.g. 0"):(type==="date"?"DD/MM/YYYY":type==="time"?"HH:MM":(ex||(isNum?"0":x.replace(/_/g," "))));
      const input=`<input class="inp${isNum||type==="string"?" mono":""}" placeholder="${ph}"${isNum?` type="number" inputmode="decimal" min="0" step="${type==="int"?"1":"any"}"`:""}${fieldVal!=null?` value="${escAttr(fieldVal)}"`:""}>`;
      return cutoff?`<div class="inp-suffix">${input}<span>${i===0?"days ahead":"hours"}</span></div>`
        :minutes?`<div class="inp-suffix">${input}<span>minutes</span></div>`:input;
    }).join("")}</div>`;
  }
  return `<div class="fld${wide}${type==="eventprices"?" event-pricing-field":""}" data-df="${escAttr(name)}"><div class="lab"><span class="lab-n">${label}</span>${tipRich(desc,impact)}
    <span class="lab-req">${req}</span></div>
    ${ctl}</div>`;
}

/* Strip build-team scaffolding from rendered HTML: scope-explainer note boxes,
   provenance rows, "?" annotations and stray section citations. */
function scrub(h){
  // whole "note-scope" / "note-open" explainer boxes
  h = h.replace(/<div class="note note-(?:scope|open)">[\s\S]*?<\/div>\s*<\/div>/g,"");
  // provenance <q>…</q>, DB field-name captions and scope-only detail rows
  h = h.replace(/<q>[\s\S]*?<\/q>/g,"");
  h = h.replace(/<p class="lab-tech">[\s\S]*?<\/p>/g,"");
  h = h.replace(/<div class="f"><div class="f-k">(?:Named in|From the scope|Source)<\/div>[\s\S]*?<\/div><\/div>/g,"");
  // section citations and scaffolding phrases
  h = h.replace(/&sect;/g,"§").replace(/§\s?\d+(?:\.\d+)*(?:'s)?/g,"");
  h = h.replace(/\bScope\b\s*(?=[:§]|$)/g,"");
  [ /Needs confirmation from MuSo before build:?/gi,
    /\bthe scope names this master but does not supply its records\.?/gi,
    /MuSo needs to set that\.?/gi,
    /needs MuSo to confirm\.?/gi,
    /\bnot stated\b/gi, /\bto confirm\b/gi, /\bprovisional\b/gi,
    /Placeholder\s*[—-]\s*/gi, /Settled during design\.?/gi
  ].forEach(re=>h=h.replace(re,""));
  // tidy leftovers
  h = h.replace(/\(\s*\)/g,"").replace(/\s+([,.;])/g,"$1").replace(/\s{2,}/g," ");
  return h;
}

/* New/Edit shop product — the user picks the HSN/SAC code; GST is auto-filled from it and the
   Base price is auto-calculated (Selling price − GST). GST and Base price are read-only. */
function shopRecalcForm(){
  const hsnEl=document.getElementById("shopHsn"), sellEl=document.getElementById("shopSelling");
  if(!hsnEl||!sellEl) return;
  const h=hsnByCode(hsnEl.value), gstPct=h?h.gst:0, selling=+sellEl.value||0;
  const gstAmt=(selling&&gstPct)?Math.round(selling*gstPct/(100+gstPct)):0;   // Selling price is GST-inclusive
  const base=(h&&selling)?selling-gstAmt:0;
  const g=document.getElementById("shopGstOut"); if(g) g.textContent=h?`${gstPct}%${selling?` · ${money(gstAmt)}`:""}${hsnCompLabel(hsnEl.value)?` (${hsnCompLabel(hsnEl.value)})`:""}`:"—";
  const b=document.getElementById("shopBaseOut"); if(b) b.textContent=(h&&selling)?money(base):"—";
  const c=document.getElementById("shopCost"); if(c&&!shopCostTouched) c.value=(h&&selling)?base:"";   // Cost follows Base until edited
}

        +fld("Description",`<input class="inp" id="shopDesc" value="${escAttr(it.desc||"")}" placeholder="MuSo branded mug">`,"Optional short description.",false,true))}
      ${sec("Pricing & tax",
        fld("HSN / SAC code",`<div class="selwrap"><select class="inp" id="shopHsn"><option value="">Select…</option>${HSNCODES.map(x=>`<option value="${x.code}"${it.hsn===x.code?" selected":""}>${x.kind} ${x.code} · ${x.desc}</option>`).join("")}</select></div>`,"Pick the code — the GST rate is taken from it.",true,true)
        +fld("Selling price",`<div class="inp-suffix"><input class="inp mono" id="shopSelling" type="number" min="0" value="${escAttr(it.mrp||"")}" placeholder="0"><span>₹</span></div>`,"The GST-inclusive price the customer pays.",true)
        +fld("GST",`<div class="mono readval" id="shopGstOut">${gstPct?`${gstPct}% · ${money(gstAmt)}${hsnCompLabel(it.hsn)?` (${hsnCompLabel(it.hsn)})`:""}`:"—"}</div>`,"Auto-filled from the HSN / SAC code, split into CGST + SGST.",false)
        +fld("Base price",`<div class="mono readval" id="shopBaseOut">${base?money(base):"—"}</div>`,"Auto-calculated: Selling price − GST. Read-only.",false)
        +fld("Cost price",`<div class="inp-suffix"><input class="inp mono" id="shopCost" type="number" min="0" value="${base?base:""}" placeholder="0"><span>₹</span></div>`,"Defaults to the Base price (Selling − GST); edit to record the actual purchase cost.",false))}
      ${sec("Inventory",
        fld("Available units",`<input class="inp mono" id="shopStock2" type="number" min="0" value="${escAttr(it.stock||"")}" placeholder="0">`,"Units on hand — a unique barcode is generated for each unit on create.",false)
        +fld("Unit",`<div class="selwrap"><select class="inp" id="shopUqc">${["NOS","PCS","SET","KGS","MTR","PAC"].map(u=>`<option${(it.uqc||"NOS")===u?" selected":""}>${u}</option>`).join("")}</select></div>`,"Unit quantity code (UQC) for the GST return.",false))}
    </div>
    <div class="form-foot"><span></span><button class="btn" data-tab="list">Cancel</button><button class="btn btn-primary" data-shop-item-save="${editing?selShopItem:-1}">${editing?"Save changes":"Create product"}</button></div>
  </div></div>`;
}
function shopItemDetail(){ const it=SHOP_ITEMS[selShopItem]; if(!it) return "";
  const row=(k,v)=>`<tr><td style="color:var(--ink3);width:42%">${k}</td><td>${v}</td></tr>`;
  // mirror the create form: HSN drives GST, Selling is GST-inclusive, Base = Selling − GST, Cost defaults to Base
  const h=hsnByCode(it.hsn), gstPct=h?h.gst:0, selling=+it.mrp||0;
  const gstAmt=(selling&&gstPct)?Math.round(selling*gstPct/(100+gstPct)):0, base=(h&&selling)?selling-gstAmt:selling;
  const cost=(it.cost!=null&&it.cost!=="")?+it.cost:base, uqc=it.uqc||"NOS";
  const stPill=it.stock<=0?'<span class="pill pill-off">Out of stock</span>':it.stock<=3?'<span class="pill pill-warn">Low stock</span>':'<span class="pill pill-ok"><i class="dot"></i>'+it.stock+' in stock</span>';
  ensureShopBarcodes(it);
  const bars=it.barcodes||[];
  // ---- Details tab (left-column cards only; Actions box is rendered beside every tab) ----
  const detailsBody=`<div class="card"><div class="card-head"><span class="card-title">Basics</span></div><div class="matrix-wrap"><table class="reclist"><tbody>
      ${row("Product ID (PD)",`<span class="code">${it.pd}</span>`)}${row("Category",it.cat||"—")}${row("Name",it.n)}${row("Description",it.desc||"—")}
    </tbody></table></div></div>
    <div class="card"><div class="card-head"><span class="card-title">Pricing &amp; tax</span></div><div class="matrix-wrap"><table class="reclist"><tbody>
      ${row("HSN / SAC code",`<span class="code">${it.hsn||"—"}</span>${h?" · "+h.desc:""}`)}
      ${row("GST",gstPct?`${gstPct}% · ${money(gstAmt)}${hsnCompLabel(it.hsn)?` (${hsnCompLabel(it.hsn)})`:""}`:"—")}
      ${row("Selling price",money(selling))}${row("Base price",money(base))}${row("Cost price",money(cost))}
    </tbody></table></div></div>
    <div class="card"><div class="card-head"><span class="card-title">Inventory</span></div><div class="matrix-wrap"><table class="reclist"><tbody>
      ${row("Available units",`<b>${it.stock}</b>`)}${row("Unit",uqc)}${row("Barcodes generated",`<b>${bars.length}</b>`)}
    </tbody></table></div></div>`;
  // ---- Barcodes tab — one barcode per unit ----
  const barRows=bars.map((b,i)=>`<tr><td class="code">${i+1}</td><td class="code">${b}</td><td style="text-align:right"><button class="btn" data-shop-print>Print</button></td></tr>`).join("");
  const barcodesBody=`<div class="card"><div class="card-head"><span class="card-title">Unit barcodes</span><span class="card-note" style="margin-left:auto">${bars.length} of ${it.stock} unit${it.stock===1?"":"s"}</span>${bars.length?`<button class="btn" data-shop-print style="margin-left:10px">Print all</button>`:""}</div>
    ${bars.length?`<div class="matrix-wrap"><table class="reclist"><thead><tr><th style="width:60px">#</th><th>Barcode</th><th></th></tr></thead><tbody>${barRows}</tbody></table></div>`:`<div class="card-body muted">No units in stock — add stock to generate barcodes.</div>`}</div>`;
  // ---- Actions box — persistent beside every tab ----
  const actionsBox=`<aside class="disc-summary-col"><div class="card"><div class="card-head"><span class="card-title">Actions</span></div><div class="card-body" style="display:flex;flex-direction:column;gap:8px">
    <button class="btn btn-primary" data-shop-addstock="${selShopItem}">Add stock</button>
    <button class="btn" data-tab="edit">Edit product</button>
  </div></div></aside>`;
  // ---- tabbed: Details | Barcodes — tabs + content on the left, Actions box on the right across every tab ----
  const subs=[["details","Details"],["barcodes",`Barcodes · ${bars.length}`]];
  if(!subs.some(([k])=>k===sitab)) sitab="details";
  const tabs=`<div class="subs">${subs.map(([k,l])=>`<button class="sub-tab" data-sitab="${k}" aria-selected="${sitab===k}">${l}</button>`).join("")}</div>`;
  return `<div class="detailhead"><h2 class="detailname">${it.n}</h2><span class="code">${it.pd}</span>${stPill}</div>
  <div class="two">
    <div>${tabs}<div class="sub-body">${sitab==="barcodes"?barcodesBody:detailsBody}</div></div>
    ${actionsBox}
  </div>${shopAddStock!=null?shopAddStockCard():""}`;
}

function shopCouponDetail(){ const c=SHOP_COUPONS[selShopCoupon]; if(!c) return "";
  const row=(k,v)=>`<tr><td style="color:var(--ink3);width:42%">${k}</td><td>${v}</td></tr>`;
  const pill=c.status==="Approved"?'<span class="pill pill-ok"><i class="dot"></i>Approved</span>':'<span class="pill pill-draft"><i class="dot"></i>'+c.status+'</span>';
  return `<div class="detailhead"><h2 class="detailname">${c.code}</h2>${pill}</div>
  <div class="two"><div class="card"><div class="card-head"><span class="card-title">Coupon</span></div><div class="matrix-wrap"><table class="reclist"><tbody>
    ${row("Description",c.desc||"—")}${row("Discount",c.type==="Percentage"?c.v+"%":money(c.v))}${row("Valid",(c.from||"—")+" → "+(c.to||"—"))}
  </tbody></table></div></div>
  <div class="card"><div class="card-head"><span class="card-title">Approval</span><span class="card-note">a code cannot apply until Approved</span></div><div class="matrix-wrap"><table class="reclist"><tbody>
    ${row("Created by",c.preparedBy||"—")}${row("Proposed by",c.proposedBy||"—")}${row("Approved by",c.approvedBy||'<span class="muted">—</span>')}${row("Status",pill)}
  </tbody></table>${c.status==="Draft"?`<div class="card-body"><button class="btn btn-primary" data-shop-coupon-review="${selShopCoupon}" style="width:100%;justify-content:center">Send for Review</button></div>`:c.status==="Pending approval"?`<div class="card-body"><button class="btn btn-primary" data-shop-coupon-approve="${selShopCoupon}" style="width:100%;justify-content:center">Approve coupon</button></div>`:""}</div></div></div>`;
}

function shopSaleForm(){
  const comp=shopSaleCompute({lines:shopCart.filter(r=>r.pd),instantPct:shopInstantApplied?shopInstantPct:0,coupon:shopCouponTried?shopCouponCode:""});
  const miss=f=>shopStep1Tried&&!String(shopCustomer[f]||"").trim();
  const reqMark=f=>miss(f)?'<span class="lab-req" style="color:var(--stop)">Required</span>':'<span class="lab-req">Required</span>';
  const opt=(sel)=>`<option value="">— Select —</option>`+SHOP_ITEMS.map(x=>`<option value="${x.pd}"${x.pd===sel?" selected":""}>${x.pd} · ${x.n}</option>`).join("");
  const rows=shopCart.map((r,i)=>{ const it=shopItemByPd(r.pd)||{}; const gst=it.pd?shopGstPct(it):0; const base=shopBaseOf(it); const total=base*(+r.qty||0);
    return `<tr>
      <td class="code">${i+1}</td>
      <td><div class="selwrap"><select class="inp" data-shop-pick="${i}">${opt(r.pd)}</select></div></td>

      <td class="code">${it.pd?(it.hsn||"—"):"—"}</td>
      <td class="code">${it.pd?it.stock:"—"}</td>
      <td class="code">${it.pd?money(base):"—"}</td>
      <td class="code">${it.pd?gst+"%":"—"}</td>
      <td class="code">${it.pd?money(shopSellingOf(it)):"—"}</td>
      <td><span class="pos-step"><button data-shop-qty="${i}|-1" ${(+r.qty||0)<=1?"disabled":""}>−</button><span>${+r.qty||0}</span><button data-shop-qty="${i}|1">+</button></span></td>
      <td class="code">${it.pd?money(total):"—"}</td>
      <td>${shopCart.length>1?`<button class="cart-line-x" data-shop-removerow="${i}" aria-label="Remove">✕</button>`:""}</td>

  const header=`<section class="form-sec"><div class="form-sec-head"><span class="form-sec-title">Sale</span><span class="card-note" style="margin-left:auto">Txn 4950 · 27 Feb 2026</span></div><div class="form-sec-body">
    <div class="fld${miss("phone")?" fld-miss":""}"><div class="lab"><span class="lab-n">Customer phone</span>${reqMark("phone")}</div><input class="inp mono" id="shopPhone" type="tel" value="${escAttr(shopCustomer.phone)}" placeholder="+91 81234 56789"></div>
    <div class="fld"><div class="lab"><span class="lab-n">Customer name</span><span class="lab-req">Optional</span></div><input class="inp" id="shopName" value="${escAttr(shopCustomer.name)}" placeholder="Name"></div>
    <div class="fld"><div class="lab"><span class="lab-n">Customer email</span><span class="lab-req">Optional</span></div><input class="inp" id="shopEmail" type="email" value="${escAttr(shopCustomer.email)}" placeholder="name@example.com"></div>
    <div class="fld wide"><div class="lab"><span class="lab-n">Customer GSTIN</span><span class="lab-req">Optional</span></div><input class="inp mono" id="shopGstin" value="${escAttr(shopCustomer.gstin)}" placeholder="For a business / e-invoice — leave blank for a B2C sale"></div>
  </div></section>`;
  const itemsSec=`<section class="form-sec"><div class="form-sec-head"><span class="form-sec-title">Item details</span></div><div class="form-sec-body" style="grid-template-columns:1fr">
    <div class="fld wide"><div class="lab"><span class="lab-n">Scan barcode</span><span class="lab-req">Optional</span></div><input class="inp mono" id="shopScan" placeholder="Scan or type a barcode, then Enter (wireframe)" data-shop-scan></div>
    <div class="matrix-wrap"><table class="reclist shop-sale-table"><thead><tr><th>S.No</th><th>Product (PD)</th><th>Name</th><th>HSN/SAC</th><th>Avail</th><th>Base</th><th>GST</th><th>Selling price</th><th>Units</th><th>Total</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <button class="rep-add" data-shop-addrow>+ Add row</button>
  </div></section>`;
  const couponMsg=shopCouponTried?(comp.couponOk?`<div class="booking-discount-msg ok" style="display:flex;align-items:center;gap:8px">✓ ${(shopPreset(comp.coupon.code)||{}).label||comp.coupon.code} applied<button data-shop-coupon-clear aria-label="Remove coupon" style="border:0;background:none;color:var(--stop);font-size:11px;font-weight:600;text-decoration:underline;cursor:pointer;padding:0">Remove</button></div>`:`<div class="booking-discount-msg bad">${shopCoupon(shopCouponCode)?"Coupon not approved yet.":"Code not recognised."}</div>`):"";
  // ---- helper preset pills (fill the coupon field; Apply then applies) ----

  // ---- instant discount — manager-authorised via OTP (demo code shown; wireframe) ----

  let instantBlock;
  if(shopInstantApplied){
    instantBlock=`<div class="booking-discount-msg ok">✓ ${+shopInstantPct}% instant discount applied — authorised by ${escAttr(shopInstantMgr)}${shopInstantDesc?` · ${escAttr(shopInstantDesc)}`:""}</div>
      <button class="btn" data-shop-instant-clear style="margin-top:6px">Remove instant discount</button>`;
  } else {
    instantBlock=`<input class="inp" id="shopInstantDesc" value="${escAttr(shopInstantDesc)}" placeholder="Discount description (reason, e.g. damaged item)" style="margin-bottom:8px">
      <div class="shop-instant-row">
        <div class="inp-suffix" style="width:96px;flex:none"><input class="inp mono" id="shopInstantPct" type="number" min="0" max="100" value="${shopInstantPct||""}" placeholder="0"><span>%</span></div>
        <div class="selwrap" style="flex:1;min-width:0"><select class="inp" id="shopInstantMgr"><option value="">Authorising manager…</option>${SHOP_MANAGERS.map(m=>`<option${shopInstantMgr===m.name?" selected":""}>${m.name}</option>`).join("")}</select></div>

           <div class="booking-discount" style="margin:6px 0 0"><input class="inp mono" id="shopInstantOtp" maxlength="6" style="letter-spacing:.3em" placeholder="6-digit code" value="${escAttr(shopInstantOtp)}"><button class="btn" data-shop-instant-verify>Verify &amp; apply</button></div>
           ${shopInstantErr?`<div class="booking-discount-msg bad">OTP does not match — check the code and try again.</div>`:""}`
        : `<button class="btn" data-shop-instant-send ${canSend?"":"disabled"} style="margin-top:6px">Send OTP to manager</button>`}`;
  }
  const payBtns=["Cash","POS-UPI","POS-Card","None"].map(m=>`<button class="summary-pay-btn" data-shop-pay="${escAttr(m)}" aria-pressed="${shopPay===m}">${m}</button>`).join("");
  // Totals & payment — a sticky box on the right, mirroring the Orders page summary aside
  const totalsBox=`<div class="card-head"><span class="card-title">Totals &amp; payment</span><span class="card-note" style="margin-left:auto">${nItems} item${nItems===1?"":"s"}</span></div><div class="card-body shop-totals-body">
    <div class="fld"><div class="lab"><span class="lab-n">Coupon code</span><span class="lab-req">Optional</span></div><div class="booking-discount" style="margin:0"><input class="inp mono" id="shopCouponCode" value="${escAttr(shopCouponCode)}" placeholder="Enter a coupon or pick a preset"><button class="btn" data-shop-coupon-apply>Apply</button></div>${presetPills}${couponMsg}</div>
    <div class="fld"><div class="lab"><span class="lab-n">Instant discount</span><span class="lab-req">Optional</span></div>${instantBlock}</div>
    <div class="shop-total-rows">
      <div class="booking-summary-row"><span>Total</span><span>${money(comp.total)}</span></div>
      ${comp.discAmt?`<div class="booking-summary-row" style="color:var(--ok)"><span>Discount${comp.discPct?` <span class="q">${comp.discPct}%</span>`:""}</span><span>− ${money(Math.round(comp.discAmt))}</span></div>`:""}
      <div class="booking-summary-row"><span>Sub total</span><span>${money(Math.round(comp.subtotal))}</span></div>
      ${comp.gst?`<div class="booking-summary-row"><span>CGST${comp.uniformHalf!=null?` <span class="q">${comp.uniformHalf}%</span>`:""}</span><span>${money(Math.round(comp.cgst))}</span></div>
      <div class="booking-summary-row"><span>SGST${comp.uniformHalf!=null?` <span class="q">${comp.uniformHalf}%</span>`:""}</span><span>${money(Math.round(comp.sgst))}</span></div>`:""}
      <div class="booking-summary-total"><span>Grand total</span><span>${money(comp.grand)}</span></div>
    </div>
    <div class="shop-words">${amountInWords(comp.grand)}</div>
    <div class="fld"><div class="lab"><span class="lab-n">Payment mode</span></div><div class="summary-pay-grid pos-pay">${payBtns}</div></div>
    <div class="shop-cta">
      <button class="btn btn-primary" data-shop-save>Save sale · ${money(comp.grand)}</button>

      <div class="muted" style="font-size:11px">Print / SMS / WhatsApp are wireframe stubs</div>

  return `<div class="disc-layout">
    <div class="shop-sale-main">${header}${itemsSec}</div>
    <aside class="disc-summary-col"><div class="card">${totalsBox}</div></aside>
  </div>`;
}

function shopSaleDetail(){ const s=SHOP_SALES[selShopSale]; if(!s) return ""; const c=shopSaleCompute(s);
  const eInv=!!(s.gstin&&s.gstin.trim());
  const partRows=c.lines.map((l,idx)=>{ const it=l.it; return `<tr><td>${idx+1}</td><td>${it.n}</td><td class="code">${it.hsn||"—"}</td><td class="code">${l.qty}</td><td class="code">${money(shopSellingOf(it))}</td><td>Nos</td><td class="code">${money(Math.round(l.selling))}</td></tr>`; }).join("");
  const discRow=c.discAmt?`<tr class="inv-tax"><td colspan="6" style="text-align:right">Less: Discount${c.discPct?` @ ${c.discPct}%`:""}</td><td class="code">− ${money(Math.round(c.discAmt))}</td></tr>`:"";
  const rateMap={}; c.lines.forEach(l=>{ const r=rateMap[l.halfPct]||(rateMap[l.halfPct]={taxable:0,half:l.halfPct}); r.taxable+=l.taxable; });
  const taxRows=Object.values(rateMap).filter(r=>r.half>0).map(r=>`<tr class="inv-tax"><td colspan="6" style="text-align:right">CGST ${r.half}% Output</td><td class="code">${money(Math.round(r.taxable*r.half/100))}</td></tr><tr class="inv-tax"><td colspan="6" style="text-align:right">SGST ${r.half}% Output</td><td class="code">${money(Math.round(r.taxable*r.half/100))}</td></tr>`).join("");
  const hsnMap={}; c.lines.forEach(l=>{ const it=l.it; if(!it.hsn) return; const cg=l.taxable*l.halfPct/100; const m=hsnMap[it.hsn]||(hsnMap[it.hsn]={hsn:it.hsn,taxable:0,cgst:0,sgst:0,half:l.halfPct}); m.taxable+=l.taxable; m.cgst+=cg; m.sgst+=cg; });
  const hsnRows=Object.values(hsnMap).map(m=>`<tr><td class="code">${m.hsn}</td><td class="code">${money(Math.round(m.taxable))}</td><td class="code">${m.half}%</td><td class="code">${money(Math.round(m.cgst))}</td><td class="code">${m.half}%</td><td class="code">${money(Math.round(m.sgst))}</td><td class="code">${money(Math.round(m.cgst+m.sgst))}</td></tr>`).join("");
  // ---- sale details not printed on the invoice (email, coupon, instant-discount reason/authoriser, etc.) ----
  const drow=(k,v)=>`<tr><td style="color:var(--ink3);width:40%">${k}</td><td>${(v!==undefined&&v!==null&&String(v).trim()!=="")?v:'<span class="muted">—</span>'}</td></tr>`;
  const couponLbl=s.coupon?((shopPreset(s.coupon)||{}).label||s.coupon):"";
  const cp=s.coupon?shopCoupon(s.coupon):null;   // Discount type & percentage describe the coupon (blank when there is no coupon)
  const detailsBody=`<div class="two">
      <div class="card"><div class="card-head"><span class="card-title">Customer &amp; transaction</span></div><div class="matrix-wrap"><table class="reclist"><tbody>
        ${drow("Transaction",`<span class="code">${s.txn}</span>`)}
        ${drow("Date",s.date)}
        ${drow("Payment mode",s.pay)}
        ${drow("Customer name",s.name)}
        ${drow("Customer phone",s.phone?`<span class="code">${s.phone}</span>`:"")}
        ${drow("Customer email",s.email)}
        ${drow("Customer GSTIN",s.gstin?`<span class="code">${s.gstin}</span>`:"")}
      </tbody></table></div></div>
      <aside class="card"><div class="card-head"><span class="card-title">Discount</span></div><div class="matrix-wrap"><table class="reclist"><tbody>
        ${drow("Discount type",cp?cp.type:"")}
        ${(cp&&cp.type==="Percentage")?drow("Discount percentage",`${cp.v}%`):""}
        ${drow("Coupon code",couponLbl?`<span class="code">${couponLbl}</span>`:"")}
        ${drow("Instant discount",s.instantPct?`${s.instantPct}%`:"")}
        ${drow("Discount description",s.instantDesc)}
        ${drow("Authorised by",s.instantMgr)}
        ${drow("Total discount",c.discAmt?money(Math.round(c.discAmt)):"")}
      </tbody></table></div></aside>
    </div>`;
  // ---- Tax invoice tab ----
  const invoiceBody=`<div class="invoice-actions"><button class="btn btn-primary" data-shop-print>Print</button><span class="muted" style="font-size:11.5px">Wireframe — no PDF / e-invoice API</span></div>
  <div class="invoice">
    <div class="inv-top"><div class="inv-kind">${eInv?"Tax Invoice &nbsp;·&nbsp; e-Invoice":"Tax Invoice"}</div>${eInv?`<div class="inv-qr">QR</div>`:""}</div>
    ${eInv?`<div class="inv-irn"><span>IRN: <span class="code">a1b2c3…(generated)</span></span> &nbsp; <span>Ack No.: <span class="code">112010001234</span></span> &nbsp; <span>Ack Date: ${s.date}</span></div>`:""}
    <div class="inv-parties">

  return head+tabs+`<div class="sub-body">${ssub==="invoice"?invoiceBody:detailsBody}</div>`;
