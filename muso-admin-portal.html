/* ---- Module Reports (Scope §8) ---- */
function schoolReports(){
  const S=(p)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  const kpi=(ico,color,label,value,sub)=>`<div class="setcard"><div class="kpi-top"><span class="kpi-ico kpi-${color}">${ico}</span><div class="set-k">${label}</div></div><div class="set-v pos">${value}</div><div class="kpi-sub">${sub}</div></div>`;
  const worked=SCHOOL_BOOKINGS.filter(r=>["Confirmed","Live","Ended"].includes(r.status));
  const agg=SCHOOL_BOOKINGS.reduce((a,r)=>{const c=schoolCompute(r);a.students+=c.students;a.adults+=c.adults;a.comp+=c.escorts+c.teachersComp;a.foodS+=c.foodStudents;a.foodA+=c.foodAdults;a.foodC+=c.foodComp;return a;},{students:0,adults:0,comp:0,foodS:0,foodA:0,foodC:0});
  const visitCount=SCHOOL_BOOKINGS.filter(r=>(r.visits||[]).length>0).length;
  const rev=worked.reduce((a,r)=>a+schoolCompute(r).grand,0);
  const ranges=["Daily","Weekly","Monthly","Quarterly","Yearly"];
  const rangeBar=`<div class="toolbar">${ranges.map(x=>`<button class="btn${x===schoolRange?" btn-primary":""}" data-school-range="${x}">${x}</button>`).join("")}<span class="tool-note">display range — wireframe</span></div>`;
  const tiles=`<div class="set">
    ${kpi(S('<path d="M3 21h18M5 21V7l7-4 7 4v14"/>'),"blue","School visits",visitCount,"with a scheduled visit")}
    ${kpi(S('<circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/>'),"teal","Students",agg.students,"across all visits")}
    ${kpi(S('<circle cx="12" cy="7" r="4"/><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/>'),"amber","Adults / teachers",agg.adults,"paid heads")}
    ${kpi(S('<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>'),"blue","Complementary",agg.comp,"escorts + teachers (₹0)")}
    ${kpi(S('<path d="M3 2v7a4 4 0 0 0 8 0V2M7 2v20M14 2c0 4 2 6 4 6M18 2v20"/>'),"teal","Food — students",agg.foodS,"meals booked")}
    ${kpi(S('<circle cx="9" cy="9" r="6"/><path d="M18.1 10.7A6 6 0 1 1 10.7 18.1"/>'),"amber","Revenue",money(Math.round(rev)),"incl. GST, confirmed+")}
  </div>`;
  const boardMap={}; SCHOOL_BOOKINGS.forEach(r=>{const c=schoolCompute(r);(r.boards||[]).forEach(b=>{const m=boardMap[b]||(boardMap[b]={board:b,recs:0,students:0,rev:0});m.recs++;m.students+=c.students;if(["Confirmed","Live","Ended"].includes(r.status))m.rev+=c.grand;});});
  const boardRows=Object.values(boardMap).map(m=>`<tr><td>${m.board}</td><td class="code">${m.recs}</td><td class="code">${m.students}</td><td class="code">${money(Math.round(m.rev))}</td></tr>`).join("")||`<tr><td colspan="4" class="muted" style="text-align:center;padding:14px">No board data yet.</td></tr>`;
  const boardTable=`<div class="card"><div class="card-head"><span class="card-title">By education board</span><button class="btn" style="margin-left:auto" data-export="school-boards">Export CSV</button></div><div class="matrix-wrap"><table class="reclist"><thead><tr><th>Board</th><th>Records</th><th>Students</th><th>Revenue</th></tr></thead><tbody>${boardRows}</tbody></table></div></div>`;
  const schoolMap={}; SCHOOL_BOOKINGS.forEach(r=>{const m=schoolMap[r.school]||(schoolMap[r.school]={school:r.school,visits:0,students:0});m.visits++;m.students+=schoolCompute(r).students;});
  const repeats=Object.values(schoolMap).filter(m=>m.visits>1);
  const repeatRows=repeats.map(m=>`<tr><td><b style="font-weight:500">${escHtml(m.school)}</b></td><td class="code">${m.visits}</td><td class="code">${m.students}</td></tr>`).join("")||`<tr><td colspan="3" class="muted" style="text-align:center;padding:14px">No repeat visitors yet.</td></tr>`;
  const repeatTable=`<div class="card"><div class="card-head"><span class="card-title">Repeat visitors</span><span class="card-note">schools with more than one record</span><button class="btn" style="margin-left:auto" data-export="school-repeat">Export CSV</button></div><div class="matrix-wrap"><table class="reclist"><thead><tr><th>School</th><th>Records</th><th>Students total</th></tr></thead><tbody>${repeatRows}</tbody></table></div></div>`;
  return rangeBar+tiles+boardTable+repeatTable;
}

/* Venue availability time-table flyout — a venue is shared across Events and Experiences,
   School and Birthdays, so this shows the selected date's bookings (grey) to avoid double-booking. */
function venueAvailCard(){
  if(!venueAvail) return "";
  const {venue,date,start,end,src,vi,oi}=venueAvail;
  const close='data-venueavail-close="1"';
  const venueSel=`<div class="selwrap"><select class="inp" data-venueavail-venue><option value=""${!venue?" selected":""}>Select venue…</option>${VENUES.filter(v=>v.is_active!==false).map(v=>`<option${venue===v.name?" selected":""}>${escHtml(v.name)}</option>`).join("")}${venue&&!VENUES.some(v=>v.name===venue)?`<option selected>${escHtml(venue)}</option>`:""}</select></div>`;
  const filters=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-bottom:14px">
      <div class="fld" style="margin:0"><div class="lab"><span class="lab-n">Venue</span></div>${venueSel}</div>
      <div class="fld" style="margin:0"><div class="lab"><span class="lab-n">Date</span></div>
        <div style="display:flex;gap:8px"><input class="inp" data-venueavail-date value="${escAttr(date)}" placeholder="DD Mon YYYY" style="flex:1">
          <button type="button" class="btn btn-primary" data-venueavail-apply="1">Apply</button></div></div>
    </div>`;
  let body;
  if(!venue || !date){
    body=`<div class="muted" style="padding:8px 4px">Pick a venue and a date above to see the day's bookings.</div>`;
  } else {
    const books=venueDayBookings(venue,date,src,{vi,oi});
    const fmt=m=>`${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
    const rows=[];
    for(let s=9*60;s<19*60;s+=30){   // 30-min rows across operating hours 09:00–19:00
      const e=s+30;
      const hit=books.filter(b=>{const bs=timeToMin(b.start),be=timeToMin(b.end);return bs!=null&&be!=null&&bs<e&&be>s;});
      const modPill=m=>`<span class="pill ${m==="This booking"?"pill-ok":"pill-off"}" style="font-size:10px">${escHtml(m)}</span>`;
      const cell = hit.length
        ? hit.map(b=>{const bs=timeToMin(b.start); const isStart=bs!=null&&bs>=s&&bs<e;
            return isStart
              ? `${modPill(b.module)} <b style="font-weight:500">${escHtml(b.by)}</b> <span class="muted">— ${escHtml(b.purpose)} · ${escHtml(b.start)}–${escHtml(b.end)}</span>`
              : "";}).join("")
        : '<span class="muted">Available</span>';
      const bg = hit.length?"background:var(--rule)":"";
      rows.push(`<tr><td class="code" style="white-space:nowrap;color:var(--ink3)">${fmt(s)}</td><td style="${bg}">${cell}</td></tr>`);
    }
    body=`<div class="matrix-wrap"><table class="reclist"><thead><tr><th style="width:64px">Time</th><th>Booking</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
  }
  return `<div class="drawer-layer" id="venueAvailCard">
    <button class="drawer-backdrop" ${close} aria-label="Close"></button>
    <aside class="drawer-panel" role="dialog" aria-modal="true" aria-label="Venue availability">
      <div class="card-head"><span class="card-title">Availability</span>
        <button class="drawer-close" ${close} aria-label="Close">&times;</button></div>
      <div class="form-body" style="display:block">${filters}${body}</div>
    </aside></div>`;
}

/* Read the open form's fields back into the draft (so add/remove/preset keep typed values). */
function schoolCaptureForm(){
  const d=schoolDraft; if(!d) return;
  const g=k=>{const el=document.querySelector(`[data-sf="${k}"]`);return el?el.value:undefined;};
  ["school","location","boardsOther","grade","poc","designation","email","phone","interestedOther","prefDate","note","entryStudent","entryAdult","billName","billAddress","gstin","pan","status","comments","assignee","expChildren","expTeachers"].forEach(k=>{const v=g(k);if(v!==undefined)d[k]=v;});
  const chipVals=key=>[...document.querySelectorAll(`[data-sfchips="${key}"] .chip-opt[data-on="1"]`)].map(c=>c.dataset.chipval);
  if(document.querySelector('[data-sfchips="boards"]')) d.boards=chipVals("boards");
  if(document.querySelector('[data-sfchips="interested"]')) d.interested=chipVals("interested");
  // Each visit carries its own schedule, headcounts, Food & F&B and Optionals.
  document.querySelectorAll("[data-vrow]").forEach(rowEl=>{const i=+rowEl.dataset.vrow,v=(d.visits||[])[i];if(!v)return;
    const vg=n=>{const el=rowEl.querySelector(`[data-vf="${n}"]`);return el?el.value:undefined;};
    ["date","slotId"].forEach(n=>{const x=vg(n);if(x!==undefined)v[n]=x;});
    ["students","adults","escorts","teachersComp"].forEach(n=>{const x=vg(n);if(x!==undefined)v[n]=+x||0;});
    // per-visit Food & F&B
    const f=v.food||(v.food={});
    const fs=vg("foodStudents"),fa=vg("foodAdults"),fc=vg("foodComp");
    if(fs!==undefined)f.students=+fs||0; if(fa!==undefined)f.adults=+fa||0; if(fc!==undefined)f.comp=+fc||0;
    const fsel=rowEl.querySelector(`[data-vfsel="foodopt|${i}"]`);
    if(fsel) f.optionIds=fsel.value?[fsel.value]:[];
    // per-visit Optionals
    v.optionals=v.optionals||[];
    rowEl.querySelectorAll("[data-vorow]").forEach(orowEl=>{const oi=+orowEl.dataset.vorow.split("|")[1],o=v.optionals[oi];if(!o)return;
      const og=n=>{const el=orowEl.querySelector(`[data-vof="${n}"]`);return el?el.value:undefined;};
      ["kind","venue","date","start","end"].forEach(n=>{const x=og(n);if(x!==undefined)o[n]=x;});
      o.time=(o.start||o.end)?[o.start,o.end].filter(Boolean).join("–"):"";});
  });
}

  const existing=schoolById(d.id);
  if(existing){ const m=d._mode; delete d._mode; const prevStatus=existing.status; Object.assign(existing,d); existing._mode&&delete existing._mode;
    const statusChanged=existing.status!==prevStatus;
    if(notify) schoolLogEmail(existing,"Admin", statusChanged?("Booking edited — status "+prevStatus+" → "+existing.status+". Email sent to the POC."):"Booking details edited. Email sent to the POC with the updated proforma.", statusChanged?"status":"edit");

/* ---- Proforma invoice (reuses the shop invoice markup; never an e-invoice) ---- */
function schoolProformaLines(rec){
  const lines=[];
  const es=+rec.entryStudent||0, ea=+rec.entryAdult||0;
  const c=schoolCompute(rec);
  if(c.students) lines.push({name:"Museum visit — student",hsn:"999692",qty:c.students,rate:es,amount:c.students*es});
  if(c.adults)   lines.push({name:"Museum visit — adult / teacher",hsn:"999692",qty:c.adults,rate:ea,amount:c.adults*ea});
  if(c.escorts)  lines.push({name:"Complementary escort",hsn:"999692",qty:c.escorts,rate:0,amount:0});
  if(c.teachersComp) lines.push({name:"Complementary teacher",hsn:"999692",qty:c.teachersComp,rate:0,amount:0});
  // Food & F&B — aggregate each option across all visits.
  const foodAgg={};
  (rec.visits||[]).forEach(v=>{const f=v.food||{};(f.optionIds||[]).forEach(nm=>{const o=fbByName(nm);if(!o)return;const q=(+f.students||0)+(+f.adults||0);const amt=(+f.students||0)*o.child+(+f.adults||0)*o.adult;if(q){const m=foodAgg[nm]||(foodAgg[nm]={q:0,amt:0});m.q+=q;m.amt+=amt;}});});
  Object.keys(foodAgg).forEach(nm=>{const m=foodAgg[nm];lines.push({name:"F&B — "+nm,hsn:"996331",qty:m.q,rate:m.q?Math.round(m.amt/m.q):0,amount:m.amt});});
  return lines;
}

  return `<div class="detailhead"><h2 class="detailname">${escHtml(rec.school||"School booking")}</h2><span class="code">${rec.id}</span>${schoolStatusPill(rec)}</div>
  <div class="two"><div>${tabs}<div class="sub-body">${bodyByTab}</div></div>${aside}</div>${confirm}${emailModal}${einvConfirm}${einvModal}`;

/* Live search on the records table (called from the render tail). */
function syncSchoolSearch(){
  const tbl=document.getElementById("schoolTable"); if(!tbl) return;
  const needle=(schoolQ||"").trim().toLowerCase(); let shown=0;
  tbl.querySelectorAll("[data-school-row]").forEach(tr=>{const hit=!needle||(tr.dataset.search||"").includes(needle);tr.style.display=hit?"":"none";if(hit)shown++;});
  const empty=tbl.querySelector("[data-school-empty]"); if(empty) empty.style.display=shown?"none":"";
  const nr=tbl.querySelector("[data-school-newrow]"); if(nr) nr.style.display=needle?"none":"";
  const cnt=document.getElementById("schoolCount"); if(cnt) cnt.textContent=needle?`${shown} of ${SCHOOL_BOOKINGS.length} records`:`${SCHOOL_BOOKINGS.length} records`;
}

/* ============================================================================
   SPONSORED SCHOOL — reports, form, detail, sponsor invoice. Reuses School math
   (schoolCompute / schoolProformaLines), status pills, blankVisit, PDF + invoice
   stack. Distinct data-spf* attributes keep it separate from the School handlers.
   ========================================================================== */

function sponsoredReports(){
  const S=(p)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  const kpi=(ico,color,label,value,sub)=>`<div class="setcard"><div class="kpi-top"><span class="kpi-ico kpi-${color}">${ico}</span><div class="set-k">${label}</div></div><div class="set-v pos">${value}</div><div class="kpi-sub">${sub}</div></div>`;
  const worked=SPONSORED_BOOKINGS.filter(r=>["Confirmed","Live","Ended"].includes(r.status));
  const agg=SPONSORED_BOOKINGS.reduce((a,r)=>{const c=schoolCompute(r);a.students+=c.students;a.adults+=c.adults;a.comp+=c.escorts+c.teachersComp;a.foodS+=c.foodStudents;a.foodA+=c.foodAdults;return a;},{students:0,adults:0,comp:0,foodS:0,foodA:0});
  const visitCount=SPONSORED_BOOKINGS.filter(r=>(r.visits||[]).length>0).length;
  const billed=worked.reduce((a,r)=>a+schoolCompute(r).grand,0);
  const ranges=["Daily","Weekly","Monthly","Quarterly","Yearly"];
  const rangeBar=`<div class="toolbar">${ranges.map(x=>`<button class="btn${x===spRange?" btn-primary":""}" data-sp-range="${x}">${x}</button>`).join("")}<span class="tool-note">display range — wireframe</span></div>`;
  const tiles=`<div class="set">
    ${kpi(S('<path d="M3 21h18M5 21V7l7-4 7 4v14"/>'),"blue","Sponsored visits",visitCount,"with a scheduled visit")}
    ${kpi(S('<circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/>'),"teal","Students",agg.students,"across all visits")}
    ${kpi(S('<circle cx="12" cy="7" r="4"/><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/>'),"amber","Adults / teachers",agg.adults,"paid heads")}
    ${kpi(S('<path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>'),"blue","Billed to sponsors",money(Math.round(billed)),"incl. GST, confirmed+")}
  </div>`;
  const spMap={}; SPONSORED_BOOKINGS.forEach(r=>{const c=schoolCompute(r);const k=r.sponsor||"(unassigned)";const m=spMap[k]||(spMap[k]={sponsor:k,recs:0,students:0,billed:0});m.recs++;m.students+=c.students;if(["Confirmed","Live","Ended"].includes(r.status))m.billed+=c.grand;});
  const spRows=Object.values(spMap).map(m=>`<tr><td>${escHtml(m.sponsor)}</td><td class="code">${m.recs}</td><td class="code">${m.students}</td><td class="code">${money(Math.round(m.billed))}</td></tr>`).join("")||`<tr><td colspan="4" class="muted" style="text-align:center;padding:14px">No sponsor data yet.</td></tr>`;
  const spTable=`<div class="card"><div class="card-head"><span class="card-title">By sponsor</span><button class="btn" style="margin-left:auto" data-export="sponsored-sponsor">Export CSV</button></div><div class="matrix-wrap"><table class="reclist"><thead><tr><th>Sponsor</th><th>Records</th><th>Students</th><th>Billed</th></tr></thead><tbody>${spRows}</tbody></table></div></div>`;
  const distMap={}; SPONSORED_BOOKINGS.forEach(r=>{const c=schoolCompute(r);const k=r.district||"(none)";const m=distMap[k]||(distMap[k]={district:k,recs:0,students:0});m.recs++;m.students+=c.students;});
  const distRows=Object.values(distMap).map(m=>`<tr><td>${escHtml(m.district)}</td><td class="code">${m.recs}</td><td class="code">${m.students}</td></tr>`).join("")||`<tr><td colspan="3" class="muted" style="text-align:center;padding:14px">No district data yet.</td></tr>`;
  const distTable=`<div class="card"><div class="card-head"><span class="card-title">By district (reach)</span><button class="btn" style="margin-left:auto" data-export="sponsored-boards">Export CSV</button></div><div class="matrix-wrap"><table class="reclist"><thead><tr><th>District</th><th>Records</th><th>Students</th></tr></thead><tbody>${distRows}</tbody></table></div></div>`;
  return rangeBar+tiles+spTable+distTable;
}

function spCaptureForm(){
  const d=spDraft; if(!d) return;
  const g=k=>{const el=document.querySelector(`[data-spf="${k}"]`);return el?el.value:undefined;};
  ["school","location","orgType","district","boardsOther","grade","prefDate","poc","designation","email","phone","interestedOther","note","sponsor","authNumber","ngoGstin","ngoPan","proofDoc","entryStudent","entryAdult","billName","billAddress","gstin","pan","speciallyAbled","status","comments","assignee","expChildren","expTeachers"].forEach(k=>{const v=g(k);if(v!==undefined)d[k]=v;});
  const upEl=document.querySelector("[data-sp-uprows]");
  if(upEl) d.underprivileged=[...upEl.querySelectorAll("[data-sp-uprow]")].map(r=>({title:(r.querySelector('[data-spf-up="title"]')||{}).value||"",count:(r.querySelector('[data-spf-up="count"]')||{}).value||""})).filter(x=>x.title||x.count);
  const tn=g("transport_need"), tv=g("transport_vendor"); d.transport=d.transport||{}; if(tn!==undefined)d.transport.need=tn; if(tv!==undefined)d.transport.vendor=tv;
  const chipVals=key=>[...document.querySelectorAll(`[data-spfchips="${key}"] .chip-opt[data-on="1"]`)].map(c=>c.dataset.chipval);
  if(document.querySelector('[data-spfchips="boards"]')) d.boards=chipVals("boards");
  if(document.querySelector('[data-spfchips="interested"]')) d.interested=chipVals("interested");
  document.querySelectorAll("[data-spvrow]").forEach(rowEl=>{const i=+rowEl.dataset.spvrow,v=(d.visits||[])[i];if(!v)return;
    const vg=n=>{const el=rowEl.querySelector(`[data-spvf="${n}"]`);return el?el.value:undefined;};
    ["date","slotId"].forEach(n=>{const x=vg(n);if(x!==undefined)v[n]=x;});
    ["students","adults","escorts"].forEach(n=>{const x=vg(n);if(x!==undefined)v[n]=+x||0;});
    const f=v.food||(v.food={}); const fs=vg("foodStudents"),fa=vg("foodAdults"),fc=vg("foodComp");
    if(fs!==undefined)f.students=+fs||0; if(fa!==undefined)f.adults=+fa||0; if(fc!==undefined)f.comp=+fc||0;
    const fsel=rowEl.querySelector(`[data-spvfsel="foodopt|${i}"]`);
    if(fsel) f.optionIds=fsel.value?[fsel.value]:[];
    v.optionals=v.optionals||[];
    rowEl.querySelectorAll("[data-spvorow]").forEach(orowEl=>{const oi=+orowEl.dataset.spvorow.split("|")[1],o=v.optionals[oi];if(!o)return;
      const og=n=>{const el=orowEl.querySelector(`[data-spvof="${n}"]`);return el?el.value:undefined;};
      ["kind","venue","date","start","end"].forEach(n=>{const x=og(n);if(x!==undefined)o[n]=x;});
      o.time=(o.start||o.end)?[o.start,o.end].filter(Boolean).join("–"):"";});
  });
}
function spCommit(notify){
  spCaptureForm(); const d=spDraft; if(!d) return;
  if(!d.school||!d.school.trim()){ const e=document.getElementById("spErr"); if(e)e.textContent="School / NGO name is required."; return; }
  const existing=spById(d.id);
  if(existing){ const prev=existing.status; delete d._mode; Object.assign(existing,d); existing._mode&&delete existing._mode;
    const statusChanged=existing.status!==prev;
    if(notify) spLogEmail(existing,"CSR", statusChanged?("Booking edited — status "+prev+" → "+existing.status+". Email sent to the POC."):"Booking details edited. Email sent to the POC.", statusChanged?"status":"edit");
    else spLog(existing,"CSR", statusChanged?("Booking edited — status "+prev+" → "+existing.status+". No email sent."):"Booking details edited. No email sent.");
    selSp=existing.id; }
  else { delete d._mode; if(!d.timeline) d.timeline=[];
    if(d.origin==="backend"){ SPONSORED_BOOKINGS.unshift(d); if(notify) spLogEmail(d,"CSR","Backend booking created; confirmation emailed to the NGO and Function Process circulated to staff.","confirm"); else spLog(d,"CSR","Backend booking created. No email sent."); }
    else { SPONSORED_BOOKINGS.unshift(d); if(notify) spLogEmail(d,"Website","Enquiry received — acknowledgement email sent to the POC.","ack"); else spLog(d,"Website","Enquiry logged. No email sent."); }
    selSp=d.id; }
  spDraft=null; tab="detail"; spsub="overview"; render(); $(".stage").scrollTop=0;
}

  const hsnMap={}; lines.forEach(l=>{const half=9;const cg=Math.round(l.amount*half/100);const m=hsnMap[l.hsn]||(hsnMap[l.hsn]={hsn:l.hsn,taxable:0,cgst:0,sgst:0,half});m.taxable+=l.amount;m.cgst+=cg;m.sgst+=cg;});

  const note = raised
    ? `<span class="muted" style="font-size:11.5px">Raised on ${escHtml(rec.invoice.on||rec.created)} · e-invoice against the sponsor</span>`

  return `<div class="invoice-actions">

    <div class="invoice">
      <div class="inv-top"><div class="inv-kind">Tax Invoice &nbsp;·&nbsp; e-Invoice</div><div class="inv-qr">QR</div></div>
      ${raised?`<div class="inv-irn"><span>IRN: <span class="code">a1b2c3…(generated)</span></span> &nbsp; <span>Ack No.: <span class="code">112610009988</span></span> &nbsp; <span>Ack Date: ${escHtml(rec.invoice.on||rec.created)}</span></div>`:""}
      <div class="inv-parties">
        <div class="inv-party"><b>${MUSO_SELLER.name}</b><div>${MUSO_SELLER.addr.join("<br>")}</div><div>GSTIN/UIN: <span class="code">${MUSO_SELLER.gstin}</span></div><div>State: ${MUSO_SELLER.state}, Code: ${MUSO_SELLER.stateCode}</div></div>
        <div class="inv-party inv-meta"><div><span class="muted">Invoice No.</span><br><b>INV-${rec.id}</b></div><div><span class="muted">Dated</span><br><b>${escHtml((rec.invoice&&rec.invoice.on)||rec.created)}</b></div><div><span class="muted">Booking</span><br><b>${rec.id}</b></div></div>
      </div>
      <div class="inv-buyer"><b>Billed to (Sponsor)</b><div>${escHtml(rec.sponsor||"—")}</div>${sp.addr?`<div>${escHtml(sp.addr)}</div>`:""}${sp.gstin?`<div>GSTIN/UIN: <span class="code">${escHtml(sp.gstin)}</span></div><div>Place of Supply: ${escHtml(sp.state||MUSO_SELLER.state)}</div>`:'<div class="muted">No sponsor selected yet.</div>'}<div class="muted" style="margin-top:4px">Beneficiary: ${escHtml(rec.school||"—")}${rec.district?" · "+escHtml(rec.district):""}</div></div>
      <div class="matrix-wrap"><table class="reclist inv-table"><thead><tr><th>Sl</th><th>Particulars</th><th>HSN/SAC</th><th>Qty</th><th>Rate</th><th>per</th><th>Amount</th></tr></thead><tbody>${partRows||`<tr><td colspan="7" class="muted" style="text-align:center;padding:14px">No priced lines yet — add visit headcounts and entry prices.</td></tr>`}${lines.length?taxRows:""}

/* ---- PDF -------------------------------------------------------------------
   Helvetica and Helvetica-Bold are base-14, so nothing has to be embedded — but
   that means widths have to come from the AFM tables to wrap text. Codes 32..126. */
const PDF_W = {
  reg:[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,
       556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,
       667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,
       278,278,278,469,556,333,
       556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,
       334,260,334,584],
  bold:[278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,
        556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,
        722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,
        333,278,333,584,556,333,
        556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,
        389,280,389,584]
};
/* WinAnsi is a byte encoding — fold the typographic characters the copy uses down
   to their ASCII equivalents rather than emitting bytes the viewer would mangle. */
const pdfAscii = s => String(s)
  .replace(/[‘’]/g,"'").replace(/[“”]/g,'"')
  .replace(/[–—]/g,"-").replace(/[·•]/g,"-")
  .replace(/₹/g,"Rs.").replace(/…/g,"...")
  .replace(/[^\x20-\x7E]/g,"");
const pdfEsc = s => pdfAscii(s).replace(/[\\()]/g,"\\$&");
function pdfWidth(t,size,bold){
  const tab=PDF_W[bold?"bold":"reg"]; let w=0;
  for(let i=0;i<t.length;i++){ const c=t.charCodeAt(i); w += (c>=32&&c<=126)?tab[c-32]:556; }
  return w*size/1000;
}
function pdfWrap(t,size,bold,maxw){
  const words=pdfAscii(t).split(/\s+/).filter(Boolean), lines=[]; let cur="";
  words.forEach(w=>{
    const test=cur?cur+" "+w:w;
    if(pdfWidth(test,size,bold)<=maxw) cur=test;
    else { if(cur) lines.push(cur); cur=w; }
  });
  if(cur) lines.push(cur);
  return lines.length?lines:[""];
}
/* Assemble the object table. Byte offsets in the xref must be exact, so the body is
   built once as a string and the offsets read off it as it grows. */
function pdfAssemble(pages,title){
  const objs=[null,
    "<</Type/Catalog/Pages 2 0 R>>",
    "",                                                        /* 2 - page tree */
    "<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>",
    "<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding/WinAnsiEncoding>>",
    "<</Title("+pdfEsc(title)+")/Producer(MuSo admin panel)>>"];
  const first=objs.length, ids=[];
  pages.forEach((c,i)=>{
    const cid=first+i*2, pid=cid+1; ids.push(pid);
    objs[cid]="<</Length "+c.length+">>\nstream\n"+c+"\nendstream";
    objs[pid]="<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]"+
              "/Resources<</Font<</F1 3 0 R/F2 4 0 R>>>>/Contents "+cid+" 0 R>>";
  });
  objs[2]="<</Type/Pages/Count "+pages.length+"/Kids["+ids.map(i=>i+" 0 R").join(" ")+"]>>";
  let out="%PDF-1.4\n"; const off=[];
  for(let i=1;i<objs.length;i++){ off[i]=out.length; out+=i+" 0 obj\n"+objs[i]+"\nendobj\n"; }
  const xref=out.length;
  out+="xref\n0 "+objs.length+"\n0000000000 65535 f \n";
  for(let i=1;i<objs.length;i++) out+=String(off[i]).padStart(10,"0")+" 00000 n \n";
  out+="trailer\n<</Size "+objs.length+"/Root 1 0 R/Info 5 0 R>>\nstartxref\n"+xref+"\n%%EOF";
  return out;
}

/* ---- Openings: the listings master ----------------------------------------- */
/* Where a role stands is two things read together: the admin's own on/off switch, and
   whether today sits inside its dates. Off is Inactive whatever the dates say; on, it is
   Live inside the window, Ended past it, and Active while it waits for the window. */
const ROLE_STATES = ["Live","Active","Inactive","Ended"];
function roleState(r){
  if(!r.active) return "Inactive";
  const today=new Date(); today.setHours(0,0,0,0);
  const from=parseDMY(r.posted), to=parseDMY(r.closes);
  if(to && today>to) return "Ended";
  if(from && today<from) return "Active";
  return (from||to) ? "Live" : "Active";
}
const ROLE_PILL = { Live:"pill-ok", Active:"pill-blue", Inactive:"pill-warn", Ended:"pill-off" };
const rolePill = r => `<span class="pill ${ROLE_PILL[roleState(r)]}"><i class="dot"></i>${roleState(r)}</span>`;

/* ---- Sorting, shared by the three careers tables -----------------------------
   A column says what value it sorts on and how to read it, so a date sorts as a date,
   a count as a number, and a status in its own order rather than alphabetically. */
let careerSort = {key:"", dir:1}, appSort = {key:"", dir:1}, querySort = {key:"", dir:1};

const SORTERS = { career:()=>careerSort, app:()=>appSort, qry:()=>querySort };

function sortRows(rows, spec, sort){
  const col = sort && sort.key && spec[sort.key];
  if(!col) return rows;
  const read = v => {
    const raw = col.get(v);
    if(col.type==="date"){ const d=parseDMY(raw); return d?d.getTime():-Infinity; }
    if(col.type==="num")  return +raw||0;
    if(col.type==="rank"){ const i=col.rank.indexOf(raw); return i<0?col.rank.length:i; }
    return String(raw==null?"":raw).toLowerCase();
  };
  return [...rows].sort((a,b)=>{
    const x=read(a), y=read(b);
    return (x<y ? -1 : x>y ? 1 : 0) * sort.dir;
  });
}

/* A sortable header cell. The arrow shows which way, and which column is doing it. */
function sortTh(label, key, sort, cls){
  const on = sort.key===key;
  return `<th${cls?` class="${cls}"`:""}><button class="th-sort${on?" is-on":""}" data-sort="${key}"
    aria-label="Sort by ${label}">${label}<span class="th-arrow">${
      on ? (sort.dir>0 ? "▲" : "▼") : "⇅"}</span></button></th>`;
}

/* The next Role ID: the highest ROLE-nnn on file plus one. Never typed. */
function nextRoleId(){
  const n=CAREER_OPENINGS.reduce((mx,r)=>{
    const m=/ROLE-(\d+)/.exec(r.id); return m?Math.max(mx,+m[1]):mx; },0);

}

/* Search hides rows in place rather than re-rendering, so the caret stays put — the
   same thing the products and members lists do. The query is held in state only so a
   filter dropdown (which does re-render) does not silently drop it. */
function careerSearchRows(tableId, rowSel, emptySel, newSel, q, total, noun, countId){
  const tbl=document.getElementById(tableId); if(!tbl) return;
  const needle=(q||"").trim().toLowerCase(); let shown=0;
  tbl.querySelectorAll(rowSel).forEach(tr=>{
    const hit=!needle||(tr.dataset.search||"").includes(needle);
    tr.style.display=hit?"":"none"; if(hit) shown++;
  });
  const empty=tbl.querySelector(emptySel); if(empty) empty.style.display=shown?"none":"";
  if(newSel){ const nr=tbl.querySelector(newSel); if(nr) nr.style.display=needle?"none":""; }
  const cnt=countId&&document.getElementById(countId);
  if(cnt) cnt.textContent=needle?`${shown} of ${total} ${noun}`:`${total} ${noun}`;
}
/* The button only earns its place on a question that is actually clipped, so it is
   rendered for every row and then measured away on the ones that fit in two lines. */
function syncQueryClamps(){
  document.querySelectorAll("#qryTable .qry-text").forEach(td=>{
    const q=td.querySelector(".qry-q"), btn=td.querySelector(".qry-more");
    if(!q||!btn) return;
    const open=q.classList.contains("is-open");
    btn.classList.toggle("is-shown", open || q.scrollHeight > q.clientHeight + 1);
  });
}

const syncCareerSearch = () => {

/* Opening a CV serves the file the candidate attached. There is no file store behind
   this build, so it serves a stand-in that says so rather than inventing a CV — the
   wiring, the filename and the route are real, only the bytes are a placeholder. */
function careerCvPdf(a){
  const role=roleById(a.role)||{title:"—"};
  const W=595,H=842,ML=56,MR=56, CW=W-ML-MR;
  const BLUE="0.184 0.467 0.737", INK="0.082 0.102 0.118",
        INK2="0.353 0.388 0.420", INK3="0.541 0.576 0.612";
  let ops=[], y=H-64;
  const line=(t,x,size,bold,rgb,tc)=>ops.push(
    "BT "+(tc||0)+" Tc /F"+(bold?2:1)+" "+size+" Tf "+(rgb||INK)+" rg "+
    "1 0 0 1 "+x.toFixed(1)+" "+y.toFixed(1)+" Tm ("+pdfEsc(t)+") Tj ET");
  const para=(t,size,bold,lead,rgb)=>pdfWrap(t,size,bold,CW).forEach(l=>{ line(l,ML,size,bold,rgb); y-=lead; });
  line("MUSEUM OF SOLUTIONS  /  ATTACHMENT",ML,8,true,BLUE,1.4); y-=22;
  para(a.cv.name,18,true,24,INK); y-=4;
  para(a.name+"  -  "+a.id+"  -  applied for "+role.title,11,false,16,INK2); y-=12;
  ops.push("q "+BLUE+" RG 1.6 w "+ML+" "+y.toFixed(1)+" m "+(W-MR)+" "+y.toFixed(1)+" l S Q"); y-=26;
  para("Uploaded "+a.on+"  -  "+humanSize(a.cv.size),10.5,false,17,INK2); y-=10;
  para("This is the file the candidate attached to their application. In the live panel this "+
       "opens the uploaded document itself, served from the application store and also present "+
       "as the attachment on the mail sent to "+HR_EMAIL+".",10.5,false,15.5,INK2); y-=8;
  para("This build has no file store behind it, so it serves this page in place of the "+
       "document rather than showing an invented CV.",10.5,false,15.5,INK3);
  ops.push("q 0.878 0.898 0.918 RG 0.8 w "+ML+" 56 m "+(W-MR)+" 56 l S Q");
  ops.push("BT 0 Tc /F1 8 Tf "+INK3+" rg 1 0 0 1 "+ML+" 40 Tm ("+
    pdfEsc("Museum of Solutions  -  "+a.id+"  -  "+a.cv.name)+") Tj ET");
  return pdfAssemble([ops.join("\n")], a.cv.name);
}

function careerOpenPdf(str,file){
  const bytes=new Uint8Array(str.length);
  for(let i=0;i<str.length;i++) bytes[i]=str.charCodeAt(i)&0xFF;
  const url=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));
  const win=window.open(url,"_blank");
  if(!win){ const el=document.createElement("a"); el.href=url; el.download=file;
            document.body.appendChild(el); el.click(); el.remove(); }
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}

/* Editing a role happens in a right-side flyout, the same shape the discount form
   uses for "Items & quantity" — the list or detail page stays put behind it. */

/* Shared by create and save: the three the careers page cannot do without. */
function roleFormRead(){
  const form=document.querySelector("#pane .product-form");
  if(!form) return null;
  const get=n=>{ const f=form.querySelector(`.fld[data-df="${n}"]`); if(!f) return "";
    const el=f.querySelector("select,textarea,input"); return el?el.value.trim():""; };
  const dates=form.querySelector('.fld[data-df="posted / closes"]');
  const dpart=k=>dates?(dates.querySelector(`[data-dpart="${k}"]`)||{}).value||"":"";
  const picked=(form.querySelector('.fld[data-df="jd"] input[type=file]')||{}).files;
  const swOf=n=>{ const b=form.querySelector(`.fld[data-df="${n}"] .sw`); return b?b.dataset.on==="1":null; };
  const sw=form.querySelector('.fld[data-df="active"] .sw');
  const vals={ title:get("title"), dept:get("dept"), type:get("type"), loc:get("loc"),
               exp:get("exp"), about:get("about"), posted:dpart("posted").trim(), closes:dpart("closes").trim(),
               jd:(picked&&picked.length)?{name:picked[0].name,size:picked[0].size}:null,
               active: sw ? sw.dataset.on==="1" : true,
               portfolio: swOf("portfolio")===null ? false : swOf("portfolio") };
  const LABEL={title:"Position",loc:"Location",exp:"Experience",about:"About the role"};
  const missing=Object.keys(LABEL).filter(n=>!vals[n]);
  Object.keys(LABEL).forEach(n=>form.querySelector(`.fld[data-df="${n}"]`)?.classList.toggle("is-miss",!vals[n]));
  const box=document.getElementById("roleErr");
  if(missing.length){
    if(box) box.textContent="Still needed: "+missing.map(n=>LABEL[n]).join(", ")+".";
    return null;
  }
  if(box) box.textContent="";
  return vals;
}

/* A new opening. The ID is generated here, which is why the form never asked for one. */
function careerCreate(){
  const v=roleFormRead();
  if(!v) return;
  const clean=x=>(x && !/^Select/.test(x)) ? x : "";
  CAREER_OPENINGS.unshift({
    id:nextRoleId(), title:v.title, dept:clean(v.dept)||"—", loc:v.loc,
    type:clean(v.type)||"Full-time", exp:v.exp, active:v.active,
    posted:v.posted||fmtDMY(new Date()), closes:v.closes||"", applicants:0,
    about:v.about, jd:v.jd, portfolio:!!v.portfolio
  });
  tab="list"; carsub="openings"; render(); $(".stage").scrollTop=0;
}

/* Read the edit page back onto the record. */
function careerSaveEdit(){
  const r=roleById(selCareer), v=roleFormRead();
  if(!r||!v) return;
  r.active=v.active; r.portfolio=!!v.portfolio;
  const set=(k,val)=>{ if(val && !/^Select/.test(val)) r[k]=val; };
  ["title","dept","type","loc","exp","about","posted","closes"].forEach(k=>set(k,v[k]));
  if(v.jd) r.jd=v.jd;                       // a new upload replaces what was there
  tab="detail"; render(); $(".stage").scrollTop=0;
}

  const w=String(t||"").trim().split(/\s+/).filter(Boolean);
  return w.length<=QUERY_WORD_CAP ? String(t||"").trim() : w.slice(0,QUERY_WORD_CAP).join(" ")+"\u2026";

/* Parse a "DD Mon YYYY" string to a Date (null if unparseable). */
function parseDMY(str){
  const m=/(\d{1,2})\s+([A-Za-z]{3,})\s+(\d{4})/.exec(str||"");
  if(!m) return null;
  const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  const mo=MON[m[2].slice(0,3).toLowerCase()];
  if(mo===undefined) return null;
  const dt=new Date(+m[3],mo,+m[1]);
  return isNaN(dt.getTime())?null:dt;
}
/* One session per calendar day between a batch's from/to dates. */
function genBatchDays(from,to,t1,t2){
  const a=parseDMY(from), b=parseDMY(to);
  if(!a||!b||b<a) return [];
  const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const days=[], cur=new Date(a); let guard=0;
  while(cur<=b && guard++<400){
    days.push({ d:`${WD[cur.getDay()]} ${String(cur.getDate()).padStart(2,"0")} ${MO[cur.getMonth()]}`, t1:t1||"10:00", t2:t2||"13:00" });
    cur.setDate(cur.getDate()+1);
  }
  return days;
}

/* ---- POS cart helpers — shared by bookingForm() (display) and the click handlers (state changes) ---- */
function slotLeft(s){ if(!s||s.cap==null) return Infinity; return Math.max(0,(s.cap||0)-(s.sold||0)); }
/* Availability status from seats left vs capacity: none left = Sold out, ≤25% left = Fast filling, else Available. */
function availState(left,cap){
  if(left===Infinity||cap==null) return null;
  if(left<=0) return {key:"sold",label:"Sold out"};
  if(cap>0 && left<=cap*0.25) return {key:"low",label:"Fast filling"};
  return {key:"ok",label:"Available"};
}
function firstAvailableSlot(list){ return list.find(s=>slotLeft(s)>0) || list[0]; }
/* ---- membership helpers ---- */
function tierOf(name){ return MEMBERSHIP_TIERS.find(t=>t.name===name||t.id===name)||null; }
function isUnlimited(m){ return m.visitsTotal==="Unlimited"; }
function visitsBalance(m){ return isUnlimited(m)?Infinity:Math.max(0,(+m.visitsTotal||0)-(+m.visitsUsed||0)); }
function visitsLabel(m){ return isUnlimited(m)?"Unlimited visits":`${m.visitsUsed||0} of ${m.visitsTotal||0} visits used`; }
function pairLabel(m){ return `${m.adult} (adult) + ${m.child} (child)`; }
function memberStatus(m){
  const exp=parseDMY(m.expires), today=parseDMY(MEMBER_TODAY);
  if(!exp||!today) return {key:"ok",label:"Active",daysLeft:null};
  const daysLeft=Math.round((exp-today)/86400000);
  if(daysLeft<0) return {key:"expired",label:"Expired",daysLeft};
  if(daysLeft<=30) return {key:"soon",label:"Expiring soon",daysLeft};
  return {key:"ok",label:"Active",daysLeft};
}
function memberStatusPill(m){ const s=memberStatus(m); const cls=s.key==="expired"?"pill-off":s.key==="soon"?"pill-draft":"pill-ok"; return `<span class="pill ${cls}">${s.key==="ok"?'<i class="dot"></i>':""}${s.label}</span>`; }
function tierPill(name){ const t=tierOf(name), id=t?t.id:""; const cls=["silver","gold","platinum"].includes(id)?("tier-"+id):"tier-x"; return `<span class="pill ${cls}">${name}</span>`; }
function primaryCatFor(kind,id){
  if(kind==="prod") return P[+id].cats[0];
  if(kind==="addon"){ const a=P.find(x=>x.c===id); return a?a.cats[0]:"Adult"; }

/* ---- calendar date <-> slot matching, for the Products/Add-ons time-slot picker ----
   A slot's "days" (e.g. "Tue – Fri") and "from"/"to" date range are real data; blackout
   dates are sample data (the file has no real blackout-date records yet), same spirit
   as the cap/sold numbers added for spots-left. Blackout always wins over any slot. */
const WEEKDAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
/* Blackout dates master — closures. Whole-museum rows shut the whole date; the
   narrower rows disable one product or one time slot. */
const BLACKOUT_DATES=[
  {date:"15 Aug 2026", scope:"whole museum", product_id:"",           reason:"Independence Day"},
  {date:"02 Oct 2026", scope:"whole museum", product_id:"",           reason:"Gandhi Jayanti"},
  {date:"01 Nov 2026", scope:"one product",  product_id:"Mini Golf",  reason:"Green maintenance"},
  {date:"25 Dec 2026", scope:"whole museum", product_id:"",           reason:"Christmas"},
  {date:"26 Jan 2027", scope:"whole museum", product_id:"",           reason:"Republic Day"}
];
const BLACKOUTS=BLACKOUT_DATES.filter(b=>b.scope==="whole museum").map(b=>b.date);
function parseDMY(str){ const m=/^(\d{1,2})\s+(\w{3})\s+(\d{4})$/.exec((str||"").trim()); if(!m) return null; const mi=MONTHS.indexOf(m[2]); if(mi<0) return null; return new Date(+m[3],mi,+m[1]); }
function fmtDMY(d){ return String(d.getDate()).padStart(2,"0")+" "+MONTHS[d.getMonth()]+" "+d.getFullYear(); }
function dayIndexMon0(d){ return (d.getDay()+6)%7; } // 0=Mon .. 6=Sun
function dateMatchesDays(d,daysStr){
  const parts=(daysStr||"").split(/[–-]/).map(s=>s.trim());
  const start=WEEKDAYS.indexOf(parts[0]), end=WEEKDAYS.indexOf(parts[1]!=null?parts[1]:parts[0]);
  if(start<0||end<0) return true; // unparseable pattern — don't block on it
  const idx=dayIndexMon0(d);
  return start<=end ? (idx>=start&&idx<=end) : (idx>=start||idx<=end);
}
function dateInSlotRange(d,s){ const from=parseDMY(s.from),to=parseDMY(s.to); if(!from||!to) return false; return d>=from&&d<=to; }
function isBlackout(dateStr){ return BLACKOUT_DATES.some(b=>b.scope==="whole museum"&&b.date===dateStr); }
function slotsForDate(slots,dateStr){
  if(!dateStr||isBlackout(dateStr)) return [];
  const d=parseDMY(dateStr); if(!d) return [];
  return (slots||[]).filter(s=>dateInSlotRange(d,s)&&dateMatchesDays(d,s.days));
}
function defaultDateFor(slots){
  const today=new Date();
  for(let i=0;i<400;i++){
    const d=new Date(today.getFullYear(),today.getMonth(),today.getDate()+i);
    const ds=fmtDMY(d);
    if(slotsForDate(slots,ds).length) return ds;
  }
  const first=(slots&&slots[0])||{}; return first.from||fmtDMY(today);
}
function currentCalBaseDate(){
  if(bookingCalMonth) return bookingCalMonth;
  if(bookingOpenItem){ const [kind,id]=bookingOpenItem.split("|"); const cfg=getCartCfg(kind,id); if(cfg&&cfg.date){ const d=parseDMY(cfg.date); if(d) return d; } }
  return new Date();
}

// A fresh combination for an item: products/add-ons get {date, slot, qty(,redeem)}; programs get {batch, qty}.
function firstComboFor(kind,id){
  if(kind==="prog"){ const rec=progRecFor(id); const batches=(rec&&rec.batches)||[]; let bi=batches.findIndex(b=>slotLeft(b)>0); if(bi<0) bi=0; return {batch:bi,qty:{}}; }
  const slots=kind==="prod"?P[+id].slots:((P.find(x=>x.c===id)||{}).slots||[]);
  const d=defaultDateFor(slots);
  const s=slotsForDate(slots,d).find(x=>slotLeft(x)>0)||slotsForDate(slots,d)[0]||firstAvailableSlot(slots);
  const combo={date:d,slot:s?s.n:"",qty:{}}; if(kind==="prod") combo.redeem={}; return combo;
}
function ensureCartEntry(kind,id){
  // One cart entry per item, holding an array of independent {date+slot+tickets} (or {batch+tickets})
  // combinations — the "Add Ticket" button appends more, so an item can be booked across several
  // dates/times/batches in the same order.
  if(kind==="prod"){ const i=+id; if(!bookingProducts.has(i)) bookingProducts.set(i,{combos:[firstComboFor("prod",i)]}); }
  else if(kind==="addon"){ if(!bookingAddons.has(id)) bookingAddons.set(id,{combos:[firstComboFor("addon",id)]}); }
  else if(kind==="prog"){ if(!bookingPrograms.has(id)) bookingPrograms.set(id,{combos:[firstComboFor("prog",id)]}); }
}
function progRecFor(id){ const [k,idx]=id.split(":"); return k==="event"?EVENTS[+idx]:WORKSHOPS[+idx]; }
function getCartCfg(kind,id){ return kind==="prod"?bookingProducts.get(+id):kind==="addon"?bookingAddons.get(id):bookingPrograms.get(id); }
function removeCartEntry(kind,id){ if(kind==="prod") bookingProducts.delete(+id); else if(kind==="addon") bookingAddons.delete(id); else bookingPrograms.delete(id); }
function hasBookingItems(){
  const sum=cfg=>((cfg&&cfg.combos)||[]).reduce((a,combo)=>a+Object.values(combo.qty||{}).reduce((x,n)=>x+ +n,0)+Object.values(combo.redeem||{}).reduce((x,n)=>x+ +n,0),0);
  return [...bookingProducts.values()].some(c=>sum(c)>0)||[...bookingAddons.values()].some(c=>sum(c)>0)||[...bookingPrograms.values()].some(c=>sum(c)>0);
}
/* Membership visits the matched member has left — one per redeemed Ticket (combination) of the Tour. */
function globalPassesRemaining(){
  const member=bookingCustomer.member; if(!member) return 0;
  const base=Math.max(0,member.passesTotal-member.passesUsed);
  if(!membershipVisitApplies()) return base;
  let used=0; [...bookingProducts].forEach(([i,cfg])=>{ if(P[i]&&P[i].c==="MUSO") ((cfg&&cfg.combos)||[]).forEach(combo=>{ if(combo.redeemVisit&&isVisitSlot((P[i].slots||[]).find(s=>s.n===combo.slot))) used++; }); });

/* A membership visit is offered only for a plain MuSo Tour booking: the Tour must be in the cart,
   with no add-ons and no other products (programs are allowed — they get the auto member discount). */
function membershipVisitApplies(){
  const member=bookingCustomer.member; if(!member) return false;
  const keys=[...bookingProducts.keys()];
  if(!keys.some(i=>P[i]&&P[i].c==="MUSO")) return false;   // Tour must be selected
  if(keys.some(i=>P[i]&&P[i].c!=="MUSO")) return false;    // any other product hides it
  const addonSelected=[...bookingAddons.values()].some(cf=>((cf&&cf.combos)||[]).some(combo=>Object.values(combo.qty||{}).some(n=>+n>0)));
  return !addonSelected;                                    // any add-on hides it
}
/* The membership visit is offered only for the MuSo Tour's 14:00–19:00 slot (the Five-hour afternoon). */
function isVisitSlot(s){ return !!(s && s.t1==="14:00" && s.t2==="19:00"); }

function recalcBookingSummary(showMessage=false){
  const inputs=[...document.querySelectorAll("[data-bookqty]")];
  const subtotal=inputs.reduce((sum,input)=>sum+(bookingQtyValue(input)*(+input.dataset.unit||0)),0);
  const code=bookingDiscountCode.trim().toUpperCase();
  const discount=code?DISCOUNTS.find(d=>d.status==="Approved"&&!applyInfo(d).auto&&(String(d.n||"").toUpperCase()===code||(d.cond||[]).some(c=>String(c.code||"").toUpperCase()===code)||(isSeries(d)&&code.startsWith(String(d.series.prefix||"").toUpperCase())&&(()=>{const n=parseInt(code.replace(/\D/g,""),10);return !isNaN(n)&&n>=+d.series.from&&n<=+d.series.to;})()))):null;
  let amount=0;
  if(discount){ amount=String(discount.v).includes("%")?subtotal*(parseFloat(discount.v)||0)/100:Math.min(subtotal,parseFloat(String(discount.v).replace(/[^0-9.]/g,""))||0); }
  const subtotalEl=document.getElementById("bookingSubtotal"), discountEl=document.getElementById("bookingDiscountAmount"), totalEl=document.getElementById("bookingTotal"), msg=document.getElementById("bookingDiscountMessage");

  if(msg&&showMessage) msg.textContent=!code?"Enter a discount code.":discount?`${discount.n} applied.`:"Code is invalid or unavailable.";
}

/* Whole years from a DD/MM/YYYY date of birth to today; null if incomplete/invalid. */
function ageFromDOB(str){
  const m=/^\s*(\d{1,2})\/(\d{1,2})\/(\d{4})\s*$/.exec(str||"");
  if(!m) return null;
  const d=+m[1], mo=+m[2], y=+m[3];
  if(mo<1||mo>12||d<1||d>31||y<1900) return null;
  const today=new Date();
  let age=today.getFullYear()-y;
  const hadBirthday=(today.getMonth()+1>mo)||(today.getMonth()+1===mo&&today.getDate()>=d);
  if(!hadBirthday) age--;
  if(age<0||age>120) return null;
  return age;
}
function ageLabel(str){ const a=ageFromDOB(str); return a===null?"":(a===0?"Under 1 yr":a+(a===1?" yr":" yrs")); }

  if(e.target.classList&&e.target.classList.contains("msel-search")){
    const q=e.target.value.trim().toLowerCase(), wrap=e.target.closest(".msel");
    if(wrap) wrap.querySelectorAll(".msel-opt").forEach(o=>{ o.style.display=(!q||(o.dataset.label||"").includes(q))?"":"none"; });
    return;
  }
  if(e.target.id==="shopSelling"){ shopRecalcForm(); return; }   // new-product form: recompute GST + Base as Selling price is typed
  if(e.target.id==="shopCost"){ shopCostTouched=true; return; }   // Cost price manually overridden — stop following Base
  if(e.target.id==="shopPhone"){ shopCustomer.phone=e.target.value; return; }
  if(e.target.id==="shopName"){ shopCustomer.name=e.target.value; return; }
  if(e.target.id==="shopEmail"){ shopCustomer.email=e.target.value; return; }
  if(e.target.id==="shopGstin"){ shopCustomer.gstin=e.target.value; return; }
  if(e.target.id==="shopCouponCode"){ shopCouponCode=e.target.value; return; }
  if(e.target.matches&&e.target.matches("[data-shop-search]")){
    const q=e.target.value.trim().toLowerCase(); const tbl=document.getElementById("shopItemsTable"); if(!tbl) return;
    let shown=0;
    tbl.querySelectorAll("[data-shop-row]").forEach(r=>{ const hit=!q||(r.dataset.search||"").includes(q); r.style.display=hit?"":"none"; if(hit) shown++; });
    const empty=tbl.querySelector("[data-shop-empty]"); if(empty) empty.style.display=shown?"none":"";
    const nr=tbl.querySelector("[data-shop-newrow]"); if(nr) nr.style.display=q?"none":"";
    const cnt=document.getElementById("shopCount"); if(cnt) cnt.textContent=q?(shown+" of "+SHOP_ITEMS.length+" products"):(SHOP_ITEMS.length+" products");
    return;
  }
  if(e.target.matches&&e.target.matches("[data-member-search]")){
    const q=e.target.value.trim().toLowerCase(), qd=q.replace(/\D/g,"");
    const tbl=document.getElementById("membersTable"); if(!tbl) return;
    let shown=0;
    tbl.querySelectorAll("[data-member-row]").forEach(r=>{ const hay=r.dataset.search||"";
      const hit=!q||hay.includes(q)||(qd&&hay.replace(/\D/g,"").includes(qd));
      r.style.display=hit?"":"none"; if(hit) shown++; });
    const empty=tbl.querySelector("[data-member-empty]"); if(empty) empty.style.display=shown?"none":"";
    const addrow=tbl.querySelector("[data-member-addrow]"); if(addrow) addrow.style.display=q?"none":"";
    const cnt=document.getElementById("memberCount"); if(cnt) cnt.textContent=q?(shown+" of "+MEMBERS.length+" members"):(MEMBERS.length+" members");
    return;
  }
  if(e.target.matches&&e.target.matches("[data-utm]")){ captureUtmFlyout(); const el=document.getElementById("shareLinkPreview"); if(el) el.textContent=shareLink(curDiscount()); return; }
  if(e.target.matches&&e.target.matches("[data-series]")){ syncDiscountForm(); const el=document.getElementById("seriesPreview"); if(el){ const s=curDiscount().series||{}; const err=seriesError(s);
      if(err){ el.textContent=err; el.style.color="var(--stop)"; }
      else{ const list=seriesCodes(s,4),n=seriesCount(s); el.textContent=`${list.slice(0,3).join(", ")}${n>3?` … ${seriesCode(s,Math.floor(+s.to||0))}`:""} · ${n.toLocaleString()} code${n===1?"":"s"}`; el.style.color="var(--blue)"; } }
    return; }
  if(!e.target.matches("[data-bookqty]")){ refreshDiscountSummaries(); return; }
  const qty=Math.max(0,+e.target.value||0), unit=+e.target.dataset.unit||0, index=e.target.dataset.bookindex;
  const summary=document.querySelector(`[data-summary-line="${index}"]`);
  if(summary){ summary.querySelector("[data-summary-qty]").textContent=qty; summary.querySelector("[data-summary-amount]").textContent=money(qty*unit); }
  recalcBookingSummary(false);
  renderBookingAttendees();
});
document.addEventListener("input",e=>{
  if(e.target.id==="bookCustName"){ bookingCustomer.name=e.target.value; return; }
  if(e.target.id==="bookCustLocation"){ bookingCustomer.location=e.target.value; return; }
  if(e.target.id==="bookCustPincode"){ bookingCustomer.pincode=e.target.value; return; }
  if(e.target.id==="bookCustGstin"){ bookingCustomer.gstin=e.target.value; return; }
  if(e.target.id==="bookCustEmail"){ bookingCustomer.email=e.target.value; return; }
  if(e.target.id==="bookCustPhone"){
    bookingCustomer.phone=e.target.value; bookingCustomerLinked=-1; bookingCustomer.member=null;
    const box=document.getElementById("custSuggest"); if(!box) return;
    const digits=e.target.value.replace(/\D/g,"");
    if(digits.length<10){ box.innerHTML=""; return; }
    const matches=CUSTOMERS.filter(c=>c.phone.replace(/\D/g,"").startsWith(digits)).slice(0,4);
    box.innerHTML=matches.length?matches.map(c=>`<button type="button" class="cust-suggest-row" data-pick-customer="${escAttr(c.phone)}"><span class="cust-suggest-name">${c.name}</span><span class="cust-suggest-phone">${c.phone}</span></button>`).join(""):"";
  }
});

/* hover / focus tooltips — description + impact (watch for) */
const tipbox=document.createElement("div"); tipbox.className="tipbox"; document.body.appendChild(tipbox);
function showTip(t){
  const d=t.dataset.tip||"", im=t.dataset.impact||"";
  tipbox.innerHTML="";
  if(d){ const p=document.createElement("div"); p.className="tip-desc"; p.textContent=d; tipbox.appendChild(p); }
  if(im){ const p=document.createElement("div"); p.className="tip-impact";
    const s=document.createElement("span"); s.textContent="Watch for"; p.appendChild(s);
    p.appendChild(document.createTextNode(im)); tipbox.appendChild(p); }
  const r=t.getBoundingClientRect();
  tipbox.style.left=(r.left+r.width/2)+"px"; tipbox.style.top=(r.top-6)+"px"; tipbox.classList.add("on"); }
document.addEventListener("mouseover",e=>{ const t=e.target.closest&&e.target.closest(".tip"); if(t) showTip(t); });
document.addEventListener("mouseout",e=>{ if(e.target.closest&&e.target.closest(".tip")) tipbox.classList.remove("on"); });
document.addEventListener("focusin",e=>{ const t=e.target.closest&&e.target.closest(".tip"); if(t) showTip(t); });
document.addEventListener("focusout",e=>{ if(e.target.closest&&e.target.closest(".tip")) tipbox.classList.remove("on"); });

schoolBackfillEmails();
spBackfillEmails();
render();

</script>
</body>
